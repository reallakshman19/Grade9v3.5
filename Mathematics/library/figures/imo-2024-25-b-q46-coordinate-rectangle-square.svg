<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 560" role="img" aria-label="Coordinate grid showing rectangle ABCD in first quadrant and square PQRS in third quadrant" font-family="system-ui, sans-serif">
  <title>Coordinate Grid with Rectangle ABCD and Square PQRS</title>
  <desc>Cartesian coordinate plane with axes X and Y. Rectangle ABCD has vertices at A(2, 2), B(6, 2), C(6, 4), and D(2, 4). Square PQRS has vertices at P(-4, -6), Q(-1, -6), R(-1, -3), and S(-4, -3).</desc>
  <style>
    .grid-line { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); marker-start: url(#arrow); }
    .rect-shape { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .square-shape { fill: #fef2f2; stroke: #dc2626; stroke-width: 3; }
    .label { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .tick-label { font-size: 14px; fill: #64748b; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Origin at (330, 240). Scale: 1 unit = 35 px -->
  <!-- X Axis at y=240, from x=50 to x=680 -->
  <line x1="50" y1="240" x2="680" y2="240" class="axis"/>
  <text x="690" y="246" class="label">X</text>
  <text x="30" y="246" class="label">X'</text>

  <!-- Y Axis at x=330, from y=520 to y=50 -->
  <line x1="330" y1="520" x2="330" y2="50" class="axis"/>
  <text x="338" y="45" class="label">Y</text>
  <text x="338" y="540" class="label">Y'</text>
  <text x="312" y="258" class="label">0</text>

  <!-- Ticks on X: -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6 -->
  <!-- -4 is 330 - 4*35 = 190 -->
  <!-- -1 is 330 - 1*35 = 295 -->
  <!-- +2 is 330 + 2*35 = 400 -->
  <!-- +6 is 330 + 6*35 = 540 -->
  <line x1="190" y1="235" x2="190" y2="245" stroke="#64748b" stroke-width="1.5"/><text x="190" y="260" class="tick-label">-4</text>
  <line x1="295" y1="235" x2="295" y2="245" stroke="#64748b" stroke-width="1.5"/><text x="295" y="260" class="tick-label">-1</text>
  <line x1="400" y1="235" x2="400" y2="245" stroke="#64748b" stroke-width="1.5"/><text x="400" y="260" class="tick-label">2</text>
  <line x1="540" y1="235" x2="540" y2="245" stroke="#64748b" stroke-width="1.5"/><text x="540" y="260" class="tick-label">6</text>

  <!-- Ticks on Y: 2, 4, -3, -6 -->
  <!-- +2 is 240 - 2*35 = 170 -->
  <!-- +4 is 240 - 4*35 = 100 -->
  <!-- -3 is 240 + 3*35 = 345 -->
  <!-- -6 is 240 + 6*35 = 450 -->
  <line x1="325" y1="170" x2="335" y2="170" stroke="#64748b" stroke-width="1.5"/><text x="315" y="175" class="tick-label">2</text>
  <line x1="325" y1="100" x2="335" y2="100" stroke="#64748b" stroke-width="1.5"/><text x="315" y="105" class="tick-label">4</text>
  <line x1="325" y1="345" x2="335" y2="345" stroke="#64748b" stroke-width="1.5"/><text x="315" y="350" class="tick-label">-3</text>
  <line x1="325" y1="450" x2="335" y2="450" stroke="#64748b" stroke-width="1.5"/><text x="315" y="455" class="tick-label">-6</text>

  <!-- Rectangle ABCD: A(400, 170), B(540, 170), C(540, 100), D(400, 100) -->
  <rect x="400" y="100" width="140" height="70" class="rect-shape"/>
  <circle cx="400" cy="170" r="4" fill="#2563eb"/><text x="385" y="188" class="label">A</text>
  <circle cx="540" cy="170" r="4" fill="#2563eb"/><text x="545" y="188" class="label">B</text>
  <circle cx="540" cy="100" r="4" fill="#2563eb"/><text x="545" y="92" class="label">C</text>
  <circle cx="400" cy="100" r="4" fill="#2563eb"/><text x="385" y="92" class="label">D</text>

  <!-- Square PQRS: P(190, 450), Q(295, 450), R(295, 345), S(190, 345) -->
  <rect x="190" y="345" width="105" height="105" class="square-shape"/>
  <circle cx="190" cy="450" r="4" fill="#dc2626"/><text x="175" y="468" class="label">P</text>
  <circle cx="295" cy="450" r="4" fill="#dc2626"/><text x="302" y="468" class="label">Q</text>
  <circle cx="295" cy="345" r="4" fill="#dc2626"/><text x="302" y="340" class="label">R</text>
  <circle cx="190" cy="345" r="4" fill="#dc2626"/><text x="175" y="340" class="label">S</text>
</svg>
