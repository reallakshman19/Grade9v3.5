<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <title>Male and Female Teachers Double Line Graph - IMO Class 9 2023-24 Set A Q30-31</title>
  <desc>Double line graph showing number of male and female teachers across cities P, Q, R, S, T</desc>
  <rect width="540" height="380" fill="#ffffff" />
  
  <!-- Title / Legend -->
  <g transform="translate(320, 25)" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
    <!-- Male legend -->
    <line x1="0" y1="10" x2="35" y2="10" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="17.5" cy="10" r="3.5" fill="#0f172a" />
    <text x="45" y="14" fill="#0f172a">Male teachers</text>
    
    <!-- Female legend -->
    <line x1="0" y1="30" x2="35" y2="30" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" />
    <circle cx="17.5" cy="30" r="3.5" fill="#2563eb" />
    <text x="45" y="34" fill="#2563eb">Female teachers</text>
  </g>
  
  <!-- Axis parameters:
       Origin: (90, 310)
       Y-range: 0 to 2000, 200 units = 24px => 2000 = 240px (y = 70)
       X-range: Cities P, Q, R, S, T at x = 140, 215, 290, 365, 440
  -->
  <!-- Grid lines -->
  <g stroke="#f1f5f9" stroke-width="1.2">
    <line x1="90" y1="286" x2="480" y2="286" /> <!-- 200 -->
    <line x1="90" y1="262" x2="480" y2="262" /> <!-- 400 -->
    <line x1="90" y1="238" x2="480" y2="238" /> <!-- 600 -->
    <line x1="90" y1="214" x2="480" y2="214" /> <!-- 800 -->
    <line x1="90" y1="190" x2="480" y2="190" /> <!-- 1000 -->
    <line x1="90" y1="166" x2="480" y2="166" /> <!-- 1200 -->
    <line x1="90" y1="142" x2="480" y2="142" /> <!-- 1400 -->
    <line x1="90" y1="118" x2="480" y2="118" /> <!-- 1600 -->
    <line x1="90" y1="94" x2="480" y2="94" />   <!-- 1800 -->
    <line x1="90" y1="70" x2="480" y2="70" />   <!-- 2000 -->
  </g>
  
  <!-- Axes -->
  <g stroke="#0f172a" stroke-width="2">
    <!-- X-axis -->
    <line x1="90" y1="310" x2="495" y2="310" />
    <polygon points="500,310 492,306 492,314" fill="#0f172a" />
    <!-- Y-axis -->
    <line x1="90" y1="310" x2="90" y2="55" />
    <polygon points="90,50 86,58 94,58" fill="#0f172a" />
  </g>
  
  <!-- Ticks and Labels on Y-axis -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="end" dominant-baseline="central">
    <line x1="84" y1="310" x2="90" y2="310" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="310">0</text>
    
    <line x1="84" y1="286" x2="90" y2="286" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="286">200</text>
    
    <line x1="84" y1="262" x2="90" y2="262" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="262">400</text>
    
    <line x1="84" y1="238" x2="90" y2="238" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="238">600</text>
    
    <line x1="84" y1="214" x2="90" y2="214" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="214">800</text>
    
    <line x1="84" y1="190" x2="90" y2="190" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="190">1000</text>
    
    <line x1="84" y1="166" x2="90" y2="166" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="166">1200</text>
    
    <line x1="84" y1="142" x2="90" y2="142" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="142">1400</text>
    
    <line x1="84" y1="118" x2="90" y2="118" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="118">1600</text>
    
    <line x1="84" y1="94" x2="90" y2="94" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="94">1800</text>
    
    <line x1="84" y1="70" x2="90" y2="70" stroke="#0f172a" stroke-width="1.8" />
    <text x="80" y="70">2000</text>
  </g>
  
  <text x="35" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" transform="rotate(-90 35 180)" text-anchor="middle">Number of teachers →</text>
  
  <!-- Ticks and Labels on X-axis -->
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <line x1="140" y1="310" x2="140" y2="316" stroke="#0f172a" stroke-width="1.8" />
    <text x="140" y="332">P</text>
    
    <line x1="215" y1="310" x2="215" y2="316" stroke="#0f172a" stroke-width="1.8" />
    <text x="215" y="332">Q</text>
    
    <line x1="290" y1="310" x2="290" y2="316" stroke="#0f172a" stroke-width="1.8" />
    <text x="290" y="332">R</text>
    
    <line x1="365" y1="310" x2="365" y2="316" stroke="#0f172a" stroke-width="1.8" />
    <text x="365" y="332">S</text>
    
    <line x1="440" y1="310" x2="440" y2="316" stroke="#0f172a" stroke-width="1.8" />
    <text x="440" y="332">T</text>
    
    <text x="290" y="360" font-size="13">Cities</text>
  </g>
  
  <!-- DATA SERIES 1: Male Teachers (Solid line)
       P: 1200 -> y = 310 - 1200*(24/200) = 310 - 144 = 166
       Q: 800  -> y = 310 - 800*(24/200) = 310 - 96 = 214
       R: 1100 -> y = 310 - 1100*(24/200) = 310 - 132 = 178
       S: 1500 -> y = 310 - 1500*(24/200) = 310 - 180 = 130
       T: 1700 -> y = 310 - 1700*(24/200) = 310 - 204 = 106
  -->
  <polyline points="140,166 215,214 290,178 365,130 440,106" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <g fill="#0f172a">
    <circle cx="140" cy="166" r="4.5" />
    <circle cx="215" cy="214" r="4.5" />
    <circle cx="290" cy="178" r="4.5" />
    <circle cx="365" cy="130" r="4.5" />
    <circle cx="440" cy="106" r="4.5" />
  </g>
  
  <!-- DATA SERIES 2: Female Teachers (Dashed line)
       P: 600  -> y = 310 - 600*(24/200) = 310 - 72 = 238
       Q: 1600 -> y = 310 - 1600*(24/200) = 310 - 192 = 118
       R: 1400 -> y = 310 - 1400*(24/200) = 310 - 168 = 142
       S: 1100 -> y = 310 - 1100*(24/200) = 310 - 132 = 178
       T: 800  -> y = 310 - 800*(24/200) = 310 - 96 = 214
  -->
  <polyline points="140,238 215,118 290,142 365,178 440,214" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="6 5" />
  <g fill="#2563eb">
    <circle cx="140" cy="238" r="4.5" />
    <circle cx="215" cy="118" r="4.5" />
    <circle cx="290" cy="142" r="4.5" />
    <circle cx="365" cy="178" r="4.5" />
    <circle cx="440" cy="214" r="4.5" />
  </g>
</svg>
