<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <title>Embedded Diamond Figure - IMO Class 9 2023-24 Set A Q01</title>
  <desc>Diamond figure rotated at 45 degrees with internal diagonals, chords, and transversal segments</desc>
  <rect width="300" height="300" fill="#ffffff" />
  
  <!-- Outer Diamond (Square rotated 45 deg) -->
  <polygon points="150,30 270,150 150,270 30,150" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Inner Diamond concentric -->
  <polygon points="150,65 235,150 150,235 65,150" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round" />
  
  <!-- Main diagonals -->
  <line x1="150" y1="30" x2="150" y2="270" stroke="#1e293b" stroke-width="2" />
  <line x1="30" y1="150" x2="270" y2="150" stroke="#1e293b" stroke-width="2" />
  
  <!-- Horizontal chord in upper half -->
  <line x1="85" y1="95" x2="215" y2="95" stroke="#1e293b" stroke-width="1.8" />
  
  <!-- Vertical chord in right half -->
  <line x1="235" y1="115" x2="235" y2="185" stroke="#1e293b" stroke-width="1.8" />
  
  <!-- Transversal lines inside diamond -->
  <line x1="65" y1="150" x2="235" y2="115" stroke="#1e293b" stroke-width="1.8" />
  <line x1="65" y1="150" x2="150" y2="200" stroke="#1e293b" stroke-width="1.8" />
  <line x1="150" y1="200" x2="235" y2="185" stroke="#1e293b" stroke-width="1.8" />
  <line x1="85" y1="95" x2="150" y2="150" stroke="#1e293b" stroke-width="1.8" />
  <line x1="150" y1="150" x2="215" y2="95" stroke="#1e293b" stroke-width="1.8" />
  <line x1="150" y1="150" x2="185" y2="235" stroke="#1e293b" stroke-width="1.8" />
</svg>
