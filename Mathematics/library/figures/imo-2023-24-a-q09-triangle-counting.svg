<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="100%">
  <title>Triangle Counting Figure - IMO Class 9 2023-24 Set A Q09</title>
  <desc>Composite geometric network containing 24 overlapping triangles</desc>
  <rect width="360" height="260" fill="#ffffff" />
  
  <g stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left square: x in [40, 120], y in [100, 180] -->
    <rect x="40" y="100" width="80" height="80" />
    <line x1="40" y1="100" x2="120" y2="180" />
    
    <!-- Right square: x in [200, 280], y in [100, 180] -->
    <rect x="200" y="100" width="80" height="80" />
    <line x1="200" y1="180" x2="280" y2="100" />
    
    <!-- Middle bay: top edge (120,100)-(200,100), crossing diagonals to bottom corners -->
    <line x1="120" y1="100" x2="200" y2="100" />
    <line x1="120" y1="100" x2="200" y2="180" />
    <line x1="200" y1="100" x2="120" y2="180" />
    
    <!-- Left Roof: Peak at (120, 30) -->
    <line x1="40" y1="100" x2="120" y2="30" />
    <line x1="120" y1="30" x2="120" y2="100" />
    <line x1="120" y1="30" x2="200" y2="100" />
    
    <!-- Right Roof: Peak at (200, 30) -->
    <line x1="280" y1="100" x2="200" y2="30" />
    <line x1="200" y1="30" x2="200" y2="100" />
    <line x1="200" y1="30" x2="120" y2="100" />
  </g>
</svg>
