<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-label="Equilateral triangle ABC in Cartesian coordinate system" font-family="system-ui, sans-serif">
  <title>Equilateral Triangle ABC in Coordinate Plane</title>
  <desc>Equilateral triangle ABC with base on the x-axis having vertices B at (5, 0) and C at (-5, 0), and apex A on the positive y-axis.</desc>
  <style>
    .axis { stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow-axis); marker-start: url(#arrow-axis); }
    .grid-tick { stroke: #64748b; stroke-width: 1.5; }
    .triangle { fill: #f0fdf4; stroke: #15803d; stroke-width: 3.5; stroke-linejoin: round; }
    .label { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .coord-label { font-size: 17px; font-weight: 600; fill: #0369a1; }
    .tick-num { font-size: 14px; fill: #64748b; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Axes -->
  <!-- X Axis: from 50 to 650 at y=360 -->
  <line x1="50" y1="360" x2="650" y2="360" class="axis"/>
  <text x="660" y="366" class="label">X</text>
  <text x="35" y="366" class="label">X'</text>

  <!-- Y Axis: from 450 to 50 at x=350 -->
  <line x1="350" y1="460" x2="350" y2="50" class="axis"/>
  <text x="358" y="45" class="label">Y</text>
  <text x="358" y="480" class="label">Y'</text>
  <text x="330" y="380" class="label">O</text>

  <!-- Ticks on X axis: scale: 1 unit = 40 px -->
  <!-- -5 at x = 350 - 200 = 150 -->
  <!-- +5 at x = 350 + 200 = 550 -->
  <line x1="150" y1="353" x2="150" y2="367" class="grid-tick"/>
  <line x1="190" y1="355" x2="190" y2="365" class="grid-tick"/>
  <line x1="230" y1="355" x2="230" y2="365" class="grid-tick"/>
  <line x1="270" y1="355" x2="270" y2="365" class="grid-tick"/>
  <line x1="310" y1="355" x2="310" y2="365" class="grid-tick"/>

  <line x1="390" y1="355" x2="390" y2="365" class="grid-tick"/>
  <line x1="430" y1="355" x2="430" y2="365" class="grid-tick"/>
  <line x1="470" y1="355" x2="470" y2="365" class="grid-tick"/>
  <line x1="510" y1="355" x2="510" y2="365" class="grid-tick"/>
  <line x1="550" y1="353" x2="550" y2="367" class="grid-tick"/>

  <text x="150" y="390" class="tick-num">-5</text>
  <text x="190" y="390" class="tick-num">-4</text>
  <text x="230" y="390" class="tick-num">-3</text>
  <text x="270" y="390" class="tick-num">-2</text>
  <text x="310" y="390" class="tick-num">-1</text>
  <text x="390" y="390" class="tick-num">1</text>
  <text x="430" y="390" class="tick-num">2</text>
  <text x="470" y="390" class="tick-num">3</text>
  <text x="510" y="390" class="tick-num">4</text>
  <text x="550" y="390" class="tick-num">5</text>

  <!-- Equilateral Triangle ABC -->
  <!-- Base length = 10 units = 400 px (from 150 to 550) -->
  <!-- Height = 5 * sqrt(3) ~= 8.66 units = 8.66 * 40 = 346.4 px -->
  <!-- Apex A at x=350, y = 360 - 346.4 = 13.6 px -> let's scale so apex is at y=80 -->
  <!-- With apex at (350, 80), C at (175, 360), B at (525, 360) -->
  <polygon points="350,80 150,360 550,360" class="triangle"/>

  <!-- Points and labels -->
  <!-- Apex A -->
  <circle cx="350" cy="80" r="5" fill="#15803d"/>
  <text x="365" y="85" class="label">A</text>

  <!-- Vertex C(-5, 0) -->
  <circle cx="150" cy="360" r="5" fill="#15803d"/>
  <text x="120" y="350" class="label">C</text>
  <text x="85" y="325" class="coord-label">(-5, 0)</text>

  <!-- Vertex B(5, 0) -->
  <circle cx="550" cy="360" r="5" fill="#15803d"/>
  <text x="560" y="350" class="label">B</text>
  <text x="550" y="325" class="coord-label">(5, 0)</text>
</svg>
