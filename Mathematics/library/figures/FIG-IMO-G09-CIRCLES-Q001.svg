<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-label="Circle with center O, chord AB and perpendicular OM" font-family="system-ui, -apple-system, sans-serif">
  <title>Perpendicular from Centre to Chord</title>
  <desc>Circle of radius 13 cm with chord AB of 24 cm. Perpendicular OM bisects AB into two 12 cm segments.</desc>
  <style>
    .circ { fill: rgba(56, 189, 248, 0.05); stroke: #38bdf8; stroke-width: 2.5; }
    .chord { stroke: #f8fafc; stroke-width: 3; stroke-linecap: round; }
    .rad { stroke: #818cf8; stroke-width: 2; stroke-dasharray: 6,4; }
    .perp { stroke: #34d399; stroke-width: 2.5; }
    .sq-perp { fill: none; stroke: #34d399; stroke-width: 1.8; }
    .pt { fill: #f8fafc; }
    .lbl { font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .lbl-dim { font-size: 14px; font-weight: 600; fill: #94a3b8; }
  </style>
  <circle cx="250" cy="200" r="160" class="circ"/>
  <!-- Centre O -->
  <circle cx="250" cy="200" r="4.5" class="pt"/>
  <text x="250" y="180" class="lbl" text-anchor="middle">O</text>

  <!-- Chord AB at y = 296 (OM = 96, radius = 160 -> half chord = sqrt(160^2 - 96^2) = 128) -->
  <line x1="122" y1="296" x2="378" y2="296" class="chord"/>
  <circle cx="122" cy="296" r="4.5" class="pt"/>
  <text x="105" y="302" class="lbl">A</text>
  <circle cx="378" cy="296" r="4.5" class="pt"/>
  <text x="390" y="302" class="lbl">B</text>

  <!-- Perpendicular OM -->
  <line x1="250" y1="200" x2="250" y2="296" class="perp"/>
  <circle cx="250" cy="296" r="4" fill="#34d399"/>
  <text x="250" y="322" class="lbl" fill="#34d399" text-anchor="middle">M</text>

  <!-- Right angle mark at M -->
  <path d="M 235 296 L 235 281 L 250 281" class="sq-perp"/>

  <!-- Radii OA and OB -->
  <line x1="250" y1="200" x2="122" y2="296" class="rad"/>
  <line x1="250" y1="200" x2="378" y2="296" class="rad"/>

  <!-- Dimension Labels -->
  <text x="175" y="235" class="lbl-dim" fill="#818cf8">r = 13 cm</text>
  <text x="180" y="315" class="lbl-dim">AM = 12</text>
  <text x="310" y="315" class="lbl-dim">MB = 12</text>
  <text x="260" y="255" class="lbl" fill="#34d399">OM = ?</text>
</svg>