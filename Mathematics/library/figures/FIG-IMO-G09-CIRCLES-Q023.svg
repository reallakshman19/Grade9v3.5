<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" role="img" aria-label="Tangent and Secant from External Point" font-family="system-ui, -apple-system, sans-serif">
  <title>Secant-Tangent Power of a Point</title>
  <desc>Tangent PT = 12 cm and secant PAB from external point P. PT^2 = PA * PB.</desc>
  <style>
    .circ { fill: rgba(56, 189, 248, 0.05); stroke: #38bdf8; stroke-width: 2.5; }
    .secant { stroke: #f8fafc; stroke-width: 2.8; }
    .tangent { stroke: #34d399; stroke-width: 3; }
    .rad { stroke: #818cf8; stroke-width: 1.8; stroke-dasharray: 4,4; }
    .pt { fill: #f8fafc; }
    .lbl { font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .lbl-val { font-size: 14px; font-weight: 600; fill: #cbd5e1; }
  </style>
  <circle cx="340" cy="200" r="140" class="circ"/>
  <circle cx="340" cy="200" r="4.5" class="pt"/><text x="340" y="225" class="lbl">O</text>

  <!-- External Point P at (60, 200) -->
  <circle cx="60" cy="200" r="5" fill="#f43f5e"/><text x="40" y="205" class="lbl" fill="#f43f5e">P</text>

  <!-- Point of Tangency T at (247, 95) -->
  <line x1="60" y1="200" x2="247" y2="95" class="tangent"/>
  <circle cx="247" cy="95" r="4.5" fill="#34d399"/><text x="245" y="75" class="lbl" fill="#34d399">T</text>
  <line x1="340" y1="200" x2="247" y2="95" class="rad"/>

  <!-- Secant PAB passing through (200, 200) and (480, 200) -->
  <line x1="60" y1="200" x2="480" y2="200" class="secant"/>
  <circle cx="200" cy="200" r="4.5" class="pt"/><text x="195" y="185" class="lbl">A</text>
  <circle cx="480" cy="200" r="4.5" class="pt"/><text x="490" y="195" class="lbl">B</text>

  <text x="135" y="135" class="lbl" fill="#34d399">PT = 12 cm</text>
  <text x="120" y="225" class="lbl-val">PA</text>
  <text x="330" y="185" class="lbl-val">AB = 2·PA</text>
</svg>