<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-label="Concentric Circles with Chord Tangent to Inner Circle" font-family="system-ui, -apple-system, sans-serif">
  <title>Concentric Circles Annulus Invariant</title>
  <desc>Chord AB of outer circle is tangent to inner circle at T. Length AB = 20 cm.</desc>
  <style>
    .circ-out { fill: rgba(56, 189, 248, 0.08); stroke: #38bdf8; stroke-width: 2.8; }
    .circ-in { fill: #0f172a; stroke: #818cf8; stroke-width: 2.2; }
    .chord { stroke: #f43f5e; stroke-width: 3.2; }
    .rad-in { stroke: #34d399; stroke-width: 2; stroke-dasharray: 4,4; }
    .rad-out { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 6,4; }
    .pt { fill: #f8fafc; }
    .lbl { font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .lbl-dim { font-size: 14px; font-weight: 600; fill: #cbd5e1; }
  </style>
  <circle cx="250" cy="210" r="170" class="circ-out"/>
  <circle cx="250" cy="210" r="95" class="circ-in"/>
  <circle cx="250" cy="210" r="4.5" class="pt"/><text x="250" y="195" class="lbl" text-anchor="middle">O</text>

  <!-- Tangent Chord AB at y = 115 (distance from center = 95) -->
  <line x1="109" y1="115" x2="391" y2="115" class="chord"/>
  <circle cx="109" cy="115" r="4.5" class="pt"/><text x="90" y="115" class="lbl">A</text>
  <circle cx="391" cy="115" r="4.5" class="pt"/><text x="405" y="115" class="lbl">B</text>

  <!-- Point of Tangency T -->
  <circle cx="250" cy="115" r="4.5" fill="#f43f5e"/><text x="250" y="95" class="lbl" fill="#f43f5e" text-anchor="middle">T</text>
  <line x1="250" y1="210" x2="250" y2="115" class="rad-in"/>
  <line x1="250" y1="210" x2="109" y2="115" class="rad-out"/>

  <text x="175" y="105" class="lbl-dim" fill="#f43f5e">10 cm</text>
  <text x="315" y="105" class="lbl-dim" fill="#f43f5e">10 cm</text>
  <text x="260" y="165" class="lbl-dim" fill="#34d399">r</text>
  <text x="170" y="180" class="lbl-dim" fill="#38bdf8">R</text>
</svg>