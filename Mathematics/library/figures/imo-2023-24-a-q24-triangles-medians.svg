<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <title>Congruent Triangles with Medians - IMO Class 9 2023-24 Set A Q24</title>
  <desc>Triangles ABC and PQR with medians AD and PE, and tick marks indicating congruent sides and medians</desc>
  <rect width="520" height="280" fill="#ffffff" />
  
  <!-- TRIANGLE ABC (Top) -->
  <g transform="translate(40, 20)">
    <polygon points="120,30 20,110 320,100" fill="#f8fafc" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Median AD to D = (170, 105) -->
    <line x1="120" y1="30" x2="170" y2="105" stroke="#0f172a" stroke-width="2" />
    
    <!-- Tick on AB (single tick) -->
    <line x1="68" y1="67" x2="74" y2="75" stroke="#2563eb" stroke-width="2" />
    
    <!-- Double tick on BD -->
    <line x1="92" y1="104" x2="92" y2="112" stroke="#2563eb" stroke-width="2" />
    <line x1="97" y1="104" x2="97" y2="112" stroke="#2563eb" stroke-width="2" />
    
    <!-- Triple tick on AD -->
    <line x1="140" y1="64" x2="148" y2="68" stroke="#2563eb" stroke-width="1.8" />
    <line x1="143" y1="69" x2="151" y2="73" stroke="#2563eb" stroke-width="1.8" />
    <line x1="146" y1="74" x2="154" y2="78" stroke="#2563eb" stroke-width="1.8" />
    
    <!-- Dimensions -->
    <text x="50" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">3 cm</text>
    <text x="95" y="125" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">3.5 cm</text>
    <text x="230" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">5 cm</text>
    
    <!-- Vertex labels -->
    <g font-family="system-ui, sans-serif" font-size="16" font-style="italic" font-weight="bold" fill="#0f172a">
      <text x="120" y="22" text-anchor="middle">A</text>
      <text x="10" y="118">B</text>
      <text x="170" y="125" text-anchor="middle">D</text>
      <text x="330" y="105">C</text>
    </g>
  </g>
  
  <!-- TRIANGLE PQR (Bottom) -->
  <g transform="translate(40, 150)">
    <polygon points="120,30 20,110 320,100" fill="#f8fafc" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Median PE to E = (170, 105) -->
    <line x1="120" y1="30" x2="170" y2="105" stroke="#0f172a" stroke-width="2" />
    
    <!-- Tick on PQ (single tick) -->
    <line x1="68" y1="67" x2="74" y2="75" stroke="#2563eb" stroke-width="2" />
    
    <!-- Double tick on QE -->
    <line x1="92" y1="104" x2="92" y2="112" stroke="#2563eb" stroke-width="2" />
    <line x1="97" y1="104" x2="97" y2="112" stroke="#2563eb" stroke-width="2" />
    
    <!-- Triple tick on PE -->
    <line x1="140" y1="64" x2="148" y2="68" stroke="#2563eb" stroke-width="1.8" />
    <line x1="143" y1="69" x2="151" y2="73" stroke="#2563eb" stroke-width="1.8" />
    <line x1="146" y1="74" x2="154" y2="78" stroke="#2563eb" stroke-width="1.8" />
    
    <!-- Unknown PR -->
    <text x="230" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">PR = ?</text>
    
    <!-- Vertex labels -->
    <g font-family="system-ui, sans-serif" font-size="16" font-style="italic" font-weight="bold" fill="#0f172a">
      <text x="120" y="22" text-anchor="middle">P</text>
      <text x="10" y="118">Q</text>
      <text x="170" y="125" text-anchor="middle">E</text>
      <text x="330" y="105">R</text>
    </g>
  </g>
</svg>
