<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <title>Cube Net with Numbers - IMO Class 9 2023-24 Set A Q04</title>
  <desc>Unfolded cube net showing 6 faces: top face 4, horizontal row 2-5-3-6, bottom face 1 below 3</desc>
  <rect width="320" height="240" fill="#ffffff" />
  
  <g stroke="#1e293b" stroke-width="2" fill="#f8fafc">
    <!-- Face 4 (Top, above 5) -->
    <rect x="100" y="20" width="50" height="50" />
    <!-- Row of 4: 2, 5, 3, 6 -->
    <rect x="50" y="70" width="50" height="50" />
    <rect x="100" y="70" width="50" height="50" />
    <rect x="150" y="70" width="50" height="50" />
    <rect x="200" y="70" width="50" height="50" />
    <!-- Face 1 (Bottom, below 3) -->
    <rect x="150" y="120" width="50" height="50" />
  </g>
  
  <g font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
    <text x="125" y="45">4</text>
    <text x="75" y="95">2</text>
    <text x="125" y="95">5</text>
    <text x="175" y="95">3</text>
    <text x="225" y="95">6</text>
    <text x="175" y="145">1</text>
  </g>
</svg>
