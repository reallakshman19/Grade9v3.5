<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 130" width="100%" height="100%">
  <title>Figure Series - IMO Class 9 2023-24 Set A Q14</title>
  <desc>Five consecutive problem figures following rotating bowtie, corner symbols, and increasing radial lines</desc>
  <rect width="550" height="130" fill="#ffffff" />
  
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <!-- Outer boxes -->
    <rect x="15" y="15" width="100" height="100" />
    <rect x="120" y="15" width="100" height="100" />
    <rect x="225" y="15" width="100" height="100" />
    <rect x="330" y="15" width="100" height="100" />
    <rect x="435" y="15" width="100" height="100" />
    
    <!-- BOX 1: Vertical bowtie, top shaded, 0 extra lines -->
    <g transform="translate(15, 15)">
      <polygon points="65,65 45,25 85,25" fill="#1e293b" />
      <polygon points="65,65 45,105 85,105" fill="#ffffff" />
      <circle cx="28" cy="28" r="4.5" fill="#ffffff" stroke-width="1.8" />
      <rect x="85" y="85" width="9" height="9" fill="#1e293b" />
    </g>
    
    <!-- BOX 2: Horizontal bowtie, right shaded, 1 vertical line -->
    <g transform="translate(120, 15)">
      <polygon points="65,65 25,45 25,85" fill="#ffffff" />
      <polygon points="65,65 105,45 105,85" fill="#1e293b" />
      <line x1="65" y1="20" x2="65" y2="110" stroke-width="1.8" />
      <circle cx="28" cy="90" r="4.5" fill="#ffffff" stroke-width="1.8" />
      <rect x="85" y="24" width="9" height="9" fill="#1e293b" />
    </g>
    
    <!-- BOX 3: Vertical bowtie, bottom shaded, 2 lines -->
    <g transform="translate(225, 15)">
      <polygon points="65,65 45,25 85,25" fill="#ffffff" />
      <polygon points="65,65 45,105 85,105" fill="#1e293b" />
      <line x1="25" y1="80" x2="105" y2="50" stroke-width="1.8" />
      <line x1="30" y1="45" x2="100" y2="85" stroke-width="1.8" />
      <rect x="24" y="24" width="9" height="9" fill="#1e293b" />
      <circle cx="90" cy="90" r="4.5" fill="#ffffff" stroke-width="1.8" />
    </g>
    
    <!-- BOX 4: Horizontal bowtie, left shaded, 3 lines -->
    <g transform="translate(330, 15)">
      <polygon points="65,65 25,45 25,85" fill="#1e293b" />
      <polygon points="65,65 105,45 105,85" fill="#ffffff" />
      <line x1="65" y1="20" x2="65" y2="110" stroke-width="1.8" />
      <line x1="50" y1="25" x2="80" y2="105" stroke-width="1.8" />
      <line x1="80" y1="25" x2="50" y2="105" stroke-width="1.8" />
      <rect x="24" y="85" width="9" height="9" fill="#1e293b" />
      <circle cx="90" cy="28" r="4.5" fill="#ffffff" stroke-width="1.8" />
    </g>
    
    <!-- BOX 5: Vertical bowtie, top shaded, 4 lines -->
    <g transform="translate(435, 15)">
      <polygon points="65,65 45,25 85,25" fill="#1e293b" />
      <polygon points="65,65 45,105 85,105" fill="#ffffff" />
      <line x1="25" y1="75" x2="105" y2="55" stroke-width="1.8" />
      <line x1="25" y1="55" x2="105" y2="75" stroke-width="1.8" />
      <line x1="30" y1="90" x2="100" y2="40" stroke-width="1.8" />
      <line x1="30" y1="40" x2="100" y2="90" stroke-width="1.8" />
      <circle cx="28" cy="28" r="4.5" fill="#ffffff" stroke-width="1.8" />
      <rect x="85" y="85" width="9" height="9" fill="#1e293b" />
    </g>
  </g>
</svg>
