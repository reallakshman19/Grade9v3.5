<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <title>Missing Number Triangles - IMO Class 9 2023-24 Set A Q08</title>
  <desc>Three triangles with circles at vertices/sides containing square numbers and center sum</desc>
  <rect width="600" height="200" fill="#ffffff" />
  
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
    <!-- Figure 1 -->
    <g transform="translate(10, 0)">
      <polygon points="100,40 40,140 160,140" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
      <text x="100" y="105" font-size="18" fill="#1e293b">20</text>
      <!-- Circles -->
      <circle cx="55" cy="80" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
      <text x="55" y="80">49</text>
      
      <circle cx="145" cy="80" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
      <text x="145" y="80">16</text>
      
      <circle cx="100" cy="165" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
      <text x="100" y="165">81</text>
    </g>
    
    <!-- Figure 2 -->
    <g transform="translate(200, 0)">
      <polygon points="100,40 40,140 160,140" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
      <text x="100" y="105" font-size="20" fill="#dc2626">?</text>
      <!-- Circles -->
      <circle cx="55" cy="80" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
      <text x="55" y="80">64</text>
      
      <circle cx="145" cy="80" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
      <text x="145" y="80">121</text>
      
      <circle cx="100" cy="165" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
      <text x="100" y="165">25</text>
    </g>
    
    <!-- Figure 3 -->
    <g transform="translate(390, 0)">
      <polygon points="100,40 40,140 160,140" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
      <text x="100" y="105" font-size="18" fill="#1e293b">18</text>
      <!-- Circles -->
      <circle cx="55" cy="80" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
      <text x="55" y="80">81</text>
      
      <circle cx="145" cy="80" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
      <text x="145" y="80">36</text>
      
      <circle cx="100" cy="165" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
      <text x="100" y="165">9</text>
    </g>
  </g>
</svg>
