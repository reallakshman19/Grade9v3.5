<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Inscribed angles in the same segment of a circle" font-family="system-ui, -apple-system, sans-serif">
  <title>Angles in the Same Segment</title>
  <desc>Circle with chords AC and BD intersecting at E. Angles BAC and BDC subtend the same arc BC.</desc>
  <style>
    .circ { fill: rgba(56, 189, 248, 0.05); stroke: #38bdf8; stroke-width: 2.5; }
    .chord { stroke: #94a3b8; stroke-width: 2.2; }
    .subtended { stroke: #f43f5e; stroke-width: 2.8; }
    .pt { fill: #f8fafc; }
    .lbl { font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .lbl-ang { font-size: 14px; font-weight: 700; fill: #38bdf8; }
  </style>
  <circle cx="260" cy="210" r="170" class="circ"/>
  
  <!-- Points A, B, C, D on circle -->
  <!-- A: top-left (140, 90) -->
  <circle cx="140" cy="90" r="4.5" class="pt"/><text x="120" y="85" class="lbl">A</text>
  <!-- D: top-right (380, 90) -->
  <circle cx="380" cy="90" r="4.5" class="pt"/><text x="395" y="85" class="lbl">D</text>
  <!-- B: bottom-left (120, 290) -->
  <circle cx="120" cy="290" r="4.5" class="pt"/><text x="100" y="305" class="lbl">B</text>
  <!-- C: bottom-right (390, 300) -->
  <circle cx="390" cy="300" r="4.5" class="pt"/><text x="405" y="315" class="lbl">C</text>

  <!-- Chords AC and BD intersecting at E -->
  <line x1="140" y1="90" x2="390" y2="300" class="chord"/>
  <line x1="120" y1="290" x2="380" y2="90" class="chord"/>
  <!-- Point E intersection -->
  <circle cx="255" cy="187" r="4.5" fill="#fbbf24"/><text x="265" y="180" class="lbl" fill="#fbbf24">E</text>

  <!-- Lines AB and CD -->
  <line x1="140" y1="90" x2="120" y2="290" class="subtended"/>
  <line x1="380" y1="90" x2="390" y2="300" class="subtended"/>

  <!-- Angle annotations -->
  <text x="235" y="215" class="lbl-ang" fill="#fbbf24">130°</text>
  <text x="350" y="280" class="lbl-ang">20°</text>
  <text x="155" y="115" class="lbl-ang" fill="#f43f5e">∠BAC = ?</text>
</svg>