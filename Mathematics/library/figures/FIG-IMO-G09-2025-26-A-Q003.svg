<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" role="img" aria-label="Three radial number puzzle figures with central values 6, 4, and question mark" font-family="system-ui, sans-serif">
  <title>Radial Quadrilateral Number Puzzle</title>
  <desc>Three diamond figures with outer corner numbers and a central circle: Figure 1 has outer numbers 74, 98, 148, 112 with central 6; Figure 2 has outer numbers 32, 25, 55, 16 with central 4; Figure 3 has outer numbers 92, 35, 81, 42 with central question mark.</desc>
  <style>
    .bg-box { fill: #101826; stroke: #263854; stroke-width: 2; rx: 12; }
    .fig-diamond { fill: #172338; stroke: #38bdf8; stroke-width: 2.5; }
    .center-circle { fill: #0284c7; stroke: #38bdf8; stroke-width: 2.5; }
    .center-text { font-size: 24px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    .outer-circle { fill: #1e293b; stroke: #64748b; stroke-width: 1.5; }
    .outer-text { font-size: 17px; font-weight: 700; fill: #f1f5f9; text-anchor: middle; dominant-baseline: central; }
    .fig-label { font-size: 16px; font-weight: 750; fill: #94a3b8; text-anchor: middle; }
    .spoke-line { stroke: #334155; stroke-width: 2; stroke-dasharray: 4,3; }
  </style>

  <!-- FIGURE 1 -->
  <g transform="translate(40, 20)">
    <rect width="230" height="270" class="bg-box"/>
    <!-- Spokes -->
    <line x1="115" y1="45" x2="115" y2="205" class="spoke-line"/>
    <line x1="35" y1="125" x2="195" y2="125" class="spoke-line"/>
    <!-- Diamond -->
    <polygon points="115,45 195,125 115,205 35,125" class="fig-diamond"/>
    <!-- Central Node -->
    <circle cx="115" cy="125" r="28" class="center-circle"/>
    <text x="115" y="125" class="center-text">6</text>
    <!-- Outer Nodes: Top, Right, Bottom, Left -->
    <circle cx="115" cy="45" r="22" class="outer-circle"/>
    <text x="115" y="45" class="outer-text">74</text>
    <circle cx="195" cy="125" r="22" class="outer-circle"/>
    <text x="195" y="125" class="outer-text">98</text>
    <circle cx="115" cy="205" r="22" class="outer-circle"/>
    <text x="115" y="205" class="outer-text">148</text>
    <circle cx="35" cy="125" r="22" class="outer-circle"/>
    <text x="35" y="125" class="outer-text">112</text>
    <!-- Label -->
    <text x="115" y="248" class="fig-label">Figure 1</text>
  </g>

  <!-- FIGURE 2 -->
  <g transform="translate(310, 20)">
    <rect width="230" height="270" class="bg-box"/>
    <!-- Spokes -->
    <line x1="115" y1="45" x2="115" y2="205" class="spoke-line"/>
    <line x1="35" y1="125" x2="195" y2="125" class="spoke-line"/>
    <!-- Diamond -->
    <polygon points="115,45 195,125 115,205 35,125" class="fig-diamond"/>
    <!-- Central Node -->
    <circle cx="115" cy="125" r="28" class="center-circle"/>
    <text x="115" y="125" class="center-text">4</text>
    <!-- Outer Nodes: Top, Right, Bottom, Left -->
    <circle cx="115" cy="45" r="22" class="outer-circle"/>
    <text x="115" y="45" class="outer-text">32</text>
    <circle cx="195" cy="125" r="22" class="outer-circle"/>
    <text x="195" y="125" class="outer-text">25</text>
    <circle cx="115" cy="205" r="22" class="outer-circle"/>
    <text x="115" y="205" class="outer-text">55</text>
    <circle cx="35" cy="125" r="22" class="outer-circle"/>
    <text x="35" y="125" class="outer-text">16</text>
    <!-- Label -->
    <text x="115" y="248" class="fig-label">Figure 2</text>
  </g>

  <!-- FIGURE 3 -->
  <g transform="translate(580, 20)">
    <rect width="230" height="270" class="bg-box"/>
    <!-- Spokes -->
    <line x1="115" y1="45" x2="115" y2="205" class="spoke-line"/>
    <line x1="35" y1="125" x2="195" y2="125" class="spoke-line"/>
    <!-- Diamond -->
    <polygon points="115,45 195,125 115,205 35,125" class="fig-diamond"/>
    <!-- Central Node -->
    <circle cx="115" cy="125" r="28" fill="#f59e0b" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="115" y="125" class="center-text">?</text>
    <!-- Outer Nodes: Top, Right, Bottom, Left -->
    <circle cx="115" cy="45" r="22" class="outer-circle"/>
    <text x="115" y="45" class="outer-text">92</text>
    <circle cx="195" cy="125" r="22" class="outer-circle"/>
    <text x="195" y="125" class="outer-text">35</text>
    <circle cx="115" cy="205" r="22" class="outer-circle"/>
    <text x="115" y="205" class="outer-text">81</text>
    <circle cx="35" cy="125" r="22" class="outer-circle"/>
    <text x="35" y="125" class="outer-text">42</text>
    <!-- Label -->
    <text x="115" y="248" class="fig-label">Figure 3</text>
  </g>
</svg>
