<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%">
  <title>Cross Mirror Image - IMO Class 9 2023-24 Set A Q07</title>
  <desc>Cross figure with shaded corner regions and a vertical mirror placed on the right</desc>
  <rect width="340" height="260" fill="#ffffff" />
  
  <!-- Main square frame -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="200" height="200" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- Top-left shaded square -->
    <rect x="0" y="0" width="40" height="40" fill="#1e293b" />
    
    <!-- Bottom-right shaded triangle -->
    <polygon points="200,160 200,200 160,200" fill="#1e293b" />
    
    <!-- Central Cross Structure -->
    <path d="M 80,20 L 120,20 L 120,80 L 180,80 L 180,120 L 120,120 L 120,180 L 80,180 L 80,120 L 20,120 L 20,80 L 80,80 Z" 
          fill="none" stroke="#0f172a" stroke-width="2" />
    
    <!-- Top Arm: Diamond with inner black diamond -->
    <polygon points="100,28 112,45 100,62 88,45" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <polygon points="100,35 107,45 100,55 93,45" fill="#0f172a" />
    
    <!-- Bottom Arm: Diamond with inner black diamond -->
    <polygon points="100,138 112,155 100,172 88,155" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <polygon points="100,145 107,155 100,165 93,155" fill="#0f172a" />
    
    <!-- Left Arm: Triangle pointing inward (right) -->
    <polygon points="35,88 65,100 35,112" fill="none" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Right Arm: Triangle pointing inward (left) -->
    <polygon points="165,88 135,100 165,112" fill="none" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Center circle with 4 quadrants/dots -->
    <circle cx="100" cy="100" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="95" cy="95" r="2.5" fill="#0f172a" />
    <circle cx="105" cy="95" r="2.5" fill="#0f172a" />
    <circle cx="95" cy="105" r="2.5" fill="#0f172a" />
    <circle cx="105" cy="105" r="2.5" fill="#0f172a" />
    <line x1="84" y1="100" x2="116" y2="100" stroke="#0f172a" stroke-width="1" />
    <line x1="100" y1="84" x2="100" y2="116" stroke="#0f172a" stroke-width="1" />
  </g>
  
  <!-- Mirror line on right -->
  <line x1="260" y1="10" x2="260" y2="230" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" />
  <text x="270" y="125" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Mirror</text>
</svg>
