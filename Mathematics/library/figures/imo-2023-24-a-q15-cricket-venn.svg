<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" height="100%">
  <title>Cricket Skills Venn Diagram - IMO Class 9 2023-24 Set A Q15</title>
  <desc>Venn diagram of Batting (Square), Bowling (Triangle), and Fielding (Circle) players</desc>
  <rect width="520" height="300" fill="#ffffff" />
  
  <g fill="none" stroke="#0f172a" stroke-width="2.5">
    <!-- Square (Batting): x in [60, 200], y in [100, 240] -->
    <rect x="60" y="100" width="140" height="140" />
    
    <!-- Triangle (Bowling): points (120,40), (60,250), (280,250) -> wait, let's look at p4_col1_top.png:
         Right triangle or acute triangle?
         In p4_col1_top.png:
         Top vertex is at top-left of circle, right side slopes down to (270, 240), left side is vertical or slanted -->
    <polygon points="120,40 120,240 260,240" />
    
    <!-- Circle (Fielding): centered around (170, 100), radius 60 -->
    <circle cx="170" cy="100" r="65" />
  </g>
  
  <!-- Number labels in regions -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
    <text x="90" y="190">31</text>
    <text x="215" y="220">20</text>
    <text x="200" y="65">25</text>
    <text x="145" y="90">18</text>
    <text x="100" y="125">21</text>
    <text x="145" y="150">15</text>
    <text x="145" y="215">17</text>
  </g>
  
  <!-- Legend on the right -->
  <g transform="translate(300, 70)" font-family="system-ui, sans-serif" font-size="14" fill="#1e293b">
    <rect x="0" y="0" width="30" height="30" fill="none" stroke="#0f172a" stroke-width="2" />
    <text x="42" y="20">Players good at batting</text>
    
    <polygon points="15,55 0,85 30,85" fill="none" stroke="#0f172a" stroke-width="2" />
    <text x="42" y="75">Players good at bowling</text>
    
    <circle cx="15" cy="130" r="15" fill="none" stroke="#0f172a" stroke-width="2" />
    <text x="42" y="135">Players good at fielding</text>
  </g>
</svg>
