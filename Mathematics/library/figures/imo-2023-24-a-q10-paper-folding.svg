<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <title>Paper Folding Sheet - IMO Class 9 2023-24 Set A Q10</title>
  <desc>Square transparent sheet with a central dotted folding line and geometric patterns</desc>
  <rect width="260" height="260" fill="#ffffff" />
  
  <!-- Square Sheet Outline -->
  <rect x="30" y="30" width="200" height="200" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5" />
  
  <!-- Central Dotted Fold Line -->
  <line x1="130" y1="30" x2="130" y2="230" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 5" />
  
  <!-- Left Side: Downward Arrow -->
  <g stroke="#0f172a" stroke-width="2.5" fill="#0f172a">
    <line x1="60" y1="170" x2="60" y2="215" />
    <polygon points="60,225 54,210 66,210" />
  </g>
  
  <!-- Left to Right Slanted Striped Bar -->
  <!-- Top-left half: from (70, 70) to (130, 130) -->
  <g transform="translate(130, 130) rotate(-45)">
    <rect x="-85" y="-8" width="170" height="16" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.8" />
    <!-- stripes -->
    <line x1="-80" y1="-8" x2="-80" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-70" y1="-8" x2="-70" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-60" y1="-8" x2="-60" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-50" y1="-8" x2="-50" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-40" y1="-8" x2="-40" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-30" y1="-8" x2="-30" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-20" y1="-8" x2="-20" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="-10" y1="-8" x2="-10" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="10" y1="-8" x2="10" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="20" y1="-8" x2="20" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="30" y1="-8" x2="30" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="40" y1="-8" x2="40" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="50" y1="-8" x2="50" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="60" y1="-8" x2="60" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="70" y1="-8" x2="70" y2="8" stroke="#0f172a" stroke-width="1.5" />
    <line x1="80" y1="-8" x2="80" y2="8" stroke="#0f172a" stroke-width="1.5" />
  </g>
  
  <!-- Right Side: Top Left-Pointing Banner Arrow -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <path d="M 175,50 L 145,50 L 145,42 L 120,55 L 145,68 L 145,60 L 175,60 Z" fill="#ffffff" />
  </g>
  
  <!-- Right Side: Vertical Line with Dot at Top -->
  <g stroke="#0f172a" stroke-width="2.5">
    <line x1="200" y1="180" x2="200" y2="225" />
    <circle cx="200" cy="175" r="5" fill="#0f172a" />
  </g>
</svg>
