<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <title>Figure Matrix - IMO Class 9 2023-24 Set A Q12</title>
  <desc>3 by 3 figure matrix where column 3 is the combination of column 1 and column 2</desc>
  <rect width="360" height="360" fill="#ffffff" />
  
  <!-- Grid lines -->
  <rect x="20" y="20" width="320" height="320" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <line x1="126.6" y1="20" x2="126.6" y2="340" stroke="#0f172a" stroke-width="2" />
  <line x1="233.3" y1="20" x2="233.3" y2="340" stroke="#0f172a" stroke-width="2" />
  <line x1="20" y1="126.6" x2="340" y2="126.6" stroke="#0f172a" stroke-width="2" />
  <line x1="20" y1="233.3" x2="340" y2="233.3" stroke="#0f172a" stroke-width="2" />

  <!-- ROW 1 -->
  <!-- Cell (1,1) -->
  <g transform="translate(35, 40)">
    <rect x="15" y="15" width="50" height="30" fill="none" stroke="#0f172a" stroke-width="2" />
    <circle cx="8" cy="30" r="3.5" fill="#0f172a" />
    <circle cx="72" cy="30" r="3.5" fill="#0f172a" />
    <!-- T-legs -->
    <line x1="28" y1="45" x2="28" y2="65" stroke="#0f172a" stroke-width="2" />
    <line x1="22" y1="65" x2="34" y2="65" stroke="#0f172a" stroke-width="2" />
    <line x1="52" y1="45" x2="52" y2="65" stroke="#0f172a" stroke-width="2" />
    <line x1="46" y1="65" x2="58" y2="65" stroke="#0f172a" stroke-width="2" />
  </g>
  <!-- Cell (1,2) -->
  <g transform="translate(142, 40)">
    <polygon points="40,15 20,45 60,45" fill="none" stroke="#0f172a" stroke-width="2" />
    <circle cx="40" cy="35" r="3" fill="#0f172a" />
    <!-- pin with open circle -->
    <line x1="40" y1="45" x2="40" y2="65" stroke="#0f172a" stroke-width="2" />
    <circle cx="40" cy="68" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  </g>
  <!-- Cell (1,3) -->
  <g transform="translate(248, 40)">
    <rect x="15" y="15" width="50" height="30" fill="none" stroke="#0f172a" stroke-width="2" />
    <circle cx="8" cy="30" r="3.5" fill="#0f172a" />
    <circle cx="72" cy="30" r="3.5" fill="#0f172a" />
    <line x1="28" y1="45" x2="28" y2="65" stroke="#0f172a" stroke-width="2" />
    <line x1="22" y1="65" x2="34" y2="65" stroke="#0f172a" stroke-width="2" />
    <line x1="52" y1="45" x2="52" y2="65" stroke="#0f172a" stroke-width="2" />
    <line x1="46" y1="65" x2="58" y2="65" stroke="#0f172a" stroke-width="2" />
    <polygon points="40,17 23,43 57,43" fill="none" stroke="#0f172a" stroke-width="1.8" />
    <circle cx="40" cy="33" r="2.5" fill="#0f172a" />
    <line x1="40" y1="45" x2="40" y2="62" stroke="#0f172a" stroke-width="1.8" />
    <circle cx="40" cy="65" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  </g>

  <!-- ROW 2 -->
  <!-- Cell (2,1) -->
  <g transform="translate(35, 147)">
    <rect x="15" y="15" width="50" height="30" fill="none" stroke="#0f172a" stroke-width="2" />
    <polygon points="7,30 11,25 11,35" fill="#0f172a" />
    <polygon points="73,30 69,25 69,35" fill="#0f172a" />
    <!-- Arrow legs -->
    <line x1="28" y1="45" x2="28" y2="65" stroke="#0f172a" stroke-width="2" />
    <polygon points="28,68 24,60 32,60" fill="#0f172a" />
    <line x1="52" y1="45" x2="52" y2="65" stroke="#0f172a" stroke-width="2" />
    <polygon points="52,68 48,60 56,60" fill="#0f172a" />
  </g>
  <!-- Cell (2,2) -->
  <g transform="translate(142, 147)">
    <circle cx="40" cy="30" r="15" fill="none" stroke="#0f172a" stroke-width="2" />
    <polygon points="40,25 36,33 44,33" fill="#0f172a" />
    <!-- pin with open triangle -->
    <line x1="40" y1="45" x2="40" y2="62" stroke="#0f172a" stroke-width="2" />
    <polygon points="40,68 36,62 44,62" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  </g>
  <!-- Cell (2,3) -->
  <g transform="translate(248, 147)">
    <rect x="15" y="15" width="50" height="30" fill="none" stroke="#0f172a" stroke-width="2" />
    <polygon points="7,30 11,25 11,35" fill="#0f172a" />
    <polygon points="73,30 69,25 69,35" fill="#0f172a" />
    <line x1="28" y1="45" x2="28" y2="65" stroke="#0f172a" stroke-width="2" />
    <polygon points="28,68 24,60 32,60" fill="#0f172a" />
    <line x1="52" y1="45" x2="52" y2="65" stroke="#0f172a" stroke-width="2" />
    <polygon points="52,68 48,60 56,60" fill="#0f172a" />
    <circle cx="40" cy="30" r="13" fill="none" stroke="#0f172a" stroke-width="1.8" />
    <polygon points="40,26 36,33 44,33" fill="#0f172a" />
    <line x1="40" y1="45" x2="40" y2="62" stroke="#0f172a" stroke-width="1.8" />
    <polygon points="40,68 36,62 44,62" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  </g>

  <!-- ROW 3 -->
  <!-- Cell (3,1) -->
  <g transform="translate(35, 254)">
    <rect x="15" y="15" width="50" height="30" fill="none" stroke="#0f172a" stroke-width="2" />
    <rect x="6" y="27" width="6" height="6" fill="#0f172a" />
    <rect x="68" y="27" width="6" height="6" fill="#0f172a" />
    <!-- Triangle base legs -->
    <line x1="28" y1="45" x2="28" y2="62" stroke="#0f172a" stroke-width="2" />
    <polygon points="28,62 23,68 33,68" fill="#0f172a" />
    <line x1="52" y1="45" x2="52" y2="62" stroke="#0f172a" stroke-width="2" />
    <polygon points="52,62 47,68 57,68" fill="#0f172a" />
  </g>
  <!-- Cell (3,2) -->
  <g transform="translate(142, 254)">
    <rect x="26" y="16" width="28" height="28" fill="none" stroke="#0f172a" stroke-width="2" />
    <rect x="37" y="27" width="6" height="6" fill="#0f172a" />
    <!-- pin with open square -->
    <line x1="40" y1="44" x2="40" y2="63" stroke="#0f172a" stroke-width="2" />
    <rect x="37" y="63" width="6" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  </g>
  <!-- Cell (3,3): Question Mark -->
  <g transform="translate(248, 254)">
    <text x="40" y="55" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" fill="#dc2626" text-anchor="middle">?</text>
  </g>
</svg>
