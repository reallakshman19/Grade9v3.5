<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-label="Intersecting Chords Inside Circle" font-family="system-ui, -apple-system, sans-serif">
  <title>Intersecting Chords Theorem</title>
  <desc>Chords AB and CD intersecting at interior point P. AP * PB = CP * PD.</desc>
  <style>
    .circ { fill: rgba(56, 189, 248, 0.05); stroke: #38bdf8; stroke-width: 2.5; }
    .chord1 { stroke: #38bdf8; stroke-width: 3; }
    .chord2 { stroke: #818cf8; stroke-width: 3; }
    .pt { fill: #f8fafc; }
    .lbl { font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .lbl-val { font-size: 14px; font-weight: 600; fill: #cbd5e1; }
  </style>
  <circle cx="250" cy="210" r="165" class="circ"/>

  <!-- Chord AB: (100, 210) to (410, 240) -->
  <line x1="100" y1="210" x2="410" y2="240" class="chord1"/>
  <circle cx="100" cy="210" r="4.5" class="pt"/><text x="80" y="215" class="lbl">A</text>
  <circle cx="410" cy="240" r="4.5" class="pt"/><text x="420" y="245" class="lbl">B</text>

  <!-- Chord CD: (200, 60) to (270, 370) -->
  <line x1="200" y1="60" x2="270" y2="370" class="chord2"/>
  <circle cx="200" cy="60" r="4.5" class="pt"/><text x="195" y="45" class="lbl">C</text>
  <circle cx="270" cy="370" r="4.5" class="pt"/><text x="270" y="395" class="lbl">D</text>

  <!-- Point P -->
  <circle cx="230" cy="222" r="5" fill="#f43f5e"/><text x="238" y="212" class="lbl" fill="#f43f5e">P</text>

  <!-- Dimension values -->
  <text x="155" y="205" class="lbl-val" fill="#38bdf8">AP = 6</text>
  <text x="315" y="225" class="lbl-val" fill="#38bdf8">PB = 8</text>
  <text x="225" y="140" class="lbl-val" fill="#818cf8">CP = 4</text>
  <text x="260" y="300" class="lbl-val" fill="#818cf8">PD = ?</text>
</svg>