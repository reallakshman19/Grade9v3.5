<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" width="100%" height="100%">
  <title>Line Graph on Coordinate Plane - IMO Class 9 2023-24 Set A Q22</title>
  <desc>Cartesian graph of the line y = 3x passing through points (0,0), (2,6), and (-1,-3)</desc>
  <rect width="340" height="380" fill="#ffffff" />
  
  <!-- Coordinate Grid & Axes -->
  <!-- Origin at (160, 240)
       Scale: 1 unit on x = 25px
              1 unit on y = 25px
       x in [-4, 4] => [60, 260]
       y in [-4, 8] => [340, 40]
  -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2">
    <!-- Grid lines -->
    <line x1="85" y1="40" x2="85" y2="340" />
    <line x1="110" y1="40" x2="110" y2="340" />
    <line x1="135" y1="40" x2="135" y2="340" />
    <line x1="185" y1="40" x2="185" y2="340" />
    <line x1="210" y1="40" x2="210" y2="340" />
    <line x1="235" y1="40" x2="235" y2="340" />
    
    <line x1="60" y1="90" x2="260" y2="90" />
    <line x1="60" y1="115" x2="260" y2="115" />
    <line x1="60" y1="140" x2="260" y2="140" />
    <line x1="60" y1="165" x2="260" y2="165" />
    <line x1="60" y1="190" x2="260" y2="190" />
    <line x1="60" y1="215" x2="260" y2="215" />
    <line x1="60" y1="265" x2="260" y2="265" />
    <line x1="60" y1="290" x2="260" y2="290" />
    <line x1="60" y1="315" x2="260" y2="315" />
  </g>
  
  <!-- Main Axes with arrows -->
  <g stroke="#0f172a" stroke-width="2">
    <!-- X-axis -->
    <line x1="50" y1="240" x2="270" y2="240" />
    <polygon points="275,240 268,236 268,244" fill="#0f172a" />
    <polygon points="45,240 52,236 52,244" fill="#0f172a" />
    
    <!-- Y-axis -->
    <line x1="160" y1="350" x2="160" y2="30" />
    <polygon points="160,25 156,32 164,32" fill="#0f172a" />
    <polygon points="160,355 156,348 164,348" fill="#0f172a" />
  </g>
  
  <!-- Axis labels and tick marks -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">
    <!-- X labels -->
    <text x="285" y="244" font-weight="bold">X</text>
    <text x="35" y="244" font-weight="bold">X'</text>
    <text x="160" y="18" font-weight="bold">Y</text>
    <text x="160" y="372" font-weight="bold">Y'</text>
    
    <text x="135" y="255">-1</text>
    <text x="110" y="255">-2</text>
    <text x="85" y="255">-3</text>
    <text x="185" y="255">1</text>
    <text x="210" y="255">2</text>
    <text x="235" y="255">3</text>
    
    <!-- Y labels -->
    <text x="150" y="219">1</text>
    <text x="150" y="194">2</text>
    <text x="150" y="169">3</text>
    <text x="150" y="144">4</text>
    <text x="150" y="119">5</text>
    <text x="150" y="94">6</text>
    <text x="150" y="269">-1</text>
    <text x="150" y="294">-2</text>
    <text x="150" y="319">-3</text>
  </g>
  
  <!-- The Line: y = 3x, connects (-1.2, -3.6) to (2.2, 6.6)
       x=-1.2 => 160 - 30 = 130, y=-3.6 => 240 + 90 = 330
       x=2.2 => 160 + 55 = 215, y=6.6 => 240 - 165 = 75
  -->
  <line x1="125" y1="345" x2="220" y2="60" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" />
  
  <!-- Points plotted -->
  <circle cx="160" cy="240" r="4" fill="#0f172a" />
  <text x="175" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(0, 0)</text>
  
  <circle cx="210" cy="90" r="4" fill="#dc2626" />
  <text x="245" y="94" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">(2, 6)</text>
  
  <circle cx="135" cy="315" r="4" fill="#dc2626" />
  <text x="100" y="319" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">(-1, -3)</text>
</svg>
