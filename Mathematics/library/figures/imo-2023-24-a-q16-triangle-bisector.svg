<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="100%" height="100%">
  <title>Triangle with Angle Bisector - IMO Class 9 2023-24 Set A Q16</title>
  <desc>Triangle ABC with AD perpendicular to BC and bisecting angle BAC, with angle B = 30 degrees</desc>
  <rect width="380" height="220" fill="#ffffff" />
  
  <!-- Triangle ABC -->
  <!-- Let D = (230, 160)
       A is directly above D: A = (230, 50) [AD = 110]
       B is to the left: for angle B = 30 deg, BD = 110 / tan(30 deg) = 110 * sqrt(3) ~ 190.5 => B = (230 - 190.5, 160) = (39.5, 160)
       For AD to bisect angle BAC: angle BAD = 60 deg, so angle CAD = 60 deg, CD = 110 * tan(60) = 110 * sqrt(3) ~ 190.5?
       Wait, in the drawing: C is closer or further?
       In the drawing: D is between B and C, AD is perpendicular to BC.
       Let's place C at (330, 160) [CD = 100], so angle ACD = arctan(110/100) ~ 48 deg visually, marked not to scale -->
  <polygon points="40,160 230,50 330,160" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
  <line x1="230" y1="50" x2="230" y2="160" stroke="#0f172a" stroke-width="2" />
  
  <!-- Right angle marker at D (left of AD) -->
  <rect x="214" y="144" width="16" height="16" fill="none" stroke="#0f172a" stroke-width="1.8" />
  
  <!-- Angle arc at B -->
  <path d="M 75,160 A 35 35 0 0 0 68,144" fill="none" stroke="#2563eb" stroke-width="1.8" />
  <text x="85" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">30°</text>
  
  <!-- Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="18" font-style="italic" font-weight="bold" fill="#0f172a">
    <text x="230" y="38" text-anchor="middle">A</text>
    <text x="24" y="166" text-anchor="end">B</text>
    <text x="230" y="185" text-anchor="middle">D</text>
    <text x="345" y="166" text-anchor="start">C</text>
  </g>
</svg>
