name: IMO182 R8 QRT Intent Contract P0 four real pinned five-Core sources
on:
  pull_request:
    paths:
      - '.github/workflows/imo182-r8-qrt-intent-contract.yml'
      - 'TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_contract.py'
      - 'TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_native_evidence.py'
      - 'TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_w_path_audit.py'
      - 'TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_real_navigation.py'
      - 'TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_coverage.py'
      - 'TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_review_handoff.py'
      - 'TEST/imo-research/qrt-tiles/reconciliation/qrt-intent-witnesses-pilot.v1.json'
      - 'TEST/imo-research/qrt-tiles/reconciliation/test_qrt_intent_contract.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  intent-contract-four-pinned-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Integration branch (read-only canonical authority and verifier)
        uses: actions/checkout@v4
      - name: Exact EXPLAIN-D3 authored TEST source
        uses: actions/checkout@v4
        with:
          ref: 40142fe06818e7a946d6296911d495f3f3323b12
          path: source-explain-d3
          persist-credentials: false
      - name: Exact MODEL-D2 authored TEST source after held author revision
        uses: actions/checkout@v4
        with:
          ref: d450d0f0cda25c51c0232db31e6592588634a90b
          path: source-model-d2
          persist-credentials: false
      - name: Exact RETRIEVE-D2 authored TEST source from established method-cue benchmark
        uses: actions/checkout@v4
        with:
          ref: 5b382356e792ae50884241fb047c328e304d011d
          path: source-retrieve-d2
          persist-credentials: false
      - name: Exact corrected RETRIEVE-D4 authored TEST source (not superseded leaky version)
        uses: actions/checkout@v4
        with:
          ref: 8ffa008e1bbd03898751af4380762178697fb715
          path: source-retrieve-d4
          persist-credentials: false
      - name: P4 pinned MODEL-D1 source author checkout (academic classification held)
        uses: actions/checkout@v4
        with:
          ref: 78645b0a6deb8c5a09e102731580132c78ebb0d2
          path: source-model-d1
          persist-credentials: false
      - name: P4 pinned SYNTHESIZE-D1 source author checkout (academic classification held)
        uses: actions/checkout@v4
        with:
          ref: c967ff226516de25d6235c6c0f1749b39ffced7d
          path: source-synthesize-d1
          persist-credentials: false
      - name: P4 pinned JUSTIFY-D1 source author checkout
        uses: actions/checkout@v4
        with:
          ref: d28ac2bea348412a0451d226e278d01531839932
          path: source-justify-d1
          persist-credentials: false
      - name: P4 exact original source-retrieve-d1 authored source
        uses: actions/checkout@v4
        with:
          ref: 6db5ebdfa3cfcb9c6eacca49c3b4f850eb5ca60a
          path: source-retrieve-d1
          persist-credentials: false
      - name: P4 exact original source-d1-common authored source
        uses: actions/checkout@v4
        with:
          ref: 089b57c98d697a0e19683c3d78e0d51220b9174a
          path: source-d1-common
          persist-credentials: false
      - name: P4 exact original source-d2-common authored source
        uses: actions/checkout@v4
        with:
          ref: eb3cf06646f00bf208084e794b41b4d8d83135b6
          path: source-d2-common
          persist-credentials: false
      - name: P4 exact original source-d3-synthesize authored source
        uses: actions/checkout@v4
        with:
          ref: 4d4a074d9f93e1eeac612679784224d4e250fb49
          path: source-d3-synthesize
          persist-credentials: false
      - name: P4 exact original source-d4-explain authored source
        uses: actions/checkout@v4
        with:
          ref: 6c00fae5c150cd580ab04c680414fba0a0c776e8
          path: source-d4-explain
          persist-credentials: false
      - name: P4 exact original source-d4-apply authored source
        uses: actions/checkout@v4
        with:
          ref: 0d36673633e115ecaa261917ee2066a80c3accc2
          path: source-d4-apply
          persist-credentials: false
      - name: P4 exact original source-d4-model authored source
        uses: actions/checkout@v4
        with:
          ref: 4064bd4c0c10c50263bdf3de29e9d10989f628d9
          path: source-d4-model
          persist-credentials: false
      - name: P4 exact original source-d4-represent authored source
        uses: actions/checkout@v4
        with:
          ref: 84fe228c45c7fac0fd8ce56124b3a656e39cf802
          path: source-d4-represent
          persist-credentials: false
      - name: P4 exact original source-d4-synthesize authored source
        uses: actions/checkout@v4
        with:
          ref: 9faa52d499e071e9e6d4c419b5afdf5fbc044455
          path: source-d4-synthesize
          persist-credentials: false
      - name: P4 exact original source-d4-justify authored source
        uses: actions/checkout@v4
        with:
          ref: e39db6a8607bf64b09274d38bb222ed90f22459a
          path: source-d4-justify
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile P0 verifier and run self-mutating fail-closed unit controls
        run: |
          python -m py_compile TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_contract.py TEST/imo-research/qrt-tiles/reconciliation/test_qrt_intent_contract.py
          python -m unittest discover -s TEST/imo-research/qrt-tiles/reconciliation -p test_qrt_intent_contract.py -v
      - name: Issue 182 exact-source P0 contracts for four already benchmarked native cell packages
        run: |
          set -euo pipefail
          mkdir -p build/imo182-r8-intent
          python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_contract.py --authority-root . --source-root source-explain-d3 --cell-id QRT-EXPLAIN-D3 --witness-file TEST/imo-research/qrt-tiles/reconciliation/qrt-intent-witnesses-pilot.v1.json --adoption-ledger TEST/imo-research/qrt-tiles/reconciliation/r5-01-28-artifact-adoption.v1.json --out build/imo182-r8-intent/explain-d3.json
          python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_contract.py --authority-root . --source-root source-model-d2 --cell-id QRT-MODEL-D2 --witness-file TEST/imo-research/qrt-tiles/reconciliation/qrt-intent-witnesses-pilot.v1.json --adoption-ledger TEST/imo-research/qrt-tiles/reconciliation/r5-01-28-artifact-adoption.v1.json --out build/imo182-r8-intent/model-d2.json
          python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_contract.py --authority-root . --source-root source-retrieve-d2 --cell-id QRT-RETRIEVE-D2 --witness-file TEST/imo-research/qrt-tiles/reconciliation/qrt-intent-witnesses-pilot.v1.json --adoption-ledger TEST/imo-research/qrt-tiles/reconciliation/r5-01-28-artifact-adoption.v1.json --out build/imo182-r8-intent/retrieve-d2.json
          python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_contract.py --authority-root . --source-root source-retrieve-d4 --cell-id QRT-RETRIEVE-D4 --witness-file TEST/imo-research/qrt-tiles/reconciliation/qrt-intent-witnesses-pilot.v1.json --adoption-ledger TEST/imo-research/qrt-tiles/reconciliation/r5-01-28-artifact-adoption.v1.json --out build/imo182-r8-intent/retrieve-d4.json
      - name: Four-contract result and explicit non-acceptance assertion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('build/imo182-r8-intent').glob('*.json'))
          assert len(files) == 4, files
          results = [json.loads(f.read_text()) for f in files]
          assert len({x["cell_id"] for x in results}) == 4
          assert all(x["technical_contract"] == "VALIDATED_PROPOSAL" for x in results)
          assert all(x["semantic_review"] == "HOLD_REVIEW_REQUIRED" for x in results)
          assert all(x["qualified_academic_review"] == "PENDING" and x["owner_qrt_acceptance"] == "PENDING" for x in results)
          assert all(len(x["roles"]) == 5 and all(z["semantic"] == "NOT_RUN" for z in x["roles"].values()) for x in results)
          assert all(len(x["semantic_objectives"]) == 12 and all(z["verdict"] == "NOT_RUN" for z in x["semantic_objectives"].values()) for x in results)
          r = next(x for x in results if x["cell_id"] == "QRT-RETRIEVE-D2")
          assert r["falsifier"]["specific_source_cue_observed"]
          print("R8 P0 four exact-source contracts PASS; known method cue falsified; 20 role semantics NOT_RUN; 0 Owner/academic acceptances")
          PY
      - name: Install existing native renderer schema dependencies (no substitute renderer)
        run: python -m pip install --quiet jsonschema
      - name: Build four exact authored source versions using ONLY the registered Core renderer
        run: |
          set -euo pipefail
          for row in \
            "source-explain-d3|TEST/products/imo182-qrt-d3-explain.manifest.json|explain-d3" \
            "source-model-d2|TEST/products/imo182-qrt-d2-model.manifest.json|model-d2" \
            "source-retrieve-d2|TEST/products/imo182-qrt-d2-retrieve.manifest.json|retrieve-d2" \
            "source-retrieve-d4|TEST/products/imo203-qrt-d4-retrieve.manifest.json|retrieve-d4"; do
            IFS='|' read -r root manifest cell <<< "$row"
            (
              cd "$root"
              python Shared/tools/render_core.py gaps --manifest "$manifest" --reference
              python Shared/tools/render_core.py build --manifest "$manifest" --out "build/imo182-qrt/r8/$cell" --mode PAGES --reference --draft
            )
          done
      - name: P1 verify 20 real native Core HTML SHAs and immutable five-role golden structural comparisons
        run: |
          set -euo pipefail
          for row in \
            "source-explain-d3|explain-d3" \
            "source-model-d2|model-d2" \
            "source-retrieve-d2|retrieve-d2" \
            "source-retrieve-d4|retrieve-d4"; do
            IFS='|' read -r root cell <<< "$row"
            python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_native_evidence.py \
              --contract "build/imo182-r8-intent/$cell.json" \
              --source-root "$root" --native-output "$root/build/imo182-qrt/r8/$cell" \
              --out "build/imo182-r8-intent/$cell-native.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('build/imo182-r8-intent').glob('*-native.json'))
          assert len(files) == 4
          r = [json.loads(p.read_text()) for p in files]
          assert all(x["native_evidence"]["all_role_structure"] == "PASS" for x in r)
          assert sum(len(x["native_evidence"]["roles"]) for x in r) == 20
          assert all(v["engineering_native_structure"] == "PASS"
                     and v["engineering"] == "NOT_RUN"
                     and v["semantic"] == "NOT_RUN"
                     for x in r for v in x["roles"].values())
          assert all(x["qualified_academic_review"] == "PENDING"
                     and x["owner_qrt_acceptance"] == "PENDING" for x in r)
          print("R8 P1 20 native Core pages and five frozen role structures per cell PASS; W/browser/maths NOT_RUN; Owner 0/28")
          PY
      - name: Install real Chromium for scoped learner-visible and SVG accessibility audits
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: P2/P3 five-Core path-aware W audit with five deliberate rejected defects
        run: |
          set -euo pipefail
          python -m py_compile TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_w_path_audit.py
          for row in \
            "source-explain-d3|explain-d3" \
            "source-model-d2|model-d2" \
            "source-retrieve-d2|retrieve-d2" \
            "source-retrieve-d4|retrieve-d4"; do
            IFS='|' read -r root cell <<< "$row"
            python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_w_path_audit.py \
              --native-contract "build/imo182-r8-intent/$cell-native.json" \
              --source-root "$root" --native-output "$root/build/imo182-qrt/r8/$cell" \
              --out "build/imo182-r8-intent/$cell-w-audit.json" --run-mutants
          done
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(f.read_text()) for f in
                  sorted(Path("build/imo182-r8-intent").glob("*-w-audit.json"))]
          assert len(rows) == 4
          assert sum(len(x["p2_p3_live_evidence"]["browser_learner_role_viewports"])
                     for x in rows) == 36
          assert sum(x["p2_p3_live_evidence"]["mutants_rejected"] for x in rows) == 5
          assert all(len(x["whole_journey_W"]["paths_checked"]) == 5 for x in rows)
          assert all(x["whole_journey_W"]["assisted_retry_is_independent"] is False for x in rows)
          assert all(x["semantic_review"] == "HOLD_REVIEW_REQUIRED" and
                     x["owner_qrt_acceptance"] == "PENDING" for x in rows)
          assert "RETRIEVE_D2_METHOD_SELECTION_ALREADY_CUED" in next(
              x for x in rows if x["cell_id"] == "QRT-RETRIEVE-D2"
          )["whole_journey_W"]["known_finding_ids"]
          print("R8 P2/P3: 36 live browser viewport probes, 20 cumulative path traces,"
                " five known-bad mutants rejected, no QRT semantic/Owner promotion")
          PY
      - name: P4 compile five additional elevated educational-risk source-bound QRT contracts
        run: |
          set -euo pipefail
          for row in \
            "QRT-MODEL-D1|source-model-d1|model-d1|RIVAL_NOT_GROUNDED_IN_SOURCE" \
            "QRT-SYNTHESIZE-D1|source-synthesize-d1|synthesize-d1|RIVAL_NOT_GROUNDED_IN_SOURCE" \
            "QRT-JUSTIFY-D1|source-justify-d1|justify-d1|NONE" \
            "QRT-RETRIEVE-D3|source-explain-d3|retrieve-d3|NONE" \
            "QRT-MODEL-D3|source-explain-d3|model-d3|NONE"; do
            IFS='|' read -r cell root name expected <<< "$row"
            extra=()
            if [ "$expected" != NONE ]; then extra=(--expected-hold-code "$expected"); fi
            python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_contract.py \
              --authority-root . --source-root "$root" --cell-id "$cell" \
              --witness-file TEST/imo-research/qrt-tiles/reconciliation/qrt-intent-witnesses-pilot.v1.json \
              --adoption-ledger TEST/imo-research/qrt-tiles/reconciliation/r5-01-28-artifact-adoption.v1.json \
              --out "build/imo182-r8-intent/$name.json" "${extra[@]}"
          done
      - name: P4 render and verify three additional educational-hold cells with valid source-declared rivals
        run: |
          set -euo pipefail
          for row in \
            "source-justify-d1|TEST/products/imo182-qrt-d1-justify.manifest.json|justify-d1" \
            "source-explain-d3|TEST/products/imo182-qrt-d3-retrieve.manifest.json|retrieve-d3" \
            "source-explain-d3|TEST/products/imo182-qrt-d3-model.manifest.json|model-d3"; do
            IFS='|' read -r root manifest cell <<< "$row"
            (
              cd "$root"
              python Shared/tools/render_core.py gaps --manifest "$manifest" --reference
              python Shared/tools/render_core.py build --manifest "$manifest" \
                --out "build/imo182-qrt/r8/$cell" --mode PAGES --reference --draft
            )
            python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_native_evidence.py \
              --contract "build/imo182-r8-intent/$cell.json" \
              --source-root "$root" --native-output "$root/build/imo182-qrt/r8/$cell" \
              --out "build/imo182-r8-intent/$cell-native.json"
          done
      - name: P4 distinguish validated source contracts from two prohibited source-rival omissions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          dest=Path("build/imo182-r8-intent")
          files=["model-d1","synthesize-d1","justify-d1",
                 "retrieve-d2","model-d2","retrieve-d3","model-d3","retrieve-d4"]
          out={name:json.loads((dest/(name+".json")).read_text())
               for name in files}
          assert len(out)==8
          for name in ("model-d1","synthesize-d1"):
              r=out[name]
              assert r["technical_contract"]=="BLOCKED_RIVAL_REVIEW"
              assert r["blocking_error_code"]=="RIVAL_NOT_GROUNDED_IN_SOURCE"
              assert r["owner_qrt_acceptance"]=="PENDING"
              assert not (dest/(name+"-native.json")).exists()
          for name in ("justify-d1","retrieve-d2","model-d2",
                       "retrieve-d3","model-d3","retrieve-d4"):
              r=out[name]
              assert r["technical_contract"]=="VALIDATED_PROPOSAL"
              assert r["semantic_review"]=="HOLD_REVIEW_REQUIRED"
              assert r["qualified_academic_review"]=="PENDING"
              assert r["owner_qrt_acceptance"]=="PENDING"
          for name in ("justify-d1","retrieve-d3","model-d3"):
              r=json.loads((dest/(name+"-native.json")).read_text())
              assert r["native_evidence"]["all_role_structure"]=="PASS"
              assert all(v["semantic"]=="NOT_RUN" for v in r["roles"].values())
          print("P4 eight elevated holds covered: 6 source-provenance contracts "
                "VALIDATED_PROPOSAL, 2 rival-declaration BLOCKED, 3 new five-Core "
                "structural benchmark packages (15 native role pages), "
                "0 independent/Owner acceptance")
          PY
      - name: P4 compile remaining 19 real pinned original TEST question-specific QRT hypotheses
        run: |
          set -euo pipefail
          for row in \
            "RETRIEVE-D1|source-retrieve-d1|retrieve-d1|RIVAL_NOT_GROUNDED_IN_SOURCE" \
            "EXPLAIN-D1|source-d1-common|explain-d1|RIVAL_NOT_GROUNDED_IN_SOURCE" \
            "APPLY-D1|source-d1-common|apply-d1|RIVAL_NOT_GROUNDED_IN_SOURCE" \
            "REPRESENT-D1|source-d1-common|represent-d1|RIVAL_NOT_GROUNDED_IN_SOURCE" \
            "EXPLAIN-D2|source-d2-common|explain-d2|NONE" \
            "APPLY-D2|source-d2-common|apply-d2|NONE" \
            "REPRESENT-D2|source-d2-common|represent-d2|SOURCE_RIVAL_VOCAB_INVALID" \
            "SYNTHESIZE-D2|source-d2-common|synthesize-d2|NONE" \
            "JUSTIFY-D2|source-d2-common|justify-d2|NONE" \
            "APPLY-D3|source-explain-d3|apply-d3|NONE" \
            "REPRESENT-D3|source-explain-d3|represent-d3|NONE" \
            "SYNTHESIZE-D3|source-d3-synthesize|synthesize-d3|NONE" \
            "JUSTIFY-D3|source-explain-d3|justify-d3|NONE" \
            "EXPLAIN-D4|source-d4-explain|explain-d4|NONE" \
            "APPLY-D4|source-d4-apply|apply-d4|NONE" \
            "MODEL-D4|source-d4-model|model-d4|NONE" \
            "REPRESENT-D4|source-d4-represent|represent-d4|NONE" \
            "SYNTHESIZE-D4|source-d4-synthesize|synthesize-d4|NONE" \
            "JUSTIFY-D4|source-d4-justify|justify-d4|NONE"; do
            IFS='|' read -r cell root slug expected <<< "$row"
            extra=()
            if [ "$expected" != NONE ]; then extra=(--expected-hold-code "$expected"); fi
            python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_contract.py \
              --authority-root . --source-root "$root" --cell-id "QRT-$cell" \
              --witness-file TEST/imo-research/qrt-tiles/reconciliation/qrt-intent-witnesses-pilot.v1.json \
              --adoption-ledger TEST/imo-research/qrt-tiles/reconciliation/r5-01-28-artifact-adoption.v1.json \
              --out "build/imo182-r8-intent/$slug.json" "${extra[@]}"
          done
      - name: P4 render and SHA-verify all remaining 14 contract-eligible five-Core TEST packages
        run: |
          set -euo pipefail
          for row in \
            "source-d2-common|explain-d2" \
            "source-d2-common|apply-d2" \
            "source-d2-common|synthesize-d2" \
            "source-d2-common|justify-d2" \
            "source-explain-d3|apply-d3" \
            "source-explain-d3|represent-d3" \
            "source-d3-synthesize|synthesize-d3" \
            "source-explain-d3|justify-d3" \
            "source-d4-explain|explain-d4" \
            "source-d4-apply|apply-d4" \
            "source-d4-model|model-d4" \
            "source-d4-represent|represent-d4" \
            "source-d4-synthesize|synthesize-d4" \
            "source-d4-justify|justify-d4"; do
            IFS='|' read -r root slug <<< "$row"
            manifest=$(python - "$slug" <<'PY'
          import json,sys
          from pathlib import Path
          bank=json.loads(Path("TEST/imo-research/qrt-tiles/reconciliation/qrt-intent-witnesses-pilot.v1.json").read_text())
          w=next(x for x in bank["witnesses"] if x["cell_id"]=="QRT-"+sys.argv[1].upper())
          print(w["source_pin"]["manifest_path"])
          PY
            )
            (
              cd "$root"
              python Shared/tools/render_core.py gaps --manifest "$manifest" --reference
              python Shared/tools/render_core.py build --manifest "$manifest" \
                --out "build/imo182-qrt/r8/$slug" --mode PAGES --reference --draft
              # Duplicate by the SAME registered renderer from the SAME pinned
              # source to guard pre-page-SHA legacy receipts (not second renderer).
              python Shared/tools/render_core.py build --manifest "$manifest" \
                --out "build/imo182-qrt/r8-repeat/$slug" --mode PAGES --reference --draft
            )
            python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_native_evidence.py \
              --contract "build/imo182-r8-intent/$slug.json" \
              --source-root "$root" --native-output "$root/build/imo182-qrt/r8/$slug" \
              --independent-rebuild "$root/build/imo182-qrt/r8-repeat/$slug" \
              --out "build/imo182-r8-intent/$slug-native.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("build/imo182-r8-intent")
          new=["explain-d2","apply-d2","synthesize-d2","justify-d2","apply-d3","represent-d3","synthesize-d3","justify-d3","explain-d4","apply-d4","model-d4","represent-d4","synthesize-d4","justify-d4"]
          assert len(new)==14
          assert all(json.loads((base/(cell+"-native.json")).read_text())
                     ["native_evidence"]["all_role_structure"]=="PASS" for cell in new)
          print("P4 fourteen NEW source-specific proposals with 70/70 actual Core pages checked against frozen owner structural snapshots")
          PY
      - name: P4 enumerate all 28 authored QRT cells without manufacturing 19 missing contracts
        run: |
          python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_coverage.py \
            --ledger TEST/imo-research/qrt-tiles/reconciliation/r5-01-28-artifact-adoption.v1.json \
            --witness-bank TEST/imo-research/qrt-tiles/reconciliation/qrt-intent-witnesses-pilot.v1.json \
            --evidence-dir build/imo182-r8-intent \
            --out build/imo182-r8-qrt-intent-coverage.v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("build/imo182-r8-qrt-intent-coverage.v1.json").read_text())
          assert len(j["cells"]) == 28
          assert (j["contract_validated_proposals"],
                  j["explicit_rival_declaration_holds"],
                  j["not_yet_question_specific_contract_tested"]) == (21,7,0)
          assert j["new_native_role_structural_witnesses"] == 105
          assert j["qualified_academic_signatures"] == j["owner_accepted_cells"] == 0
          print("P4 28/28 accounted, 21 validated, 7 source metadata HOLD, 0 pending;"
                " academic/Owner zero, no artificial semantic pass")
          PY
      - name: R8 P2b click actual native role routes and measure assisted-return integrity
        run: |
          set -euo pipefail
          python -m py_compile TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_real_navigation.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "TEST/imo-research/qrt-tiles/reconciliation")
          from qrt_intent_real_navigation import classify_assisted_return
          names=("context_link_at_source","return_link_at_concept",
                 "return_state_assisted","source_attempt_restored")
          all_missing=classify_assisted_return({name:False for name in names})
          assert len(all_missing)==4 and len(set(all_missing))==4
          assert classify_assisted_return({name:True for name in names})==[]
          for name in names:
              result=classify_assisted_return({key:key != name for key in names})
              assert len(result)==1 and result[0] in all_missing
          print("P2b negative detector tests: 4 independent broken-route mutations caught")
          PY
          for row in \
            "source-explain-d3|explain-d3" \
            "source-model-d2|model-d2" \
            "source-retrieve-d2|retrieve-d2" \
            "source-retrieve-d4|retrieve-d4"; do
            IFS='|' read -r root cell <<< "$row"
            python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_real_navigation.py \
              --native-contract "build/imo182-r8-intent/$cell-native.json" \
              --source-root "$root" --native-output "$root/build/imo182-qrt/r8/$cell" \
              --out "build/imo182-r8-intent/$cell-real-navigation.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          reports=[json.loads(x.read_text()) for x in
              sorted(Path("build/imo182-r8-intent").glob("*-real-navigation.json"))]
          assert len(reports)==4
          assert all(len(x["observed_integrity_gaps"])==4 for x in reports)
          assert all(not x["assisted_return"]["context_link_at_source"] and
                     not x["assisted_return"]["return_link_at_concept"] and
                     not x["assisted_return"]["return_state_assisted"] and
                     not x["assisted_return"]["source_attempt_restored"]
                     for x in reports)
          assert sum(len(x["native_role_paths"]) for x in reports)==16
          assert all(x["clicked_actual_role_transitions"] == 10 for x in reports)
          assert all(x["independence_from_return_visit"] is False and
              x["owner_acceptance"] is False and
              x["status"]=="HOLD_REVIEW_REQUIRED" for x in reports)
          print("P2b four-cell real Chromium cross-Core navigation recorded;",
                "do NOT count assisted route as independent mastery")
          PY
      - name: P5 independently reviewable 28-cell decision handoff without autogenerated approvals
        run: |
          set -euo pipefail
          python -m py_compile TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_review_handoff.py
          python TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_review_handoff.py \
