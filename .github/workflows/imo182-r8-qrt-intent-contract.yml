                     and x["qualified_independent_reviewer"]["decision"] is None
                     and x["owner_separate_disposition"]["decision"] is None
                     and x["release"]=="HOLD" for x in r)
          assert len([x for x in r if x["blocking_source_author_action"]]) == 7
          navigation=[x for x in r if any(
              z["name"]=="TEN_ACTUAL_NATIVE_SHELL_CLICKS_NOT_CONTEXTUAL_QRT_APPROVAL"
              for z in x["available_scoped_browser_proof"])]
          assert len(navigation)==4
          assert all(not any(
              z.get("assisted_return_verified") is True for z in
              x["available_scoped_browser_proof"]) for x in navigation)
          print("P5 28 separate reviewer handoffs, 336 question-level H/S/P/M reviews NOT_RUN, "
                "7 source-author repair requests, 0 signatures/Owner acceptances")
          PY
