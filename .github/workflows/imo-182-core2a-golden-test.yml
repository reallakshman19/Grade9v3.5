name: IMO 182 Core2A TEST page and candidate golden evidence

on:
  pull_request:
    paths:
      - '.github/workflows/imo-182-core2a-golden-test.yml'
      - 'TEST/products/imo-g9-182-core2a-first.manifest.json'
      - 'tests/imo_182_core2a_golden.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-core2a:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate selected TEST question and QRT provenance
        run: |
          python -m pip install --quiet jsonschema
          python -m unittest tests.test_core_authored_qrt_repair_journey -v
          python Shared/tools/question_review_matrix.py check
      - name: Render actual Core2A from registered blueprint at REFERENCE depth, never public
        run: |
          python Shared/tools/render_core.py build \
            --manifest TEST/products/imo-g9-182-core2a-first.manifest.json \
            --out "$RUNNER_TEMP/imo-182-core2a" --mode PAGES --draft --reference
      - name: Build existing candidate golden using same sole renderer
        run: |
          python Shared/tools/build_golden.py --id G-MATH-LINEAR-CONSTRAINT
      - name: Compare learner anatomy, gated hint/attempt, independent check and QRT status
        run: |
          python tests/imo_182_core2a_golden.py \
            --rendered "$RUNNER_TEMP/imo-182-core2a/core2a.html" \
            --golden golden/units/G-MATH-LINEAR-CONSTRAINT/rendered/core2a.html \
            --manifest TEST/products/imo-g9-182-core2a-first.manifest.json \
            --report "$RUNNER_TEMP/imo-182-core2a-comparison.json"
      - name: Upload metadata-only evidence, not learner HTML or protected KEY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo-182-core2a-golden-structural-evidence
          path: ${{ runner.temp }}/imo-182-core2a-comparison.json
          retention-days: 7
          if-no-files-found: warn
