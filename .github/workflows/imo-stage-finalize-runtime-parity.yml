# Self-removing one-shot PR branch parity repair. Never merge this workflow.
name: IMO finalize runtime manifest projections
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/imo-stage-finalize-runtime-parity.yml'
permissions:
  contents: write
jobs:
  regenerate-and-remove-self:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent1/imo-matrix-first-authored-justify-d3-130' &&
      github.event.pull_request.number == 155
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove one-time workflow before computing final-state projections
        run: |
          set -euo pipefail
          git rm -- .github/workflows/imo-stage-finalize-runtime-parity.yml
      - name: Generate exact final-state runtime, architecture and Pages files
        run: |
          set -euo pipefail
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_pages_site.PagesSiteTest.test_committed_pages_mirror_is_current -v
      - name: Reject any out-of-scope file changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
            ".github/workflows/imo-stage-finalize-runtime-parity.yml",
            "tools/data.js", "public/data/data.js",
            "public/core-learning/data.js", "docs/data/data.js",
            "docs/tools/data.js", "docs/core-learning/data.js",
            "docs/architecture-manifest.json", "docs/.pages-manifest.json"
          }
          unstaged = subprocess.check_output(
            ["git", "diff", "--name-only"], text=True).splitlines()
          staged = subprocess.check_output(
            ["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          untracked = subprocess.check_output(
            ["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines()
          changed = set(unstaged + staged + untracked)
          print("Final generated diff:", sorted(changed))
          if changed - allowed:
              raise SystemExit("Refuse unrelated files: " + ", ".join(sorted(changed - allowed)))
          PY
      - name: Commit final deterministic generated assets and the one-shot deletion
        run: |
          set -euo pipefail
          git add -- tools/data.js public/data/data.js public/core-learning/data.js \
            docs/data/data.js docs/tools/data.js docs/core-learning/data.js \
            docs/architecture-manifest.json docs/.pages-manifest.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(core): converge runtime data and remove one-shot repair workflow'
          git push origin 'HEAD:refs/heads/agent1/imo-matrix-first-authored-justify-d3-130'
