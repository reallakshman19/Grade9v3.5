name: IMO #265 upstream Pages mirror reconcile (temporary)
on:
  push:
    branches:
      - agent/265-current-research-pages-audit-20261015
permissions:
  contents: write
jobs:
  reconcile-pages-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse any branch mismatch
        env:
          TARGET: agent/265-current-research-pages-audit-20261015
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET"
          test "$(git branch --show-current)" = "$TARGET"
          test -z "$(git status --porcelain)"
      - name: Run guarded current-upstream KaTeX and actual Pages checks
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_imo_katex_audit_temp -v
          python3 -m unittest tests.test_imo_math_and_font_quality -v
          python3 -m unittest tests.test_pr306_ui_regressions.Pr306UiRegressions.test_katex_vendor_dependency_closure_and_no_jsdelivr_runtime -v
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_pages_site -v
      - name: Hard allowlist changed files and preserve current authored source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          allowed = {'docs/.pages-manifest.json', 'docs/test/imo-grade9/core1b.html', 'docs/standalone/mathematics-imo-grade9-master-suite.html'}
          rows = subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines()
          modified = {r[3:] for r in rows}
          if not modified:
              raise SystemExit("NO_DIFF: expected three current-upstream Pages outputs")
          unexpected = modified - allowed
          if unexpected:
              raise SystemExit(f"OUT_OF_SCOPE_GENERATION: {sorted(unexpected)}")
          if modified != allowed:
              raise SystemExit(f"EXPECTED_THREE_PAGES_OUTPUTS: {sorted(modified)}")
          print("SCOPE_OK: exact generated mirror diff", *sorted(modified),sep="\n - ")
          subprocess.run(['git','add','--',*sorted(modified)],check=True)
          PY
      - name: Commit only Pages mirror data to isolated branch
        env:
          TARGET: agent/265-current-research-pages-audit-20261015
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET"
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(#265): synchronize only drifted current-upstream Pages mirror'
          git push origin "HEAD:refs/heads/$TARGET"
