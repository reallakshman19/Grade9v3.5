name: IMO182 R11 native postcommit roundtrip falsifiers
on:
  pull_request:
    paths:
      - '.github/workflows/imo182-r11-postcommit-native.yml'
      - 'TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_real_navigation.py'
      - 'TEST/imo-research/qrt-tiles/reconciliation/test_qrt_r11_native_postcommit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postcommit-predicate-and-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing native audit dependency
        run: python -m pip install --quiet playwright
      - name: Compile R11 native audit and reject mutation controls
        run: |
          python -m py_compile TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_real_navigation.py TEST/imo-research/qrt-tiles/reconciliation/test_qrt_r11_native_postcommit.py
          python -m unittest discover -s TEST/imo-research/qrt-tiles/reconciliation -p test_qrt_r11_native_postcommit.py -v
