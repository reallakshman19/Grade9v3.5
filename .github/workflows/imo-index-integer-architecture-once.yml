# Self-deleting one-shot research generator projection for PR #155; not a release.
name: IMO integer trial architecture projection repair
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/imo-index-integer-architecture-once.yml'
permissions:
  contents: write
jobs:
  update-architecture-index:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent1/imo-matrix-first-authored-justify-d3-130' &&
      github.event.pull_request.number == 155
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate only final-state architecture projection after removing this workflow
        run: |
          set -euo pipefail
          python3 -m pip install --quiet jsonschema
          git rm -- .github/workflows/imo-index-integer-architecture-once.yml
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_pages_site.PagesSiteTest.test_committed_pages_mirror_is_current -v
      - name: Prove only indexed test and generator output changed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
            ".github/workflows/imo-index-integer-architecture-once.yml",
            "docs/architecture-manifest.json"
          }
          paths = set()
          for command in (
            ["git","diff","--name-only"],
            ["git","diff","--cached","--name-only"],
            ["git","ls-files","--others","--exclude-standard"]
          ):
            paths.update(subprocess.check_output(command,text=True).splitlines())
          print("Exact generated files:",sorted(paths))
          if paths - expected:
            raise SystemExit("Unexpected generated changes: " + repr(sorted(paths - expected)))
          PY
      - name: Commit generated architecture index and remove this temporary workflow atomically
        run: |
          set -euo pipefail
          git add -- docs/architecture-manifest.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(imo): index isolated integer Core1A trial tests in architecture map'
          git push origin 'HEAD:refs/heads/agent1/imo-matrix-first-authored-justify-d3-130'
