name: IMO 182 Owner-designated five-Core golden lock (TEST only)

on:
  pull_request:
    paths:
      - '.github/workflows/imo-182-owner-golden-lock.yml'
      - 'tests/test_imo182_owner_golden_snapshot.py'
      - 'tests/test_imo182_owner_v31_qrt_identity.py'
      - 'golden/units/G-IMO-G9-FIVE-CORE-20261012/**'
      - 'TEST/products/imo-182-five-core-integrated-review.manifest.json'
      - 'TEST/imo-research/pilots/imo182-core2b-transfer-pilot.v1.json'
      - 'TEST/library/figures/core1a-consecutive-divisibility-staged.svg'
      - 'TEST/library/figures/core2b-four-consecutive-attempt-safe.svg'
      - 'Shared/tools/render_core.py'
      - 'Shared/web/interactive-page-blueprints.v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-owner-golden:
    name: Exact HTML lock + sole-renderer five-page rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing schema dependency
        run: python -m pip install --quiet jsonschema
      - name: Compare all five Owner snapshot SHA and byte-exact TEST renderer output
        run: python -m unittest tests.test_imo182_owner_golden_snapshot -v
      - name: Verify source-to-golden named-QRT identity without academic approval
        run: python -m unittest tests.test_imo182_owner_v31_qrt_identity -v
      - name: Independently rebuild pinned golden fixture via sole registered renderer
        run: python Shared/tools/build_golden.py --id G-IMO-G9-FIVE-CORE-20261012 --check
