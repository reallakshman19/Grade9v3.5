name: One-shot IMO C5 source receipt resource fix parity
on:
  push:
    branches:
      - agent1/imo-core2-private-acquisition-gaps-130
    paths:
      - .github/workflows/imo-c5-resource-parity-once.yml
permissions:
  contents: write
concurrency:
  group: imo-c5-resource-parity-once
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'reallakshman19/Grade9v3.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/imo-core2-private-acquisition-gaps-130
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hash-locked generator, delete temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet jsonschema pypdf cffi
          python3 - <<'PY'
          import subprocess
          previous = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert previous == 'c314d66f4611d28cc1a56d5c18c87db2024c6404', (previous, 'c314d66f4611d28cc1a56d5c18c87db2024c6404')
          branch = subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip()
          assert branch == 'agent1/imo-core2-private-acquisition-gaps-130', branch
          PY
          rm .github/workflows/imo-c5-resource-parity-once.yml
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 - <<'PY'
          import subprocess
          allowed = {
            '.github/workflows/imo-c5-resource-parity-once.yml',
            'docs/architecture-manifest.json',
            'docs/core-learning/data.js', 'docs/data/data.js', 'docs/tools/data.js',
            'public/core-learning/data.js', 'public/data/data.js', 'tools/data.js',
            'docs/.pages-manifest.json',
          }
          porcelain = subprocess.check_output(
            ['git', 'status', '--porcelain', '--untracked-files=all'], text=True)
          changed = {line[3:] for line in porcelain.splitlines()}
          assert '.github/workflows/imo-c5-resource-parity-once.yml' in changed, changed
          assert changed <= allowed, sorted(changed - allowed)
          print('SCOPED_PARITY_PATHS:', *sorted(changed), sep='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows/imo-c5-resource-parity-once.yml docs/architecture-manifest.json docs/core-learning/data.js docs/data/data.js docs/tools/data.js public/core-learning/data.js public/data/data.js tools/data.js docs/.pages-manifest.json
          git diff --cached --check
          git commit -m "chore(imo-core2): regenerate manifest after source receipt handle fix (#130)"
          git push origin HEAD:refs/heads/agent1/imo-core2-private-acquisition-gaps-130
