name: QRT249 frozen five-factor evidence regressions

on:
  push:
    branches:
      - repair/qrt249-fivefactor-evidence-batch01

permissions:
  contents: read

jobs:
  frozen-batch01:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen evidence commit
        uses: actions/checkout@v4
        with:
          ref: 8eb5065175bf00469317e3992206776fa6b39d55
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact tested source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8eb5065175bf00469317e3992206776fa6b39d55"
      - name: Run Batch 01 and Batch 02 source-side falsification tests
        run: python -m unittest tests/test_imo_five_factor_batch01.py tests/test_imo_five_factor_batch02.py -v
