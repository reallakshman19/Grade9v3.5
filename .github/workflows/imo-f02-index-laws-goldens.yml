name: IMO F02 Index Laws authored TEST and golden checks

on:
  pull_request:
    paths:
      - "TEST/imo-research/candidates/**"
      - "TEST/imo-research/golden/**"
      - "tests/test_imo_327_*.py"
      - ".github/workflows/imo-f02-index-laws-goldens.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  content-and-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Core1A independent math, assumptions and negative mutations
        run: python -m unittest discover -s tests -p 'test_imo_327_core1a_math_proof.py' -v
      - name: Enforce concept-first versus question-hint authored modes
        run: python -m unittest discover -s tests -p 'test_imo_327_help_mode_separation.py' -v
      - name: Test emitted TEST Core1A lesson concept checkpoint
        run: python -m unittest discover -s tests -p 'test_imo_138_core1a_concept_runtime.py' -v
      - name: Verify 3 SHA-locked QRT goldens and negative mutations
        run: python -m unittest discover -s tests -p 'test_imo_327_qrt_help_golden.py' -v
