name: IMO 203 D4 evidence index integrity (TEST only)

on:
  pull_request:
    paths:
      - '.github/workflows/imo-203-d4-review-index.yml'
      - 'TEST/imo-research/qrt-tiles/d4-review/**'
      - 'TEST/imo-research/qrt-tiles/q003-model-d2/band-issues.v1.json'
      - 'TEST/imo-research/qrt-tiles/q003-model-d2/index.html'
      - 'tests/test_imo203_d4_adoption_index.py'
      - 'tests/test_imo203_new_d4_candidate_math.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert seven-cell review integrity and independent mathematics
        run: python -m unittest tests.test_imo203_d4_adoption_index tests.test_imo203_new_d4_candidate_math -v
