name: One-shot IMO C5 Q004 generated artifact parity
on:
  push:
    branches:
      - agent1/imo-core2-private-acquisition-gaps-130
    paths:
      - .github/workflows/imo-c5-source-parity-once.yml

permissions:
  contents: write

concurrency:
  group: imo-c5-source-parity-once
  cancel-in-progress: false

jobs:
  regenerate-exact-source:
    if: github.repository == 'reallakshman19/Grade9v3.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/imo-core2-private-acquisition-gaps-130
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate only governed source-derived files, remove workflow and push once
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet jsonschema pypdf cffi
          python3 - <<'PY'
          import subprocess
          expected = 'da42a7cb2620edff3f5a8f25980669224ab72c83'
          previous = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert previous == expected, (previous, expected)
          branch = subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip()
          assert branch == 'agent1/imo-core2-private-acquisition-gaps-130', branch
          PY
          rm .github/workflows/imo-c5-source-parity-once.yml
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/imo-c5-source-parity-once.yml',
              'docs/architecture-manifest.json',
              'docs/core-learning/data.js', 'docs/data/data.js',
              'docs/tools/data.js', 'public/core-learning/data.js',
              'public/data/data.js', 'tools/data.js',
              'docs/.pages-manifest.json',
          }
          porcelain = subprocess.check_output(
              ['git','status','--porcelain','--untracked-files=all'],text=True)
          changed = {line[3:] for line in porcelain.splitlines()}
          assert changed, 'no changed files or deleted one-time workflow'
          assert changed <= allowed, sorted(changed - allowed)
          assert '.github/workflows/imo-c5-source-parity-once.yml' in changed
          print('ALLOWLISTED_GENERATED_PATHS:', *sorted(changed),sep='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows/imo-c5-source-parity-once.yml docs/architecture-manifest.json docs/core-learning/data.js docs/data/data.js docs/tools/data.js public/core-learning/data.js public/data/data.js tools/data.js docs/.pages-manifest.json
          git diff --cached --check
          git commit -m "chore(imo-core2): regenerate Q004 private review source projections (#130)"
          git push origin HEAD:refs/heads/agent1/imo-core2-private-acquisition-gaps-130
