name: IMO 130 one-shot research mirror parity
on:
  push:
    branches:
      - agent1/imo-matrix-first-authored-justify-d3-130
    paths:
      - .github/workflows/imo-130-one-shot-research-parity.yml
permissions:
  contents: write
jobs:
  regenerate-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scoped branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Select generator Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.22,<5'
      - name: Verify updated candidate inputs and generate governed mirrors
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'data-g9-test-banner' public/test/imo-grade9/core1a.html
          ! grep -Eq 'href=["\x27][^"\x27]*test/' public/mathematics/imo-grade9/index.html
          python Shared/tools/build_manifest.py
          python Shared/tools/build_pages_site.py
          python Shared/tools/build_manifest.py --check
          python Shared/tools/build_pages_site.py --check
      - name: Reject unexpected writes and remove one-shot job
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/imo-130-one-shot-research-parity.yml
          git status --short
          while IFS= read -r changed; do
            case "$changed" in
              docs/test/imo-grade9/core1a.html|docs/mathematics/imo-grade9/index.html|\
              docs/architecture-manifest.json|docs/.pages-manifest.json|\
              .github/workflows/imo-130-one-shot-research-parity.yml) ;;
              *) echo "UNEXPECTED CHANGE: $changed" >&2; exit 1 ;;
            esac
          done < <( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows/imo-130-one-shot-research-parity.yml docs/test/imo-grade9/core1a.html docs/mathematics/imo-grade9/index.html docs/architecture-manifest.json docs/.pages-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(imo): mirror scoped TEST research fixes and remove one-shot workflow (#130)"
            git push origin "HEAD:refs/heads/agent1/imo-matrix-first-authored-justify-d3-130"
          fi
