name: QRT249 independent PR259 candidate witness (read-only)

on:
  push:
    branches:
      - agent/issue249-qrt-validator-v1
    paths:
      - '.github/workflows/qrt249-independent-repair-candidate.yml'
      - 'Shared/tools/imo_qrt_candidate_receipt.py'
      - 'tests/test_imo_qrt_candidate_receipt.py'
      - 'Shared/tools/imo_qrt_standalone_gate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qrt249-candidate-read-only
  cancel-in-progress: true

jobs:
  independent-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Eight independent source-custody falsifiers
        run: python -m unittest discover -s tests -p 'test_imo_qrt_candidate_receipt.py' -v
      - name: Pin exact live PR259 repair candidate in read-only worktree
        shell: bash
        id: candidate
        run: |
          set -euo pipefail
          git fetch origin refs/pull/259/head:refs/remotes/origin/qrt249-issue254-candidate
          SHA="$(git rev-parse refs/remotes/origin/qrt249-issue254-candidate)"
          git worktree add --detach "$RUNNER_TEMP/qrt249-issue254-candidate" "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "root=$RUNNER_TEMP/qrt249-issue254-candidate" >> "$GITHUB_OUTPUT"
          echo "Candidate PR259 at $SHA; candidate code is NEVER EXECUTED by this workflow"
      - name: Examine source custody and four generated outputs without executing PR code
        shell: bash
        run: |
          set +e
          python Shared/tools/imo_qrt_candidate_receipt.py \
            --candidate-root "${{ steps.candidate.outputs.root }}" \
            --baseline-sha 27a35c50b0e976b6f6112fc953aec5445f078caf \
            --candidate-sha "${{ steps.candidate.outputs.sha }}" \
            --output build/imo-qrt-249/repair-candidate-receipt.json
          RECEIPT_EXIT=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('build/imo-qrt-249/repair-candidate-receipt.json')
          assert f.is_file(), "Independent candidate evidence must be present"
          report=json.loads(f.read_text(encoding='utf-8'))
          assert report['scope']=='RESEARCH_STANDALONE_ONLY'
          assert report['academic_verdict']=='REVIEW_REQUIRED'
          assert report['source_custody']['base_question_count']==260
          assert len(report['html']['endpoints'])==4
          print('SOURCE-SAFE REVIEW RESULT:',report['status'])
          print('FAIL/REVIEW is valid for an UNFROZEN source candidate; this CI never declares academic or merge acceptance.')
          PY
          echo "Independent candidate inspector return code: $RECEIPT_EXIT"
          # Source PR259 is not yet frozen; preserve adverse findings in artifact.
      - name: Publish exact-head candidate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrt249-pr259-independent-candidate
          path: build/imo-qrt-249/repair-candidate-receipt.json
          if-no-files-found: error
