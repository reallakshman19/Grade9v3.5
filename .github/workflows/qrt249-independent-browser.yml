name: QRT249 independent PR259 Chromium witness

on:
  push:
    branches:
      - agent/issue249-qrt-validator-v1
    paths:
      - '.github/workflows/qrt249-independent-browser.yml'
      - 'Shared/tools/imo_qrt_candidate_browser.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qrt249-independent-browser
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin current PR259 source candidate, never execute its Python
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/pull/259/head:refs/remotes/origin/qrt259-browser-candidate
          SHA="$(git rev-parse refs/remotes/origin/qrt259-browser-candidate)"
          git worktree add --detach "$RUNNER_TEMP/qrt259-browser-candidate" "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "root=$RUNNER_TEMP/qrt259-browser-candidate" >> "$GITHUB_OUTPUT"
          echo "Independent browser witness candidate exact SHA: $SHA"
      - name: Install isolated Chromium runtime
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real learner interactions on 4 viewports, 260 hidden-state checks
        shell: bash
        run: |
          python Shared/tools/imo_qrt_candidate_browser.py \
            --candidate-root "${{ steps.candidate.outputs.root }}" \
            --candidate-sha "${{ steps.candidate.outputs.sha }}" \
            --output build/imo-qrt-249/browser-review.json \
            --screenshots build/imo-qrt-249/screenshots
      - name: Upload exact-head independent browser verdict and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrt249-pr259-independent-browser
          path: |
            build/imo-qrt-249/browser-review.json
            build/imo-qrt-249/screenshots/
          if-no-files-found: warn
