name: IMO182 R10 native assisted-return target falsifiers

on:
  pull_request:
    paths:
      - '.github/workflows/imo182-r10-native-return-targeting.yml'
      - 'TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_real_navigation.py'
      - 'TEST/imo-research/qrt-tiles/reconciliation/test_qrt_r10_native_return_targeting.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-return-target-falsifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-harness dependency (no browser needed for pure predicates)
        run: python -m pip install --quiet playwright
      - name: Compile existing native navigation audit and run 14 adversarial targets
        run: |
          python -m py_compile \
            TEST/imo-research/qrt-tiles/reconciliation/qrt_intent_real_navigation.py \
            TEST/imo-research/qrt-tiles/reconciliation/test_qrt_r10_native_return_targeting.py
          python -m unittest discover \
            -s TEST/imo-research/qrt-tiles/reconciliation \
            -p test_qrt_r10_native_return_targeting.py -v
