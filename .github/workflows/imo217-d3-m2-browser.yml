name: IMO217 D3 M2 local HTTP native browser evidence

on:
  push:
    branches:
      - 'agent/issue-217-d3-native-evidence-20261014'
    paths:
      - '.github/workflows/imo217-d3-m2-browser.yml'
      - 'TEST/imo-research/qrt-d3-successor/**'
  pull_request:
    paths:
      - '.github/workflows/imo217-d3-m2-browser.yml'
      - 'TEST/imo-research/qrt-d3-successor/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-http-browser:
    name: 75 native viewports and five protected H2/H3 chains
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent browser/schema dependencies
        run: |
          python -m pip install --quiet jsonschema playwright
          python -m playwright install --with-deps chromium
      - name: Assert question review matrix and source-native role selection
        run: |
          python Shared/tools/question_review_matrix.py check
          python Shared/tools/question_review_matrix.py write --check
      - name: Rebuild only the five provisionally eligible native bundles
        run: |
          set -eu
          for d in explain apply represent synthesize justify; do
            python Shared/tools/render_core.py gaps --manifest "TEST/products/imo182-qrt-d3-$d.manifest.json" --reference
            python Shared/tools/render_core.py build --manifest "TEST/products/imo182-qrt-d3-$d.manifest.json" --out "build/imo182-qrt/d3/$d" --mode PAGES --reference --draft
          done
      - name: Exact source/immutable golden/native receipt gate
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python TEST/imo-research/qrt-d3-successor/native_audit_217.py
      - name: Real CSS/JS HTTP/Chromium viewport, H2/H3, SVG and commitment observations
        run: python TEST/imo-research/qrt-d3-successor/browser_stage_217.py
      - name: Archive actual M2 screenshots and machine observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo217-d3-m2-http-chromium-evidence
          path: |
            build/imo182-qrt/d3-successor/m1-evidence.v1.json
            build/imo182-qrt/d3-successor/m2/
          if-no-files-found: warn
          retention-days: 30
