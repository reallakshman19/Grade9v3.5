name: IMO182 QRT EXPLAIN D3 sole-renderer and golden QA

on:
  push:
    branches:
      - 'agent-d3/imo182-qrt-model-d3'
    paths:
      - '.github/workflows/imo182-qrt-d3-explain.yml'
      - 'TEST/imo-research/qrt-d3/explain*'
      - 'TEST/library/figures/qrt-d3-explain-*.svg'
      - 'TEST/products/imo182-qrt-d3-explain.manifest.json'
      - 'tests/test_imo182_qrt_d3_explain.py'
  pull_request:
    paths:
      - '.github/workflows/imo182-qrt-d3-explain.yml'
      - 'TEST/imo-research/qrt-d3/explain*'
      - 'TEST/library/figures/qrt-d3-explain-*.svg'
      - 'TEST/products/imo182-qrt-d3-explain.manifest.json'
      - 'tests/test_imo182_qrt_d3_explain.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain-d3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hosted schema and Chromium QA
        run: |
          python -m pip install --quiet jsonschema playwright
          python -m playwright install --with-deps chromium
      - name: "Build five registered learner roles, no original CORE2"
        run: |
          python Shared/tools/render_core.py build \
            --manifest TEST/products/imo182-qrt-d3-explain.manifest.json \
            --out build/imo182-qrt/d3/explain --draft --reference
      - name: Validate independent quadrilateral proofs, five goldens and live attempt gates
        run: python -m unittest tests.test_imo182_qrt_d3_explain -v
      - name: Exact-head HTML SHA256 receipts
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path("build/imo182-qrt/d3/explain")
          if (root/"render-receipt.json").exists():
              receipt=json.loads((root/"render-receipt.json").read_text())
              rows={n:hashlib.sha256((root/n).read_bytes()).hexdigest() for n in receipt.get("pages",[]) if (root/n).exists()}
              (root/"explain-d3-sha256.json").write_text(json.dumps({"cell":"QRT-EXPLAIN-D3","head":os.environ.get("GITHUB_SHA"),"pages":rows,"gaps":receipt.get("gaps",[]),"accepted":False,"reviewer":"PENDING"},indent=2)+"\n")
              print(json.dumps(rows,indent=2))
          PY
      - name: Upload actual learner role HTML and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo182-qrt-d3-explain-actual-html
          path: build/imo182-qrt/d3/explain/
          if-no-files-found: warn
