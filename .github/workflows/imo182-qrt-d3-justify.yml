name: IMO182 QRT JUSTIFY D3 sole-renderer and golden QA

on:
  push:
    branches:
      - 'agent-d3/imo182-qrt-model-d3'
    paths:
      - '.github/workflows/imo182-qrt-d3-justify.yml'
      - 'TEST/imo-research/qrt-d3/justify*'
      - 'TEST/library/figures/qrt-d3-justify-*.svg'
      - 'TEST/products/imo182-qrt-d3-justify.manifest.json'
      - 'tests/test_imo182_qrt_d3_justify.py'
  pull_request:
    paths:
      - '.github/workflows/imo182-qrt-d3-justify.yml'
      - 'TEST/imo-research/qrt-d3/justify*'
      - 'TEST/library/figures/qrt-d3-justify-*.svg'
      - 'TEST/products/imo182-qrt-d3-justify.manifest.json'
      - 'tests/test_imo182_qrt_d3_justify.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  justify-d3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema and Chromium verification
        run: |
          python -m pip install --quiet jsonschema playwright
          python -m playwright install --with-deps chromium
      - name: Build five registered learner roles from sole renderer, no original CORE2
        run: |
          python Shared/tools/render_core.py build \
            --manifest TEST/products/imo182-qrt-d3-justify.manifest.json \
            --out build/imo182-qrt/d3/justify --draft --reference
      - name: Verify original JUSTIFY mathematics, frozen golden slots and actual Chromium commitment
        run: python -m unittest tests.test_imo182_qrt_d3_justify -v
      - name: Exact-head learner HTML SHA256 and receipt
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("build/imo182-qrt/d3/justify")
          path=root/"render-receipt.json"
          if path.exists():
              receipt=json.loads(path.read_text())
              html={p:hashlib.sha256((root/p).read_bytes()).hexdigest()
                    for p in receipt.get("pages",[]) if (root/p).exists()}
              row={"cell":"QRT-JUSTIFY-D3","head":os.environ.get("GITHUB_SHA"),"pages":html,
                   "gaps":receipt.get("gaps",[]),"academic_accepted":False,"reviewer":"PENDING",
                   "source_rights":"AUTHORED_TEST_ONLY"}
              (root/"justify-d3-sha256.json").write_text(json.dumps(row,indent=2)+"\n")
              print(json.dumps(row,indent=2))
          PY
      - name: Upload actual JUSTIFY learner role HTML and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo182-qrt-d3-justify-actual-html
          path: build/imo182-qrt/d3/justify/
          if-no-files-found: warn
