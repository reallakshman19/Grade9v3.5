# One-time branch-confined repair. Delete from the PR after running.
# Writes only deterministic TEST hub and corresponding Pages mirror outputs.
name: IMO staging TEST generator parity repair
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/imo-stage-generator-parity-repair.yml'
permissions:
  contents: write
jobs:
  exact-generator-repair:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent1/imo-matrix-first-authored-justify-d3-130' &&
      github.event.pull_request.number == 155
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild TEST pages by their canonical generator and Pages mirror
        run: |
          set -euo pipefail
          python Shared/tools/deploy_test.py pages
          python Shared/tools/build_pages_site.py --check
          python -m unittest tests.test_test_area.TestPages.test_committed_pages_are_what_the_generator_writes -v
          python -m unittest tests.test_pages_site.PagesSiteTest.test_committed_pages_mirror_is_current -v
      - name: Fail closed on any unrelated changed output
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
            "public/test/index.html", "public/test/rungs/index.html",
            "public/test/deployments/index.html",
            "docs/test/index.html", "docs/test/rungs/index.html",
            "docs/test/deployments/index.html",
            "docs/.pages-manifest.json",
          }
          dirty = set(subprocess.check_output(
            ["git", "diff", "--name-only"], text=True).splitlines())
          untracked = subprocess.check_output(
            ["git", "ls-files", "--others", "--exclude-standard"],
            text=True).splitlines()
          dirty.update(untracked)
          print("Generated-file differences:", sorted(dirty))
          unexpected = dirty - allowed
          if unexpected:
              raise SystemExit("Cannot auto-commit unrelated generated changes: "
                               + ", ".join(sorted(unexpected)))
          if not dirty:
              print("Canonical TEST/pages output is already current.")
          PY
      - name: Commit only authorized deterministic generator outputs on this PR branch
        run: |
          set -euo pipefail
          git add -- public/test/index.html public/test/rungs/index.html \
            public/test/deployments/index.html docs/test/index.html \
            docs/test/rungs/index.html docs/test/deployments/index.html \
            docs/.pages-manifest.json
          if git diff --cached --quiet; then
            echo "No generated updates needed."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(test): regenerate stale TEST hub and Pages mirror from canonical builders'
          git push origin 'HEAD:refs/heads/agent1/imo-matrix-first-authored-justify-d3-130'
