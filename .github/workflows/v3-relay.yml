name: v31-relay

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The current branch's earlier push/PR runs are superseded by the newer
# same-event commit. Keep PR-specific checks distinct from push checks and
# NEVER cancel main's runs. All validation jobs remain mandatory.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-v31:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Grade9V3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Engineering Relay V3.1
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 45301dc3e553b1b7be8ab66fac00512353479ee2
          path: _common_v31
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install relay validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate V3.1 recorder foundation
        run: python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .

      - name: Validate current PR task binding
        if: ${{ github.event_name == 'pull_request' }}
        run: python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_task_binding.py --root . --event "$GITHUB_EVENT_PATH"
