name: IMO 182 QRT JUSTIFY D4 authored TEST (sole renderer)

on:
  pull_request:
    paths:
      - '.github/workflows/imo-182-qrt-d4-justify.yml'
      - 'TEST/imo-research/qrt-d4/**'
      - 'TEST/products/imo182-qrt-d4-justify.manifest.json'
      - 'tests/test_imo182_qrt_d4_justify.py'
      - 'tests/imo182_qrt_d4_justify_browser.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4-five-role:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema and browser harness
        run: python -m pip install --quiet jsonschema playwright
      - name: Render six actual pages using only registered renderer
        run: |
          python Shared/tools/render_core.py build --manifest TEST/products/imo182-qrt-d4-justify.manifest.json --out build/imo182-qrt/d4/justify --draft --reference
      - name: Validate schema, maths, H3 protection and all five rendered roles
        run: python -m unittest tests.test_imo182_qrt_d4_justify -v
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Actual Chromium screenshot/initial-attempt validation
        run: python tests/imo182_qrt_d4_justify_browser.py
      - name: SHA256 receipt and exact role filenames
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          folder=Path("build/imo182-qrt/d4/justify")
          if not folder.exists():
              print("No renderer output; cell BLOCKED_RENDER, not counted")
          else:
              rows=[{"role":p.name,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(folder.glob("*.html"))]
              evidence={"cell":"QRT-JUSTIFY-D4","accepted":False,"source_rights":"AUTHORED_TEST_ONLY","golden_technique":"PENDING_REVIEW","generated_by":"Shared/tools/render_core.py","html":rows}
              (folder/"d4-evidence.json").write_text(json.dumps(evidence,indent=2)+"\n")
              print(json.dumps(evidence,indent=2))
          PY
      - name: Upload actual generated HTML + receipt + browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo182-qrt-justify-d4-actual-html
          path: build/imo182-qrt/d4/justify/
          if-no-files-found: warn
