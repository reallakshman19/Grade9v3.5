name: One-shot IMO C5 private visual integrity parity
on:
  push:
    branches: [agent1/imo-core2-private-acquisition-gaps-130]
    paths: [.github/workflows/imo-c5-visual-parity-once.yml]
permissions:
  contents: write
concurrency:
  group: imo-c5-visual-parity-once
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'reallakshman19/Grade9v3.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/imo-core2-private-acquisition-gaps-130
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hash-locked generated manifest fix and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet jsonschema pypdf cffi
          python3 - <<'PY'
          import subprocess
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          branch = subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip()
          assert parent == 'e1866ad4e6c3f6dc70c5ff39d4b6c0dca92b59e2', (parent, 'e1866ad4e6c3f6dc70c5ff39d4b6c0dca92b59e2')
          assert branch == 'agent1/imo-core2-private-acquisition-gaps-130', branch
          PY
          rm .github/workflows/imo-c5-visual-parity-once.yml
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 - <<'PY'
          import subprocess
          raw = subprocess.check_output(
              ['git','status','--porcelain','--untracked-files=all'], text=True)
          changed = {line[3:] for line in raw.splitlines()}
          required = '.github/workflows/imo-c5-visual-parity-once.yml'
          allow = {required, 'docs/architecture-manifest.json'}
          assert required in changed, sorted(changed)
          assert changed <= allow, sorted(changed - allow)
          print('SOURCE_DERIVED_ONLY:', *sorted(changed), sep='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows/imo-c5-visual-parity-once.yml docs/architecture-manifest.json
          git diff --cached --check
          git commit -m "chore(imo-core2): reconcile Q004 visual verification architecture manifest (#130)"
          git push origin HEAD:refs/heads/agent1/imo-core2-private-acquisition-gaps-130
