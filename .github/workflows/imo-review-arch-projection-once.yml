# One-shot manifest synchronization for the new tests/ academic-review packet.
# This file is deleted in the same commit as generated outputs; not a release.
name: IMO academic review architecture projection fix
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/imo-review-arch-projection-once.yml'
permissions:
  contents: write
jobs:
  exact-source-projection:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent1/imo-matrix-first-authored-justify-d3-130' &&
      github.event.pull_request.number == 155
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct architecture manifest with exact tablet dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet jsonschema
          git rm -- .github/workflows/imo-review-arch-projection-once.yml
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_pages_site.PagesSiteTest.test_committed_pages_mirror_is_current -v
      - name: Enforce absolute output allowlist before writing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
            ".github/workflows/imo-review-arch-projection-once.yml",
            "docs/architecture-manifest.json"
          }
          changed = set()
          for argv in (
            ["git","diff","--name-only"],
            ["git","diff","--cached","--name-only"],
            ["git","ls-files","--others","--exclude-standard"]
          ):
            changed.update(subprocess.check_output(argv,text=True).splitlines())
          print("Academic-review projection changes:", sorted(changed))
          if changed - allowed:
            raise SystemExit("Refuse unexpected generator output: " + repr(sorted(changed-allowed)))
          PY
      - name: Commit only architecture projection and self-removal
        run: |
          set -euo pipefail
          git add -- docs/architecture-manifest.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(imo): index academic review tests in generated architecture manifest'
          git push origin 'HEAD:refs/heads/agent1/imo-matrix-first-authored-justify-d3-130'
