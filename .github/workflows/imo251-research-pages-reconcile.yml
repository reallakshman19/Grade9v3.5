# Temporary, branch-restricted repair runner for issue #251.
# No pull_request_target, no production release, no main writes.
name: IMO #251 research Pages/KaTeX artifact reconciliation

on:
  push:
    branches:
      - agent/251-pages-katex-research-only-20261014

permissions:
  contents: write

jobs:
  reconcile-research-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed unless this is the dedicated issue 251 branch
        env:
          EXPECTED_REF: refs/heads/agent/251-pages-katex-research-only-20261014
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$(git branch --show-current)" = "agent/251-pages-katex-research-only-20261014"
          test -z "$(git status --porcelain)"
      - name: Reconcile generated research HTML and the Pages mirror
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_imo_pages_katex_assets.py -v
          python3 Mathematics/research/build_full_master_suite.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_pages_site -v
      - name: Verify actual generated HTML KaTeX targets, safely stage only owned outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          allowed = {
              'standalone/mathematics-imo-grade9-master-suite.html',
              'public/standalone/mathematics-imo-grade9-master-suite.html',
              'public/test/imo-grade9/core2.html',
              'docs/standalone/mathematics-imo-grade9-master-suite.html',
              'docs/test/imo-grade9/core2.html',
              'docs/test/imo-grade9/core1b.html',
              'docs/.pages-manifest.json',
          }
          for item in ('standalone/mathematics-imo-grade9-master-suite.html',
                       'public/standalone/mathematics-imo-grade9-master-suite.html',
                       'public/test/imo-grade9/core2.html',
                       'docs/standalone/mathematics-imo-grade9-master-suite.html',
                       'docs/test/imo-grade9/core2.html'):
              page = Path(item)
              assert page.is_file(), f"Missing generated output: {item}"
              data = page.read_text(encoding='utf-8')
              for asset in ("katex.min.css", "katex.min.js", "contrib/auto-render.min.js"):
                  refs = re.findall(r'["\x27]([^"\x27]*vendor/katex/0\.16\.8/' + re.escape(asset) + r')["\x27]', data)
                  assert len(refs) >= 1, f"Missing declared KaTeX link: {item}, {asset}"
                  for ref in refs:
                      target = (page.parent / ref).resolve()
                      assert target.is_file(), f"Broken KaTeX link: {item} -> {ref}"
          rows = subprocess.check_output(['git', 'status', '--porcelain=v1', '-uall'], text=True).splitlines()
          changed = {row[3:] for row in rows}
          unapproved = sorted(changed - allowed)
          if unapproved:
              raise SystemExit(f"FAIL_CLOSED: unexpected files changed: {unapproved}")
          if not changed:
              raise SystemExit("FAIL_CLOSED: no generated artifacts changed; expected stale baseline")
          print("SCOPE_OK: generated changed files:", *sorted(changed), sep="\n - ")
          subprocess.run(['git', 'add', '--', *sorted(changed)], check=True)
          PY
      - name: Commit only exact scoped generated outputs to the research draft branch
        env:
          TARGET: agent/251-pages-katex-research-only-20261014
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET"
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(imo-research): regenerate scoped Pages KaTeX mirrors [#251]'
          git push origin "HEAD:refs/heads/$TARGET"
