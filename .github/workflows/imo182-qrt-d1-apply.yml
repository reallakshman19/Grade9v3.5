name: IMO 182 QRT APPLY-D1 actual five-role render (TEST)
on:
  pull_request:
    paths:
      - '.github/workflows/imo182-qrt-d1-apply.yml'
      - 'TEST/imo-research/qrt-d1/apply.v1.json'
      - 'TEST/imo-research/qrt-d1/verify_apply.py'
      - 'TEST/imo-research/qrt-d1/figures/apply-*.svg'
      - 'TEST/products/imo182-qrt-d1-apply.manifest.json'
      - 'tests/test_imo182_qrt_d1_apply.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored-apply-d1:
    name: Sole registered renderer APPLY D1 five Core roles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet jsonschema
      - name: Independently check 625 area/inverse cases
        run: python TEST/imo-research/qrt-d1/verify_apply.py
      - name: Render actual five TEST learner pages
        run: |
          python Shared/tools/render_core.py build \
            --manifest TEST/products/imo182-qrt-d1-apply.manifest.json \
            --out build/imo182-qrt/d1/apply --draft --reference
      - name: Prove schema, protected W, five roles and frozen golden
        run: python -m unittest tests.test_imo182_qrt_d1_apply -v
      - name: Verify zero depth gaps and write SHA receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          out=Path("build/imo182-qrt/d1/apply")
          receipt=json.loads((out/"render-receipt.json").read_text())
          assert receipt["gaps"]==[],receipt["gaps"]
          roles=["core1.html","core1a.html","core1b.html","core2a.html","core2b.html"]
          assert set(roles)<=set(receipt["pages"])
          info={"cell":"QRT-APPLY-D1","source":"AUTHORED_TEST","accepted":"0/28",
                "academic_review":"PENDING","status":"RENDERED_TEST_ONLY",
                "pages":{x:hashlib.sha256((out/x).read_bytes()).hexdigest() for x in roles}}
          (out/"d1-apply-evidence.json").write_text(json.dumps(info,indent=2)+"\n")
          print(json.dumps(info,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imo182-qrt-d1-apply-five-core-html
          path: build/imo182-qrt/d1/apply/
          if-no-files-found: warn
