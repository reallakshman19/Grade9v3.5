name: IMO 182 QRT MODEL D4 authored TEST (sole renderer)

on:
  pull_request:
    paths:
      - '.github/workflows/imo-182-qrt-d4-model.yml'
      - 'TEST/imo-research/qrt-d4/model-d4.*'
      - 'TEST/imo-research/qrt-d4/figures/model-*.svg'
      - 'TEST/products/imo182-qrt-d4-model.manifest.json'
      - 'tests/test_imo182_qrt_d4_model.py'
      - 'tests/imo182_qrt_d4_model_browser.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-d4-five-role:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator and browser package
        run: python -m pip install --quiet jsonschema playwright
      - name: Sole registered TEST renderer
        run: python Shared/tools/render_core.py build --manifest TEST/products/imo182-qrt-d4-model.manifest.json --out build/imo182-qrt/d4/model --draft --reference
      - name: Schema, flood-fill mathematical oracle, golden slots and H3
        run: python -m unittest tests.test_imo182_qrt_d4_model -v
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Actual browser five roles, separate boundary, blank attempt and H3
        run: python tests/imo182_qrt_d4_model_browser.py
      - name: SHA256 per exact actual HTML file
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          folder=Path('build/imo182-qrt/d4/model')
          if folder.exists():
              evidence={'cell':'QRT-MODEL-D4','qrt_accepted':False,'source_rights':'AUTHORED_TEST_ONLY','renderer':'Shared/tools/render_core.py',
                        'html':[{'role':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(folder.glob('*.html'))]}
              (folder/'model-d4-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
              print(json.dumps(evidence,indent=2))
          else:
              print('BLOCKED_RENDER: no actual HTML')
          PY
      - name: Preserve real HTML, receipt and six browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo182-qrt-model-d4-actual-html
          path: build/imo182-qrt/d4/model/
          if-no-files-found: warn
