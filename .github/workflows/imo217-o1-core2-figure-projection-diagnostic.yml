name: IMO217 O1 safe preattempt SVG stage-label review (NOT acceptance)

on:
  push:
    branches:
      - 'agent/issue-217-d3-native-evidence-20261014'
    paths:
      - '.github/workflows/imo217-o1-core2-figure-projection-diagnostic.yml'
      - 'TEST/imo-research/qrt-d3-successor/core2b_o1_figure_diagnostic_217.py'
      - 'TEST/imo-research/qrt-d3/explain.v1.json'
      - 'TEST/library/figures/qrt-d3-explain-*.svg'
  pull_request:
    paths:
      - '.github/workflows/imo217-o1-core2-figure-projection-diagnostic.yml'
      - 'TEST/imo-research/qrt-d3-successor/core2b_o1_figure_diagnostic_217.py'
      - 'TEST/imo-research/qrt-d3/explain.v1.json'
      - 'TEST/library/figures/qrt-d3-explain-*.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-safe-scrub-and-generic-authored-stage-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual renderer and native browser runtime
        run: |
          python -m pip install --quiet jsonschema playwright
          python -m playwright install --with-deps chromium
      - name: Re-render authored EXPLAIN-D3 via the registered sole renderer
        run: |
          python Shared/tools/render_core.py gaps \
            --manifest TEST/products/imo182-qrt-d3-explain.manifest.json --reference
          python Shared/tools/render_core.py build \
            --manifest TEST/products/imo182-qrt-d3-explain.manifest.json \
            --out build/imo182-qrt/d3/explain --mode PAGES --reference --draft
      - name: Verify protected-W metadata scrub and flag generic authored Stage 1 label in actual Chromium
        run: |
          python TEST/imo-research/qrt-d3-successor/core2b_o1_figure_diagnostic_217.py
          echo 'NOTE: success confirms safe preattempt redaction and generic authored stage-label RISK; not QRT/accessibility acceptance.'
      - name: Archive native page, protected-W stage-label risk JSON and pinned renderer receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo217-o1-core2-safe-preattempt-stage-label-review
          path: |
            build/imo182-qrt/d3/explain/core1a.html
            build/imo182-qrt/d3/explain/core2a.html
            build/imo182-qrt/d3/explain/core2b.html
            build/imo182-qrt/d3/explain/render-receipt.json
            build/imo182-qrt/d3-successor/o1-core2-figure-diagnostic/
          if-no-files-found: warn
          retention-days: 30
