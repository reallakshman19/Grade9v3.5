name: IMO 182 QRT RETRIEVE-D1 actual five-role render (TEST)
on:
  pull_request:
    paths:
      - '.github/workflows/imo182-qrt-d1-retrieve.yml'
      - 'TEST/imo-research/qrt-d1/retrieve.v1.json'
      - 'TEST/imo-research/qrt-d1/verify_retrieve.py'
      - 'TEST/imo-research/qrt-d1/figures/retrieve-*.svg'
      - 'TEST/products/imo182-qrt-d1-retrieve.manifest.json'
      - 'tests/test_imo182_qrt_d1_retrieve.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored-retrieve-d1:
    name: Actual five blueprint roles and independent classification proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet jsonschema
      - name: Independently classify complete divisor lists
        run: python TEST/imo-research/qrt-d1/verify_retrieve.py
      - name: Sole registered renderer builds five learner pages
        run: |
          python Shared/tools/render_core.py build \
            --manifest TEST/products/imo182-qrt-d1-retrieve.manifest.json \
            --out build/imo182-qrt/d1/retrieve --draft --reference
      - name: Test schema, protected decision, five roles and golden preservation
        run: python -m unittest tests.test_imo182_qrt_d1_retrieve -v
      - name: Certify actual HTML SHA256 receipt
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          folder=Path('build/imo182-qrt/d1/retrieve')
          r=json.loads((folder/'render-receipt.json').read_text())
          assert not r['gaps'],r['gaps']
          names=['core1.html','core1a.html','core1b.html','core2a.html','core2b.html','index.html']
          assert set(names)==set(r['pages']),r['pages']
          actual={n:hashlib.sha256((folder/n).read_bytes()).hexdigest() for n in names}
          assert actual==r['page_sha256'],'Independent SHA6 differs from render receipt'
          j={'cell':'QRT-RETRIEVE-D1','qrt_accepted':'0/28','academic_review':'PENDING','status':'RENDERED_TEST_ONLY','pages':actual,'independent_sha6_receipt_match':True}
          (folder/'d1-retrieve-evidence.json').write_text(json.dumps(j,indent=2)+'\n')
          print(json.dumps(j,indent=2))
          PY
      - name: Upload exact source-bound learner outputs and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo182-qrt-d1-retrieve-five-core-html
          path: build/imo182-qrt/d1/retrieve/
          if-no-files-found: warn
