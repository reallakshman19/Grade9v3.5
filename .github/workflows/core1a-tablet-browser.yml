name: core1a-tablet-browser

# Rendered validation for the governed Core1A Concept Book contract.
# This workflow never publishes learner output; it builds into /tmp and uploads measurements only.
on:
  pull_request:
    paths:
      - ".github/workflows/core1a-tablet-browser.yml"
      - "Shared/tools/render_core.py"
      # Run generated-freshness and tablet evidence on the exact proposed projection.
      - "Shared/tools/build_manifest.py"
      - "Shared/tools/build_core_learning_data.py"
      - "tools/data.js"
      - "public/core-learning/data.js"
      - "docs/architecture-manifest.json"
      - "docs/.pages-manifest.json"
      - "Shared/web/interactive-page-blueprints.v1.json"
      - "public/css/tablet-12-7.css"
      - "public/css/modern-learner.css"
      - "public/js/display-controls.js"
      - "public/js/site-header.js"
      - "tools/site-audit/core-page-audit.mjs"
      - "products/physics/phy-kin-2d-motion.manifest.json"
      - "Physics/library/phy-kin-2d-motion.v1.json"
      - "products/physics/phy-kin-1d-motion.manifest.json"
      - "Physics/library/phy-kin-1d-motion.v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: pip install --quiet jsonschema

      - name: Install pinned browser harness
        run: |
          npm install --no-save playwright@1.56.1
          # Install browser only; do not apt-install runner system packages.
          npx playwright install chromium

      - name: Build exact Motion Core pages into temporary audit root
        run: |
          python3 - <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path
          from Shared.tools import render_core

          manifest = Path("products/physics/phy-kin-2d-motion.manifest.json")
          pages, gaps, digest = render_core.build(manifest, mode="PAGES")
          core1a_gaps = [gap for gap in gaps if gap["core"] == "CORE1A"]
          if core1a_gaps:
              print(json.dumps(core1a_gaps, indent=2))
              raise SystemExit("Core1A render has governed gaps; browser audit aborted")

          root = Path("/tmp/core1a-spec")
          out = root / "products" / "physics" / "phy-kin-2d-motion"
          out.mkdir(parents=True, exist_ok=True)
          for name, content in pages.items():
              (out / name).write_text(content, encoding="utf-8")

          css = root / "css"
          css.mkdir(parents=True, exist_ok=True)
          shutil.copy2("public/css/tablet-12-7.css", css / "tablet-12-7.css")
          shutil.copy2("public/css/modern-learner.css", css / "modern-learner.css")
          scripts = root / "js"
          scripts.mkdir(parents=True, exist_ok=True)
          for name in ("display-controls.js", "site-header.js"):
              shutil.copy2(Path("public/js") / name, scripts / name)
          (root / "render-evidence.json").write_text(
              json.dumps({
                  "manifest": manifest.as_posix(),
                  "mode": "PAGES",
                  "render_digest": digest,
                  "core1a_gap_count": len(core1a_gaps),
                  "all_gap_count": len(gaps),
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"render_digest={digest}")
          print(f"all_gap_count={len(gaps)} core1a_gap_count={len(core1a_gaps)}")
          PY

      - name: Run exact Core1A viewport audit over local HTTP
        run: |
          node tools/site-audit/core-page-audit.mjs             /tmp/core1a-spec/products/physics/phy-kin-2d-motion             --profile core1a-spec             --http-root /tmp/core1a-spec             --enforce             --json /tmp/core1a-spec/core1a-audit.json

      - name: Build derivation-heavy cross-structure witness
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          from Shared.tools import render_core

          manifest = Path("products/physics/phy-kin-1d-motion.manifest.json")
          pages, gaps, digest = render_core.build(manifest, mode="PAGES")
          root = Path("/tmp/core1a-spec")
          out = root / "products" / "physics" / "phy-kin-1d-motion"
          out.mkdir(parents=True, exist_ok=True)
          for name, content in pages.items():
              (out / name).write_text(content, encoding="utf-8")

          css = root / "css"
          css.mkdir(parents=True, exist_ok=True)
          shutil.copy2("public/css/tablet-12-7.css", css / "tablet-12-7.css")
          shutil.copy2("public/css/modern-learner.css", css / "modern-learner.css")
          scripts = root / "js"
          scripts.mkdir(parents=True, exist_ok=True)
          for name in ("display-controls.js", "site-header.js"):
              shutil.copy2(Path("public/js") / name, scripts / name)
          core1a = pages["core1a.html"]
          if 'data-g9-derivation-bridge' not in core1a:
              raise SystemExit("derivation witness did not render the generic derivation bridge")
          (root / "derivation-render-evidence.json").write_text(
              json.dumps({
                  "manifest": manifest.as_posix(),
                  "mode": "PAGES",
                  "render_digest": digest,
                  "core1a_gap_count": len([gap for gap in gaps if gap["core"] == "CORE1A"]),
                  "all_gap_count": len(gaps),
                  "derivation_bridge_present": True,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"derivation_render_digest={digest}")
          print(f"derivation_all_gap_count={len(gaps)}")
          PY

      - name: Run derivation witness through the same six-viewpoint browser matrix
        run: |
          node tools/site-audit/core-page-audit.mjs \
            /tmp/core1a-spec/products/physics/phy-kin-1d-motion \
            --profile core1a-spec \
            --http-root /tmp/core1a-spec \
            --json /tmp/core1a-spec/core1a-derivation-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/core1a-spec/core1a-derivation-audit.json").read_text(encoding="utf-8"))
          core = report["core1a.html"]
          failures = list(core.get("errors") or [])
          for name, row in core["viewports"].items():
              if row["horizontalOverflowPx"] != 0:
                  failures.append(f"{name}: page overflow {row['horizontalOverflowPx']}px")
              if row["smallTargets"] != 0:
                  failures.append(f"{name}: {row['smallTargets']} controls below 48px")
              gap = row["controlGeometry"]["minGapPx"]
              if gap is not None and gap < 8:
                  failures.append(f"{name}: intended control gap {gap}px < 8px")
              if row["tableContainment"]["tablesOutsideLocalScroller"] != 0:
                  failures.append(f"{name}: relation table escaped local scroller")
              if row["anchorSafety"]["riskyAnchors"] != 0:
                  failures.append(f"{name}: sticky-obscured anchor")
              focus = row["focusProbe"]
              if focus["focusFailures"] != 0 or focus["visibleFocus"] != focus["candidates"]:
                  failures.append(
                      f"{name}: focus {focus['visibleFocus']}/{focus['candidates']}, "
                      f"failures={focus['focusFailures']}"
                  )
              interaction = row.get("interaction") or {}
              if (interaction.get("reducedMotion") or {}).get("activeAnimations") != 0:
                  failures.append(f"{name}: reduced-motion animation still active")
              if (interaction.get("zoom200") or {}).get("horizontalOverflowPx") != 0:
                  failures.append(f"{name}: 200% text scaling overflow")
          if failures:
              print("derivation cross-structure browser validation failed:")
              for failure in failures:
                  print(" -", failure)
              raise SystemExit(1)
          print("derivation cross-structure browser validation: PASS")
          PY

      - name: Generated architecture and Pages publication checks
        id: generated_checks
        continue-on-error: true
        run: |
          status=0
          python3 Shared/tools/build_manifest.py --check || status=1
          python3 Shared/tools/build_pages_site.py --check || status=1
          exit "$status"

      - name: Render governed generated preview after drift
        if: steps.generated_checks.outcome == 'failure'
        run: |
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          mkdir -p /tmp/core1a-spec/generated-preview/repo
          git diff --name-only > /tmp/core1a-spec/generated-preview/changed-files.txt
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            mkdir -p "/tmp/core1a-spec/generated-preview/repo/$(dirname "$file")"
            cp "$file" "/tmp/core1a-spec/generated-preview/repo/$file"
          done < /tmp/core1a-spec/generated-preview/changed-files.txt

      - name: Attribute publication drift against exact PR base (diagnostic only)
        if: steps.generated_checks.outcome == 'failure' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: 4dbedc6773482bbecb146ff8959614b2c32dcc6e
        run: |
          set -euo pipefail
          # Pin the actual current main, not the PR event's stale base.sha.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/core1a-spec/exact-base "$BASE_SHA"
          (
            cd /tmp/core1a-spec/exact-base
            python3 Shared/tools/build_manifest.py
            python3 Shared/tools/build_pages_site.py
          )
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          head = Path.cwd()
          baseline = Path("/tmp/core1a-spec/exact-base")
          preview = Path("/tmp/core1a-spec/generated-preview")
          head_changes = (preview / "changed-files.txt").read_text(encoding="utf-8").splitlines()
          base_changes = subprocess.check_output(
              ["git", "-C", str(baseline), "diff", "--name-only"], text=True
          ).splitlines()

          def committed(repo, path):
              read = subprocess.run(
                  ["git", "-C", str(repo), "show", f"HEAD:{path}"],
                  capture_output=True,
              )
              return read.stdout if read.returncode == 0 else None

          def generated(repo, path):
              file = repo / path
              return file.read_bytes() if file.is_file() else None

          def digest(payload):
              return hashlib.sha256(payload).hexdigest() if payload is not None else None

          rows = []
          for path in sorted(set(head_changes) | set(base_changes)):
              old_original = committed(baseline, path)
              old_generated = generated(baseline, path)
              new_original = committed(head, path)
              new_generated = generated(head, path)
              rows.append({
                  "path": path,
                  "base_committed_sha256": digest(old_original),
                  "base_regenerated_sha256": digest(old_generated),
                  "head_committed_sha256": digest(new_original),
                  "head_regenerated_sha256": digest(new_generated),
                  "baseline_stale": old_original != old_generated,
                  "head_stale": new_original != new_generated,
                  "new_staleness": old_original == old_generated and new_original != new_generated,
                  "generated_delta": old_generated != new_generated,
                  "committed_delta": old_original != new_original,
              })
          def components(repo):
              raw = json.loads((repo / "docs/architecture-manifest.json").read_text(encoding="utf-8"))
              return raw, {node["path"]: node for node in raw["components"]}

          old_manifest, old_components = components(baseline)
          new_manifest, new_components = components(head)
          all_component_names = set(old_components) | set(new_components)
          architecture_delta = {
              "base_components": old_manifest["component_count"],
              "head_components": new_manifest["component_count"],
              "base_relations": old_manifest["relation_count"],
              "head_relations": new_manifest["relation_count"],
              "added": sorted(set(new_components) - set(old_components)),
              "removed": sorted(set(old_components) - set(new_components)),
              "changed": sorted(
                  name for name in all_component_names & set(old_components) & set(new_components)
                  if old_components[name] != new_components[name]
              ),
              "changed_roles": sorted({
                  new_components[name]["role"]
                  for name in all_component_names & set(old_components) & set(new_components)
                  if old_components[name] != new_components[name]
              }),
          }
          report = {
              "purpose": "Exact-base generated-drift attribution only; no waiver or publication",
              "base_sha": subprocess.check_output(
                  ["git", "-C", str(baseline), "rev-parse", "HEAD"], text=True
              ).strip(),
              "head_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "rows": rows,
              "architecture_delta": architecture_delta,
          }
          (preview / "exact-base-generated-delta.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core1a-tablet-browser-evidence
          path: |
            /tmp/core1a-spec/core1a-audit.json
            /tmp/core1a-spec/render-evidence.json
            /tmp/core1a-spec/core1a-derivation-audit.json
            /tmp/core1a-spec/derivation-render-evidence.json
            /tmp/core1a-spec/generated-preview
          if-no-files-found: error

      - name: Enforce generated publication checks
        if: steps.generated_checks.outcome == 'failure'
        run: |
          echo "Generated publication checks failed; see uploaded governed preview."
          exit 1
