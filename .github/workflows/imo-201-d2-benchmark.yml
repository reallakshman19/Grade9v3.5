name: IMO 201 D2 native golden semantic benchmark
on:
  pull_request:
    paths:
      - '.github/workflows/imo-201-d2-benchmark.yml'
      - 'TEST/imo-research/qrt-d2/**'
      - 'TEST/products/imo182-qrt-d2-*.manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-d2-technique:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA
        run: |
          python -m pip install --quiet jsonschema playwright
          python -m playwright install --with-deps chromium
      - name: Render seven actual native five-role products
        run: |
          set -euo pipefail
          for demand in retrieve explain apply model represent synthesize justify; do
            python Shared/tools/render_core.py build \
              --manifest "TEST/products/imo182-qrt-d2-${demand}.manifest.json" \
              --out "build/imo201/d2/${demand}" --draft --reference
          done
      - name: Check frozen golden locks, semantic technique, and browser learner gates
        run: |
          python TEST/imo-research/qrt-d2/benchmark_201.py \
            --render-root build/imo201/d2 \
            --output build/imo201/d2/benchmark-results.json \
            --browser
      - name: Upload rendered native evidence and discrepancy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-201-seven-d2-native-pages-and-benchmark
          path: build/imo201/d2/
          if-no-files-found: warn
