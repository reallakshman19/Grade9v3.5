name: IMO Track A #173 — held four-role golden and real A4 evidence

on:
  pull_request:
    paths:
      - 'TEST/products/imo-g9-track-a-four-role-*.manifest.json'
      - 'tests/test_imo_173_four_role.py'
      - 'tests/benchmark_imo_173_golden.py'
      - 'tests/imo_173_core1b_browser.mjs'
      - 'tests/check_imo_173_a4.py'
      - '.github/workflows/imo-track-a-173.yml'
permissions:
  contents: read

jobs:
  authored-four-role:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical renderer and real print evidence parsers
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5' 'pypdf>=5,<7'
      - name: Four-role TEST only, dual variants, source exclusion and canonical record authority
        run: python -m unittest discover -s tests -p 'test_imo_173_four_role.py' -v
      - name: Render both actual candidate golden families with the unchanged canonical renderer
        run: |
          python Shared/tools/build_golden.py --id G-MATH-LINEAR-CONSTRAINT
          python Shared/tools/build_golden.py --id G-CORE2-R2
      - name: Real rendered semantic / technique comparison, SHA bound
        run: |
          python tests/benchmark_imo_173_golden.py \
            "${{ github.event.pull_request.head.sha }}" \
            "$RUNNER_TEMP/imo-173-golden-semantic-matrix.json"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium for actual browser and PDFs
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Build both review-only four-role learner sites through sole renderer
        run: |
          site="$RUNNER_TEMP/imo-173-site"
          mkdir -p "$site/css" "$site/js" "$site/standalone/research/five" "$site/standalone/research/boundary"
          cp public/css/modern-learner.css public/css/tablet-12-7.css "$site/css/"
          cp public/js/display-controls.js public/js/site-header.js "$site/js/"
          python Shared/tools/render_core.py build \
            --manifest TEST/products/imo-g9-track-a-four-role-five-120.manifest.json \
            --out "$site/standalone/research/five" --draft --reference
          python Shared/tools/render_core.py build \
            --manifest TEST/products/imo-g9-track-a-four-role-boundary-12.manifest.json \
            --out "$site/standalone/research/boundary" --draft --reference
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          for v in ('five', 'boundary'):
              p = Path(os.environ['RUNNER_TEMP'])/'imo-173-site/standalone/research'/v
              r = json.loads((p/'render-receipt.json').read_text())
              assert r['output_roles'] == ['CORE2A', 'CORE1A', 'CORE1B', 'CORE2B']
              assert set(r['pages']) == {'index.html','core2a.html','core1a.html','core1b.html','core2b.html'}
              assert not r.get('gaps') and not r.get('advisories')
              print(v, 'TEST CANDIDATE FOUR ROLE', r['digest'])
          PY
      - name: A/B real Chromium, both solution states, Core1B gates and responsive screenshots
        run: |
          site="$RUNNER_TEMP/imo-173-site/standalone/research"
          five="$RUNNER_TEMP/imo-173-evidence-five"
          boundary="$RUNNER_TEMP/imo-173-evidence-boundary"
          node tests/imo_blueprint_first_browser.mjs "$site/five" "$five" five
          node tests/imo_173_core1b_browser.mjs "$site/five" "$five" five
          node tests/imo_blueprint_first_browser.mjs "$site/boundary" "$boundary" boundary
          node tests/imo_173_core1b_browser.mjs "$site/boundary" "$boundary" boundary
      - name: Deny transfer and Core1B pre-commit solution leakage in actual A4 PDFs
        run: |
          python tests/check_imo_164_print.py \
            "$RUNNER_TEMP/imo-173-evidence-five" \
            "$RUNNER_TEMP/imo-173-evidence-boundary"
          python tests/check_imo_173_a4.py \
            "$RUNNER_TEMP/imo-173-evidence-five" \
            "$RUNNER_TEMP/imo-173-evidence-boundary"
      - name: Hold labelled exact-head evidence for Owner and named independent reviewers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo-173-four-role-candidate-golden-browser-a4
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/imo-173-golden-semantic-matrix.json
            ${{ runner.temp }}/imo-173-evidence-five/
            ${{ runner.temp }}/imo-173-evidence-boundary/
            ${{ runner.temp }}/imo-173-site/standalone/research/five/render-receipt.json
            ${{ runner.temp }}/imo-173-site/standalone/research/boundary/render-receipt.json
            golden/units/G-MATH-LINEAR-CONSTRAINT/rendered/
            golden/units/G-CORE2-R2/rendered/
