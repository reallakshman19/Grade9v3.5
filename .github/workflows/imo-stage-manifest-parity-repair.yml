# Temporary same-repo-only generator repair for PR #155.
# Remove this workflow after successful repair; no live release is authorized.
name: IMO staging runtime manifest parity repair
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/imo-stage-manifest-parity-repair.yml'
permissions:
  contents: write
jobs:
  exact-generator-repair:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent1/imo-matrix-first-authored-justify-d3-130' &&
      github.event.pull_request.number == 155
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild runtime manifest and all mirrors with canonical generators
        run: |
          set -euo pipefail
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_pages_site.PagesSiteTest.test_committed_pages_mirror_is_current -v
      - name: Fail closed if unrelated generated assets would change
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
            "tools/data.js", "public/core-learning/data.js",
            "docs/tools/data.js", "docs/core-learning/data.js",
            "docs/.pages-manifest.json",
          }
          dirty = set(subprocess.check_output(
            ["git", "diff", "--name-only"], text=True).splitlines())
          dirty.update(subprocess.check_output(
            ["git", "ls-files", "--others", "--exclude-standard"],
            text=True).splitlines())
          print("Regenerated file differences:", sorted(dirty))
          unexpected = dirty - allowed
          if unexpected:
              raise SystemExit("Refuse out-of-scope generated changes: "
                               + ", ".join(sorted(unexpected)))
          PY
      - name: Commit only verified manifest and Pages projection bytes
        run: |
          set -euo pipefail
          git add -- tools/data.js public/core-learning/data.js \
            docs/tools/data.js docs/core-learning/data.js docs/.pages-manifest.json
          if git diff --cached --quiet; then
            echo "No generated updates needed."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(core): refresh stale manifest runtime assets and Pages mirrors'
          git push origin 'HEAD:refs/heads/agent1/imo-matrix-first-authored-justify-d3-130'
