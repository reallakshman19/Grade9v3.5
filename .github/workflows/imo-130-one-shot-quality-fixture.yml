name: IMO 130 one-shot quality fixture contract check
on:
  push:
    branches:
      - agent1/imo-matrix-first-authored-justify-d3-130
    paths:
      - .github/workflows/imo-130-one-shot-quality-fixture.yml
permissions:
  contents: write
jobs:
  verify-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Use matching Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install governed schema validator
        run: python -m pip install 'jsonschema>=4.22,<5'
      - name: Run targeted visual gate falsifier and architecture checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_quality_gate.py
          python -m unittest discover -s tests -p 'test_quality_gate.py' -k test_removing_both_required_practice_visuals_reports_each_core -v
          python Shared/tools/build_manifest.py
          python Shared/tools/build_manifest.py --check
          python Shared/tools/build_pages_site.py --check
      - name: Fail closed on unexpected output and remove own workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/imo-130-one-shot-quality-fixture.yml
          git status --short
          while IFS= read -r changed; do
            case "$changed" in
              docs/architecture-manifest.json|.github/workflows/imo-130-one-shot-quality-fixture.yml) ;;
              *) echo "UNEXPECTED CHANGE: $changed" >&2; exit 1 ;;
            esac
          done < <( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows/imo-130-one-shot-quality-fixture.yml docs/architecture-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(imo): verify scoped quality-gate fixture; remove one-shot workflow (#130)"
            git push origin "HEAD:refs/heads/agent1/imo-matrix-first-authored-justify-d3-130"
          fi
