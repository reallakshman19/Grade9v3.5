name: IMO 182 Core1A golden learner page evidence

on:
  pull_request:
    paths:
      - '.github/workflows/imo-182-core1a-golden.yml'
      - 'tests/imo_182_core1a_golden.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core1a-page-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing renderer, browser and A4 receipt dependencies
        run: |
          python -m pip install --quiet jsonschema pypdf
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validate existing selected Core1A package and renderer (O1)
        run: |
          python -m unittest tests.test_core1a_renderer_maturity -v
          python -m unittest tests.test_core_authored_qrt_repair_journey -v
          python Shared/tools/question_review_matrix.py check
          python Shared/tools/render_core.py gaps \
            --manifest TEST/products/core1a-divisibility-render-maturity.manifest.json \
            --reference
      - name: Build TEST-stamped Core1A learner HTML and same-page A4 PDF receipt (O1)
        run: |
          python Shared/tools/deploy_test.py product \
            TEST/products/core1a-divisibility-render-maturity.manifest.json --no-mirror
      - name: Render the CANDIDATE golden with the same sole renderer
        run: |
          python Shared/tools/build_golden.py --id G-MATH-LINEAR-CONSTRAINT
      - name: Compare actual blueprint slots, required components, stages and A4 binding
        run: |
          python tests/imo_182_core1a_golden.py \
            --product public/test/products/core1a-divisibility-render-maturity \
            --golden golden/units/G-MATH-LINEAR-CONSTRAINT/rendered \
            --report "$RUNNER_TEMP/imo-182-core1a-golden-comparison.json"
      - name: Observe the actual generated learner page at four sizes and 200 percent
        run: |
          node tools/site-audit/core1a-render-maturity-audit.mjs \
            public/test/products/core1a-divisibility-render-maturity
      - name: Verify TEST/A4 statuses without claiming human acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/test/products/core1a-divisibility-render-maturity')
          r=json.loads((p/'deploy-receipt.json').read_text())
          q=json.loads((p/'qa-evidence'/'qa-report.json').read_text())
          assert r['accepted'] is False and r['draft'] is True
          assert r['pdf']['status']=='PRINTED',r['pdf']
          assert q['manual_screen_reader']=='NOT_RUN'
          assert q['learner_comprehension']=='NOT_RUN'
          assert not q['failures'],q['failures']
          PY
      - name: Upload review-only TEST page, learner PDF, screenshots and digest receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo-182-core1a-test-golden-owner-review
          path: |
            public/test/products/core1a-divisibility-render-maturity/
            ${{ runner.temp }}/imo-182-core1a-golden-comparison.json
          retention-days: 7
          if-no-files-found: warn
