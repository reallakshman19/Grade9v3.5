name: IMO 130 one-shot held oracle validation
on:
  push:
    branches:
      - agent1/imo-matrix-first-authored-justify-d3-130
    paths:
      - .github/workflows/imo-130-one-shot-held-oracle-check.yml
permissions:
  contents: write
jobs:
  validate-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scoped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Match schema validation Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSON schema validation
        run: python -m pip install 'jsonschema>=4.22,<5'
      - name: Check truthful held exit oracle and falsifier tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile TEST/imo-research/validate_core1a_candidate_package.py
          python TEST/imo-research/validate_core1a_candidate_package.py
          python TEST/imo-research/validate_core1a_test_review.py
          python -m unittest discover -s tests -p 'test_imo_core1a_candidate_package.py' -v
          python -m unittest discover -s tests -p 'test_imo_core1a_test_review.py' -v
          python Shared/tools/build_manifest.py
          python Shared/tools/build_manifest.py --check
          python Shared/tools/build_pages_site.py
          python Shared/tools/build_pages_site.py --check
      - name: Fail closed and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/imo-130-one-shot-held-oracle-check.yml
          git status --short
          while IFS= read -r changed; do
            case "$changed" in
              docs/architecture-manifest.json|docs/data/data.js|docs/tools/data.js|.github/workflows/imo-130-one-shot-held-oracle-check.yml) ;;
              *) echo "UNEXPECTED CHANGE: $changed" >&2; exit 1 ;;
            esac
          done < <( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows/imo-130-one-shot-held-oracle-check.yml docs/architecture-manifest.json docs/data/data.js docs/tools/data.js
          if ! git diff --cached --quiet; then
            git commit -m "build(imo): regenerate truthful oracle hold architecture and remove check workflow (#130)"
            git push origin "HEAD:refs/heads/agent1/imo-matrix-first-authored-justify-d3-130"
          fi
