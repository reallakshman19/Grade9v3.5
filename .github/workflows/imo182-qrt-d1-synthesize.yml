name: IMO 182 QRT SYNTHESIZE-D1 actual five-role render (TEST)
on:
  pull_request:
    paths:
      - '.github/workflows/imo182-qrt-d1-synthesize.yml'
      - 'TEST/imo-research/qrt-d1/synthesize.v1.json'
      - 'TEST/imo-research/qrt-d1/verify_synthesize.py'
      - 'TEST/imo-research/qrt-d1/figures/synthesize-*.svg'
      - 'TEST/products/imo182-qrt-d1-synthesize.manifest.json'
      - 'tests/test_imo182_qrt_d1_synthesize.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored-synthesize-d1:
    name: Sole renderer SYNTHESIZE-D1 five roles and frozen golden
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet jsonschema
      - name: Independent mathematical oracle
        run: python TEST/imo-research/qrt-d1/verify_synthesize.py
      - name: Generate registered roles by sole renderer
        run: |
          python Shared/tools/render_core.py build \
            --manifest TEST/products/imo182-qrt-d1-synthesize.manifest.json \
            --out build/imo182-qrt/d1/synthesize --draft --reference
      - name: Schema, five roles, H3 gating and frozen golden
        run: python -m unittest tests.test_imo182_qrt_d1_synthesize -v
      - name: Five exact role HTML SHA and zero reference-depth gaps
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          out=Path('build/imo182-qrt/d1/synthesize')
          receipt=json.loads((out/'render-receipt.json').read_text())
          assert receipt['gaps']==[],receipt['gaps']
          roles=['core1.html','core1a.html','core1b.html','core2a.html','core2b.html']
          assert set(roles)<=set(receipt['pages'])
          evidence={'cell':'QRT-SYNTHESIZE-D1','status':'RENDERED_TEST_ONLY','academic_review':'PENDING','accepted':'0/28','pages':{x:hashlib.sha256((out/x).read_bytes()).hexdigest() for x in roles}}
          (out/'d1-synthesize-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imo182-qrt-d1-synthesize-five-core-html
          path: build/imo182-qrt/d1/synthesize/
          if-no-files-found: warn
