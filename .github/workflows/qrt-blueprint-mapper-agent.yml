name: QRT question-first custom agent contract

on:
  pull_request:
    paths:
      - '.github/agents/qrt-blueprint-mapper.agent.md'
      - 'docs/method/QRT-QUESTION-FIRST-AGENT.md'
      - 'tests/test_qrt_blueprint_mapper_agent.py'
      - '.github/workflows/qrt-blueprint-mapper-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate agent discoverability and existing QRT/Core authority links
        run: python -m unittest tests.test_qrt_blueprint_mapper_agent -v
