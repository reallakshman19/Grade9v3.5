name: F02 one-time governed generated-data parity repair (draft only)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/imo-f02-generated-refresh-once.yml"
permissions:
  contents: write
jobs:
  governed-refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent2/imo-f02-index-laws-goldens-138' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact same-repo Draft branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Use generator dependency versions
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install governed builder requirements
        run: python -m pip install --quiet jsonschema
      - name: Regenerate only exact preflight-audited seven files and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "agent2/imo-f02-index-laws-goldens-138"
          test -f .github/workflows/imo-f02-generated-refresh-once.yml
          # One-shot helper is removed BEFORE architecture hashing. It does not
          # become a persistent privileged workflow or affect the final manifest.
          rm .github/workflows/imo-f02-generated-refresh-once.yml
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          git add -A
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import subprocess
          expected = {
            "docs/architecture-manifest.json": "a69055c4b3547a1355cd3a28d23882bbee399a670744b74cbb14643953fdbb2e",
            "docs/core-learning/data.js": "2b5568a7d0afaacb31ce374c157df50d79f89f12389184d9e6ad7b9815514969",
            "docs/data/data.js": "151bb206f898749600581229dd0da7a31ef4f361191a8c330515eb51c1d171a0",
            "docs/tools/data.js": "151bb206f898749600581229dd0da7a31ef4f361191a8c330515eb51c1d171a0",
            "public/core-learning/data.js": "2b5568a7d0afaacb31ce374c157df50d79f89f12389184d9e6ad7b9815514969",
            "public/data/data.js": "151bb206f898749600581229dd0da7a31ef4f361191a8c330515eb51c1d171a0",
            "tools/data.js": "151bb206f898749600581229dd0da7a31ef4f361191a8c330515eb51c1d171a0",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          allowed = set(expected) | {".github/workflows/imo-f02-generated-refresh-once.yml"}
          if actual != allowed:
              print("GOVERNED_REFRESH_PATH_MISMATCH", sorted(actual ^ allowed))
              raise SystemExit(1)
          for name, digest in sorted(expected.items()):
              got = sha256(Path(name).read_bytes()).hexdigest()
              if got != digest:
                  print("GOVERNED_REFRESH_SHA_MISMATCH", name)
                  raise SystemExit(1)
          print("ALL_SEVEN_EXACT_HEAD_GOVERNED_GENERATED_BYTES_MATCH_BROWSER_PREVIEW")
          print("TEMPORARY_WRITE_WORKFLOW_REMOVED_BEFORE_COMMIT")
          PY
      - name: Push guarded generated parity commit to same Draft branch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(generated): rebuild seven governed F02 draft projections (#138)"
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
