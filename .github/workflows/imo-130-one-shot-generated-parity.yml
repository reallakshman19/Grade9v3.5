name: IMO 130 one-shot TEST projection parity
on:
  push:
    branches:
      - agent1/imo-matrix-first-authored-justify-d3-130
    paths:
      - Shared/tools/render_core.py
permissions:
  contents: write
jobs:
  regenerate-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scoped branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Select generator Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matching schema validator
        run: python -m pip install 'jsonschema>=4.22,<5'
      - name: Verify the source edit and generate with governed tools
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Opt-in A4 print: keep authored factor diagrams visible' Shared/tools/render_core.py
          python Shared/tools/deploy_test.py pages
          python Shared/tools/build_manifest.py
          python Shared/tools/build_pages_site.py
          python Shared/tools/build_manifest.py --check
          python Shared/tools/build_pages_site.py --check
      - name: Fail closed for unexpected generated diffs and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/imo-130-one-shot-generated-parity.yml
          git status --short
          while IFS= read -r changed; do
            case "$changed" in
              public/test/index.html|public/test/rungs/index.html|public/test/deployments/index.html|\
              docs/test/index.html|docs/test/rungs/index.html|docs/test/deployments/index.html|\
              docs/architecture-manifest.json|docs/.pages-manifest.json|\
              .github/workflows/imo-130-one-shot-generated-parity.yml) ;;
              *) echo "UNEXPECTED CHANGE: $changed" >&2; exit 1 ;;
            esac
          done < <( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows/imo-130-one-shot-generated-parity.yml
          git add -u -- public/test/index.html public/test/rungs/index.html public/test/deployments/index.html docs/test/index.html docs/test/rungs/index.html docs/test/deployments/index.html docs/architecture-manifest.json docs/.pages-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(imo): regenerate branch-scoped TEST and Pages parity; remove one-shot workflow (#130)"
            git push origin "HEAD:refs/heads/agent1/imo-matrix-first-authored-justify-d3-130"
          fi
