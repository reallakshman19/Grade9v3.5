# One-shot dependency-matched generator repair, self-removed in the same commit.
name: IMO verified manifest parity with tablet dependencies
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/imo-stage-verified-manifest-parity.yml'
permissions:
  contents: write
jobs:
  self-removing-exact-generator:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent1/imo-matrix-first-authored-justify-d3-130' &&
      github.event.pull_request.number == 155
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Match tablet-browser generator dependencies and remove one-shot source
        run: |
          set -euo pipefail
          pip install --quiet jsonschema
          git rm -- .github/workflows/imo-stage-verified-manifest-parity.yml
      - name: Regenerate source runtime and Pages mirrors using identical dependency stack
        run: |
          set -euo pipefail
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_pages_site.PagesSiteTest.test_committed_pages_mirror_is_current -v
      - name: Guard all generated outputs against unrelated writes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
            ".github/workflows/imo-stage-verified-manifest-parity.yml",
            "tools/data.js", "public/data/data.js",
            "public/core-learning/data.js", "docs/data/data.js",
            "docs/tools/data.js", "docs/core-learning/data.js",
            "docs/architecture-manifest.json", "docs/.pages-manifest.json"
          }
          dirty = set()
          for command in (["git", "diff", "--name-only"],
                          ["git", "diff", "--cached", "--name-only"],
                          ["git", "ls-files", "--others", "--exclude-standard"]):
              dirty.update(subprocess.check_output(command, text=True).splitlines())
          print("Dependency-matched generated differences:", sorted(dirty))
          if dirty - allowed:
              raise SystemExit("Out-of-scope projection files: " + repr(sorted(dirty - allowed)))
          PY
      - name: Commit verified generated outputs and self-deletion atomically
        run: |
          set -euo pipefail
          git add -- tools/data.js public/data/data.js public/core-learning/data.js \
            docs/data/data.js docs/tools/data.js docs/core-learning/data.js \
            docs/architecture-manifest.json docs/.pages-manifest.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'fix(core): use schema-qualified runtime data projections on draft staging'
          git push origin 'HEAD:refs/heads/agent1/imo-matrix-first-authored-justify-d3-130'
