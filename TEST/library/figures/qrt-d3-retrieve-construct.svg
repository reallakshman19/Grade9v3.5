<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 498" role="img" aria-label="Three distinct diagonal property tests on an unrelated concept canvas" style="width:100%;max-width:620px;height:auto" font-family="system-ui,sans-serif"><title>Three distinct diagonal property tests on an unrelated concept canvas</title><desc>Stage one compares midpoint marks on separate segments. Stage two shows a right-angle crossing. Stage three compares independent segment lengths. These are independent prerequisite tests; no target coordinates, class verdict or protected bridge is supplied.</desc><g data-g9-stage-id="RD3-CRIT-MID"><rect x="12" y="10" width="690" height="139" rx="12" fill="#f2f5f9" stroke="#24364d" stroke-width="2"/><text x="28" y="48" font-size="27" fill="#172033">1 · Compare two midpoint marks</text><path d="M70 100 H294 M390 100 H615" stroke="#24364d" stroke-width="5"/><circle cx="182" cy="100" r="8" fill="#24364d"/><circle cx="503" cy="100" r="8" fill="#24364d"/></g>
<g data-g9-stage-id="RD3-CRIT-ORTHO"><rect x="12" y="159" width="690" height="155" rx="12" fill="#f2f5f9" stroke="#24364d" stroke-width="2"/><text x="28" y="199" font-size="27" fill="#172033">2 · Test a right-angle crossing</text><path d="M210 269 H510 M360 219 V299" stroke="#24364d" stroke-width="5"/><path d="M360 250 H382 V269" stroke="#62788c" stroke-width="3" fill="none"/></g>
<g data-g9-stage-id="RD3-CRIT-HIER"><rect x="12" y="324" width="690" height="160" rx="12" fill="#f2f5f9" stroke="#24364d" stroke-width="2"/><text x="28" y="366" font-size="27" fill="#172033">3 · Compare lengths independently</text><path d="M65 410 H305 M420 410 H625" stroke="#24364d" stroke-width="6"/><text x="175" y="447" font-size="26" fill="#26384a">L1</text><text x="505" y="447" font-size="26" fill="#26384a">L2</text></g></svg>
