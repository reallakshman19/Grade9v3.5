<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 20" role="img" aria-label="D3 construct CORE1A unmarked exponent model" font-family="system-ui,sans-serif" font-size="22"><title>D3 construct CORE1A unmarked exponent model</title><desc>Authored exponent-law symbols and terms. No protected target common variable, solved model, numerical answer, or transfer verdict appears.</desc><g data-g9-stage-id="D3M-LAW"><rect x="10" y="10" width="820" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="22" y="55" fill="#172033">9^r = (3^2)^r : linked bases</text></g><g data-g9-stage-id="D3M-FACTOR"><rect x="10" y="105" width="820" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="22" y="150" fill="#172033">For b positive: b^(r+1) = b x b^r</text></g><g data-g9-stage-id="D3M-FALSIFY"><rect x="10" y="200" width="820" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="22" y="245" fill="#172033">r=2: 3^3=27; 3 x 3^2=27; 3^2+3=12</text></g></svg>
