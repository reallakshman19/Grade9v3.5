<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-label="Four schematic coordinate locations with a free positive parameter" style="width:100%;max-width:620px;height:auto" font-family="system-ui,sans-serif"><title>Four schematic coordinate locations with a free positive parameter</title><desc>The horizontal endpoints are fixed. The two symbolic vertical locations are at p and negative p. The plotted distances are schematic, not to scale and do not determine p.</desc><g data-g9-stage-id="RD3-PARAMETER"><path d="M60 255 H660 M360 35 V485" stroke="#708096" stroke-width="3" fill="none"/><text x="645" y="286" font-size="26" fill="#26384a">x</text><text x="378" y="48" font-size="26" fill="#26384a">y</text><circle cx="360" cy="255" r="5" fill="#26384a"/><text x="370" y="285" font-size="25" fill="#26384a">O</text><circle cx="96" cy="255" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="64" y="294" font-size="27" fill="#142538">A(-4,0)</text><circle cx="360" cy="85" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="378" y="84" font-size="27" fill="#142538">B(0,p)</text><circle cx="624" cy="255" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="530" y="294" font-size="27" fill="#142538">C(4,0)</text><circle cx="360" cy="425" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="378" y="445" font-size="27" fill="#142538">D(0,-p)</text><text x="62" y="477" font-size="26" fill="#26384a">p &gt; 0; schematic, not to scale</text></g></svg>
