<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 438" role="img" aria-label="Equal square areas of opposite signed values" style="width:100%;max-width:620px;height:auto" font-family="system-ui,sans-serif"><title>Equal square areas of opposite signed values</title><desc>Number line marks minus three and plus three; equal-area tiles have squared value nine. Independent counterexample without target equation roots.</desc><g data-g9-stage-id="ED3-COUNTER"><rect x="11" y="10" width="697" height="412" rx="12" fill="#f2f5f9" stroke="#24364d" stroke-width="2"/><text x="28" y="49" font-size="27" fill="#152638">Different signed inputs, equal squares</text><path d="M90 132 H630" stroke="#24364d" stroke-width="4"/><circle cx="177" cy="132" r="8" fill="#24364d"/><circle cx="361" cy="132" r="8" fill="#24364d"/><circle cx="545" cy="132" r="8" fill="#24364d"/><text x="153" y="172" font-size="26">-3</text><text x="350" y="172" font-size="26">0</text><text x="527" y="172" font-size="26">+3</text><rect x="146" y="206" width="135" height="135" fill="#dceff4" stroke="#2b5871" stroke-width="4"/><rect x="438" y="206" width="135" height="135" fill="#f9e8d4" stroke="#944b19" stroke-width="4"/><text x="151" y="385" font-size="27">(-3)² = 9</text><text x="447" y="385" font-size="27">(+3)² = 9</text></g></svg>
