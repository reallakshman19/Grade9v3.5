<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="jd3Title jd3Desc"><title id="jd3Title">Core 1B false-warrant reconstruction</title><desc id="jd3Desc">Unmarked triple ending at t; decide whether factor six is enough for factor twelve and commit before repair.</desc><rect width="800" height="280" rx="16" fill="#f4f8fb"/><g data-g9-stage-id="CORE1B-GIVEN-FACTORS" role="group" aria-label="Independent false-warrant diagnostic">
<rect x="16" y="42" width="768" height="220" rx="14" fill="white" stroke="#29425b" stroke-width="2"/>
<text x="28" y="72" fill="#40617a" font-size="16">Independent false-warrant diagnostic</text>
<text x="28" y="94" fill="#142d48" font-size="28">(t−2) × (t−1) × t</text>
<text x="28" y="134" fill="#142d48" font-size="22">Is a guaranteed factor of six enough for twelve?</text>
<text x="28" y="174" fill="#142d48" font-size="22">Write a counterexample or a universal warrant.</text>
</g></svg>
