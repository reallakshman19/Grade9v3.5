<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 390 594" role="img"
 aria-label="Three-stage proof of divisibility of the product of three consecutive integers"
 font-family="system-ui, sans-serif" font-size="26" fill="currentColor">
  <style>@media print { g[data-g9-stage-id] { display:inline !important; } }</style>
  <title>Why three consecutive factors guarantee a multiple of six</title>
  <desc>First stage uses adjacent parity to guarantee a factor of two. Second stage checks all three residue classes modulo three to guarantee a factor of three. Third stage combines coprime divisors two and three to prove divisibility by six for every positive integer start.</desc>
  <g data-g9-stage-id="DIV-STEP-PARITY">
    <!-- Extent preserved even when later teaching stages are hidden. -->
    <rect x="0" y="0" width="390" height="594" fill="none" stroke="none" aria-hidden="true"/>
    <text x="20" y="43" font-weight="700">1 · Parity guarantee</text>
    <text x="22" y="94">n , n+1 , n+2</text>
    <text x="22" y="141">n and n+1 differ by 1</text>
    <text x="22" y="187">so one is even: factor 2.</text>
  </g>
  <g data-g9-stage-id="DIV-STEP-RESIDUES">
    <text x="20" y="252" font-weight="700">2 · Remainders modulo 3</text>
    <line x1="20" y1="269" x2="367" y2="269" stroke="currentColor" stroke-width="2"/>
    <text x="22" y="314">n mod 3 = 0  →  n</text>
    <text x="22" y="357">n mod 3 = 1  →  n+2</text>
    <text x="22" y="400">n mod 3 = 2  →  n+1</text>
  </g>
  <g data-g9-stage-id="DIV-STEP-COPRIME">
    <text x="20" y="459" font-weight="700">3 · Combine valid factors</text>
    <text x="22" y="501">2 and 3 are coprime</text>
    <text x="22" y="543">so 6 divides the product</text>
    <text x="22" y="580">for every n.</text>
  </g>
</svg>
