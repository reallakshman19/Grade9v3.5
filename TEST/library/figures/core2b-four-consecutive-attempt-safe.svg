<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 170" style="width:100%;max-width:600px!important;height:auto" role="img" aria-label="Four consecutive integer factors k, k plus one, k plus two, k plus three. No proof or divisor highlighted." font-family="system-ui, sans-serif" font-size="23">
<title>Four consecutive factors: the unmarked transfer input</title>
<desc>Four unmarked rectangles show k, k+1, k+2 and k+3 with multiplication signs. Decide whether the proposed claim always holds; no factor, divisor or correct verdict is marked.</desc>
<g data-g9-stage-id="CORE2B-FOUR-FACTORS-ONLY">
<rect x="10" y="30" width="165" height="90" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="92" y="83" fill="#172033" text-anchor="middle">k</text>
<text x="189" y="83" fill="#172033">×</text>
<rect x="228" y="30" width="165" height="90" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="310" y="83" fill="#172033" text-anchor="middle">k + 1</text>
<text x="407" y="83" fill="#172033">×</text>
<rect x="445" y="30" width="165" height="90" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="528" y="83" fill="#172033" text-anchor="middle">k + 2</text>
<text x="624" y="83" fill="#172033">×</text>
<rect x="660" y="30" width="150" height="90" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="735" y="83" fill="#172033" text-anchor="middle">k + 3</text>
</g>
</svg>
