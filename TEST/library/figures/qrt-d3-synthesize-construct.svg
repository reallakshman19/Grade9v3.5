<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 655" role="img" aria-label="Generic three stage decimal digit construction" style="width:100%;max-width:620px;height:auto" font-family="system-ui,sans-serif"><title>Generic three stage decimal digit construction</title><desc>Cards for H,T,U, equal arrows and distinct digit bounds, without target middle cases or answer.</desc><g data-g9-stage-id="SD3-DIGITS"><rect x="12" y="10" width="695" height="200" rx="10" fill="#f8fafc" stroke="#6c8396" stroke-width="2"/><text x="32" y="50" font-size="27">1 · Hundreds, tens and units</text><rect x="75" y="78" width="155" height="92" rx="10" fill="#e5eff9" stroke="#345a79" stroke-width="3"/><text x="149" y="141" font-size="43" text-anchor="middle" fill="#1c3850">H</text><rect x="270" y="78" width="155" height="92" rx="10" fill="#e5eff9" stroke="#345a79" stroke-width="3"/><text x="344" y="141" font-size="43" text-anchor="middle" fill="#1c3850">T</text><rect x="465" y="78" width="155" height="92" rx="10" fill="#e5eff9" stroke="#345a79" stroke-width="3"/><text x="539" y="141" font-size="43" text-anchor="middle" fill="#1c3850">U</text></g><g data-g9-stage-id="SD3-GAPS"><rect x="12" y="220" width="695" height="200" rx="10" fill="#f8fafc" stroke="#6c8396" stroke-width="2"/><text x="32" y="259" font-size="27">2 · Matching changes</text><circle cx="152" cy="345" r="25" fill="#e3eef8" stroke="#38627d" stroke-width="3"/><text x="152" y="354" font-size="28" text-anchor="middle">H</text><circle cx="352" cy="345" r="25" fill="#e3eef8" stroke="#38627d" stroke-width="3"/><text x="352" y="354" font-size="28" text-anchor="middle">T</text><circle cx="552" cy="345" r="25" fill="#e3eef8" stroke="#38627d" stroke-width="3"/><text x="552" y="354" font-size="28" text-anchor="middle">U</text><path d="M181 345 H322 l-15 -9 m15 9 l-15 9 M381 345 H521 l-15 -9 m15 9 l-15 9" stroke="#335c79" stroke-width="4" fill="none"/><text x="211" y="403" font-size="24">same gap</text><text x="410" y="403" font-size="24">same gap</text></g><g data-g9-stage-id="SD3-BOUNDS"><rect x="12" y="432" width="695" height="209" rx="10" fill="#f8fafc" stroke="#6c8396" stroke-width="2"/><text x="31" y="473" font-size="27">3 · Different bounds for each place</text><rect x="36" y="504" width="306" height="87" rx="10" fill="#e3f3ea" stroke="#3b7253" stroke-width="2"/><rect x="364" y="504" width="309" height="87" rx="10" fill="#ebeafa" stroke="#555d98" stroke-width="2"/><text x="55" y="559" font-size="27">H: 1 to 9</text><text x="384" y="559" font-size="27">U: 0 to 9</text><text x="36" y="626" font-size="24">A three-digit number cannot begin with zero.</text></g></svg>
