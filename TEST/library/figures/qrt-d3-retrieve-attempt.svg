<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-label="Four labelled points on a coordinate plane, unconnected" style="width:100%;max-width:620px;height:auto" font-family="system-ui,sans-serif"><title>Four labelled points on a coordinate plane, unconnected</title><desc>A, B, C and D are plotted at their given coordinates without any connecting sides or diagonals. No quadrilateral class, midpoint, measured diagonal length or solution is provided.</desc><g data-g9-stage-id="RD3-POINTS"><path d="M60 255 H660 M360 35 V485" stroke="#708096" stroke-width="3" fill="none"/><text x="645" y="286" font-size="26" fill="#26384a">x</text><text x="378" y="48" font-size="26" fill="#26384a">y</text><circle cx="360" cy="255" r="5" fill="#26384a"/><text x="370" y="285" font-size="25" fill="#26384a">O</text><circle cx="96" cy="255" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="65" y="294" font-size="27" fill="#142538">A(-4,0)</text><circle cx="360" cy="85" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="378" y="84" font-size="27" fill="#142538">B(0,3)</text><circle cx="624" cy="255" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="530" y="294" font-size="27" fill="#142538">C(4,0)</text><circle cx="360" cy="425" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="378" y="445" font-size="27" fill="#142538">D(0,-3)</text></g></svg>
