<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" role="img" aria-label="Three generic sign and square stages" style="width:100%;max-width:620px;height:auto" font-family="system-ui,sans-serif"><title>Three generic sign and square stages</title><desc>The signed plus and minus three have the same square; one forward implication arrow; principal square root lies on nonnegative ray. Target solution is not represented.</desc><g data-g9-stage-id="ED3-SQUARES"><rect x="12" y="10" width="695" height="130" rx="10" fill="#f2f5f9" stroke="#24364d" stroke-width="2"/><text x="29" y="48" font-size="27" fill="#152638">1 · Opposite signs, equal squares</text><path d="M110 104 H615" stroke="#24364d" stroke-width="4"/><circle cx="190" cy="104" r="7" fill="#24364d"/><circle cx="365" cy="104" r="7" fill="#24364d"/><circle cx="540" cy="104" r="7" fill="#24364d"/><text x="165" y="130" font-size="26">-3</text><text x="354" y="130" font-size="26">0</text><text x="520" y="130" font-size="26">+3</text></g><g data-g9-stage-id="ED3-ARROW"><rect x="12" y="153" width="695" height="135" rx="10" fill="#f2f5f9" stroke="#24364d" stroke-width="2"/><text x="29" y="191" font-size="27" fill="#152638">2 · Forward implication only</text><text x="90" y="250" font-size="33">A = B</text><path d="M270 236 H438 l-18 -13 m18 13 l-18 13" fill="none" stroke="#24364d" stroke-width="4"/><text x="465" y="250" font-size="32">A² = B²</text></g><g data-g9-stage-id="ED3-SIGN"><rect x="12" y="300" width="695" height="152" rx="10" fill="#f2f5f9" stroke="#24364d" stroke-width="2"/><text x="29" y="338" font-size="27" fill="#152638">3 · Principal-root range</text><path d="M95 387 H625" stroke="#718398" stroke-width="4"/><circle cx="342" cy="387" r="7" fill="#263d55"/><path d="M342 387 H620" stroke="#263d55" stroke-width="9"/><text x="330" y="426" font-size="26">0</text><text x="490" y="426" font-size="25">nonnegative</text></g></svg>
