<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-label="Three generic 2x2 grid stages, no target coordinates" style="width:100%;max-width:620px;height:auto" font-family="system-ui,sans-serif"><title>Generic shortest paths, one marker and two ordered markers</title><desc>Independent tiny 2x2 grids teach path representation, without solving the target 4x4 question.</desc><g data-g9-stage-id="PD3-GRID"><rect x="12" y="12" width="696" height="197" rx="10" fill="#f4f8fc" stroke="#678095" stroke-width="2"/><path d="M65 184 V42 M65 184 H207" stroke="#899fb0" stroke-width="3"/><path d="M136 184 V42 M65 113 H207" stroke="#899fb0" stroke-width="3"/><path d="M207 184 V42 M65 42 H207" stroke="#899fb0" stroke-width="3"/><circle cx="65" cy="184" r="7" fill="white" stroke="#17486b" stroke-width="3"/><text x="78" y="175" font-size="26">S</text><circle cx="207" cy="42" r="7" fill="white" stroke="#17486b" stroke-width="3"/><text x="220" y="33" font-size="26">T</text><text x="285" y="84" font-size="28" fill="#172e43">E/N step words</text></g><g data-g9-stage-id="PD3-ONE"><rect x="12" y="220" width="696" height="197" rx="10" fill="#f4f8fc" stroke="#678095" stroke-width="2"/><path d="M65 392 V250 M65 392 H207" stroke="#899fb0" stroke-width="3"/><path d="M136 392 V250 M65 321 H207" stroke="#899fb0" stroke-width="3"/><path d="M207 392 V250 M65 250 H207" stroke="#899fb0" stroke-width="3"/><circle cx="65" cy="392" r="7" fill="white" stroke="#17486b" stroke-width="3"/><text x="78" y="383" font-size="26">S</text><circle cx="136" cy="321" r="7" fill="white" stroke="#17486b" stroke-width="3"/><text x="149" y="312" font-size="26">U</text><circle cx="207" cy="250" r="7" fill="white" stroke="#17486b" stroke-width="3"/><text x="220" y="241" font-size="26">T</text><text x="285" y="292" font-size="28" fill="#172e43">Through one marker</text></g><g data-g9-stage-id="PD3-TWO"><rect x="12" y="428" width="696" height="197" rx="10" fill="#f4f8fc" stroke="#678095" stroke-width="2"/><path d="M65 600 V458 M65 600 H207" stroke="#899fb0" stroke-width="3"/><path d="M136 600 V458 M65 529 H207" stroke="#899fb0" stroke-width="3"/><path d="M207 600 V458 M65 458 H207" stroke="#899fb0" stroke-width="3"/><circle cx="65" cy="600" r="7" fill="white" stroke="#17486b" stroke-width="3"/><text x="78" y="591" font-size="26">S</text><circle cx="136" cy="600" r="7" fill="white" stroke="#17486b" stroke-width="3"/><text x="149" y="591" font-size="26">U</text><circle cx="136" cy="529" r="7" fill="white" stroke="#17486b" stroke-width="3"/><text x="149" y="520" font-size="26">V</text><circle cx="207" cy="458" r="7" fill="white" stroke="#17486b" stroke-width="3"/><text x="220" y="449" font-size="26">T</text><text x="285" y="500" font-size="28" fill="#172e43">Ordered markers</text></g></svg>
