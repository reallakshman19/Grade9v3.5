<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 495" role="img" aria-label="Two intersecting diagonals with unequal endpoint placements" style="width:100%;max-width:620px;height:auto" font-family="system-ui,sans-serif"><title>Two intersecting diagonals with unequal endpoint placements</title><desc>A horizontal diagonal has endpoints at x minus three and three. A vertical diagonal has one endpoint three units above the axis and the other one unit below. Right angle is visible, midpoint relation not marked.</desc><g data-g9-stage-id="RD3-KITE"><path d="M120 300 H600 M360 60 V380" stroke="#344861" stroke-width="5" fill="none"/><path d="M360 280 H383 V300" stroke="#637992" stroke-width="3" fill="none"/><circle cx="120" cy="300" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="58" y="344" font-size="27" fill="#142538">A(-3,0)</text><circle cx="600" cy="300" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="522" y="344" font-size="27" fill="#142538">C(3,0)</text><circle cx="360" cy="60" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="379" y="65" font-size="27" fill="#142538">B(0,3)</text><circle cx="360" cy="380" r="9" fill="#fff" stroke="#183552" stroke-width="4"/><text x="380" y="400" font-size="27" fill="#142538">D(0,-1)</text><text x="45" y="460" font-size="26" fill="#26384a">Compare segment midpoints yourself</text></g></svg>
