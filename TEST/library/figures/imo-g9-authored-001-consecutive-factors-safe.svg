<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 225" style="width:100%;max-width:620px!important;height:auto" role="img" aria-label="Three optional visual views of a consecutive-integer problem" font-family="system-ui, sans-serif" font-size="24">
<title>Authored practice 001: explore the given consecutive factors</title>
<desc>Three views separately show the symbolic factors, adjacent parity, and three possible remainders. The learner must still decide what follows from the separate observations.</desc>
<g data-g9-stage-id="AUTHORED-001-FACTORS-ONLY">
<text x="20" y="35" fill="#172033" font-size="23">The given factors</text>
<rect x="16" y="65" width="190" height="100" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="111" y="125" fill="#172033" text-anchor="middle">n</text>
<text x="230" y="126" fill="#172033">×</text>
<rect x="265" y="65" width="190" height="100" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="360" y="125" fill="#172033" text-anchor="middle">n + 1</text>
<text x="480" y="126" fill="#172033">×</text>
<rect x="515" y="65" width="190" height="100" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="610" y="125" fill="#172033" text-anchor="middle">n + 2</text>
</g>
<g data-g9-stage-id="AUTHORED-001-PARITY-OBSERVE">
<text x="20" y="35" fill="#172033" font-size="23">Inspect adjacent parity</text>
<rect x="16" y="65" width="310" height="100" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="171" y="124" fill="#172033" text-anchor="middle">n</text>
<rect x="380" y="65" width="310" height="100" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="535" y="124" fill="#172033" text-anchor="middle">n + 1</text>
<text x="360" y="200" fill="#172033" font-size="19" text-anchor="middle">Adjacent integers alternate even and odd.</text>
</g>
<g data-g9-stage-id="AUTHORED-001-RESIDUES-OBSERVE">
<text x="20" y="33" fill="#172033" font-size="23">Inspect the three possible remainders</text>
<text x="26" y="72" fill="#172033" font-size="20">n mod 3</text>
<text x="295" y="72" fill="#172033" font-size="20">A factor with remainder 0</text>
<path d="M 20 84 H 700 M 20 122 H 700 M 20 160 H 700 M 250 50 V 198" stroke="#64748b" stroke-width="2" fill="none"/>
<text x="92" y="111" fill="#172033">0</text>
<text x="330" y="111" fill="#172033">n</text>
<text x="92" y="149" fill="#172033">1</text>
<text x="330" y="149" fill="#172033">n + 2</text>
<text x="92" y="187" fill="#172033">2</text>
<text x="330" y="187" fill="#172033">n + 1</text>
</g>
</svg>
