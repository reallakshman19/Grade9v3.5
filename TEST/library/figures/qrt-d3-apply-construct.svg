<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Three generic prime exponent stages" style="width:100%;max-width:620px;height:auto" font-family="system-ui,sans-serif"><title>Three generic prime exponent stages</title><desc>Generic prime p, exponential power multiplier and joint bound; no original target numerals or result.</desc><g data-g9-stage-id="AD3-PRIME"><rect x="13" y="14" width="692" height="136" rx="12" fill="#f2f6fa" stroke="#41566d" stroke-width="2"/><text x="35" y="55" font-size="27" fill="#17283a">1 · A prime p appears e times in u</text><g fill="#dae7f2" stroke="#244a6b" stroke-width="3"><rect x="65" y="84" width="80" height="45" rx="7"/><rect x="163" y="84" width="80" height="45" rx="7"/><rect x="261" y="84" width="80" height="45" rx="7"/></g><text x="91" y="116" font-size="27">p</text><text x="190" y="116" font-size="27">p</text><text x="286" y="116" font-size="27">...</text></g>
<g data-g9-stage-id="AD3-POWER"><rect x="13" y="161" width="692" height="136" rx="12" fill="#f2f6fa" stroke="#41566d" stroke-width="2"/><text x="35" y="203" font-size="27" fill="#17283a">2 · Raising u to r multiplies exponents</text><text x="96" y="267" font-size="34" fill="#162b40">(pᵉ)ʳ</text><path d="M300 254 H462 l-18 -12 m18 12 l-18 12" stroke="#344861" stroke-width="4" fill="none"/><text x="500" y="265" font-size="35" fill="#162b40">pᵉʳ</text></g>
