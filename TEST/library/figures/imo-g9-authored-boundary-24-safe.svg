<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img"
 aria-label="Three exploratory views of two proposed consecutive-integer claims"
 font-family="system-ui, sans-serif" font-size="24">
<title>Authored boundary transfer: compare three-factor and four-factor products</title>
<desc>View the given P and Q factors and the two divisibility questions. This drawing does not prove or disprove either universal claim or identify an exceptional starting value.</desc>
<g data-g9-stage-id="BOUNDARY-24-THREE-FACTORS">
  <text x="22" y="38" fill="#172033" font-size="23">P(n): three consecutive factors</text>
  <rect x="36" y="74" width="224" height="106" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="148" y="137" fill="#172033" text-anchor="middle">n</text>
  <text x="278" y="140" fill="#172033" font-size="26">×</text>
  <rect x="324" y="74" width="224" height="106" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="436" y="137" fill="#172033" text-anchor="middle">n + 1</text>
  <text x="567" y="140" fill="#172033" font-size="26">×</text>
  <rect x="622" y="74" width="224" height="106" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="734" y="137" fill="#172033" text-anchor="middle">n + 2</text>
  <text x="450" y="222" fill="#475569" font-size="18" text-anchor="middle">n can be any positive integer</text>
</g>
<g data-g9-stage-id="BOUNDARY-24-FOUR-FACTORS">
  <text x="22" y="38" fill="#172033" font-size="23">Q(n): four consecutive factors</text>
  <rect x="22" y="78" width="175" height="96" rx="14" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
  <text x="109" y="136" fill="#172033" text-anchor="middle">n</text>
  <text x="208" y="139" fill="#172033">×</text>
  <rect x="249" y="78" width="175" height="96" rx="14" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
  <text x="336" y="136" fill="#172033" text-anchor="middle">n + 1</text>
  <text x="438" y="139" fill="#172033">×</text>
  <rect x="476" y="78" width="175" height="96" rx="14" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
  <text x="563" y="136" fill="#172033" text-anchor="middle">n + 2</text>
  <text x="664" y="139" fill="#172033">×</text>
  <rect x="703" y="78" width="175" height="96" rx="14" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
  <text x="790" y="136" fill="#172033" text-anchor="middle">n + 3</text>
  <text x="450" y="222" fill="#475569" font-size="18" text-anchor="middle">Which relationships hold for every start?</text>
</g>
<g data-g9-stage-id="BOUNDARY-24-COMPARE-CLAIMS">
  <text x="22" y="38" fill="#172033" font-size="23">Compare what each claim asks</text>
  <rect x="22" y="66" width="415" height="127" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="229" y="105" fill="#172033" text-anchor="middle" font-size="20">Claim A</text>
  <text x="229" y="147" fill="#172033" text-anchor="middle" font-size="20">12 divides P(n) for all n?</text>
  <rect x="463" y="66" width="415" height="127" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="670" y="105" fill="#172033" text-anchor="middle" font-size="20">Claim B</text>
  <text x="670" y="147" fill="#172033" text-anchor="middle" font-size="20">24 divides Q(n) for all n?</text>
  <text x="450" y="222" fill="#475569" font-size="17" text-anchor="middle">Choose proof or disproof yourself; neither verdict is shown</text>
</g>
</svg>
