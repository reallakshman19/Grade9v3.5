<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 399" role="img" aria-label="Two separate digit misconception examples" style="width:100%;max-width:620px;height:auto" font-family="system-ui,sans-serif"><title>Two separate digit misconception examples</title><desc>246 forms an arithmetic progression but is not divisible9; 036 is a leading zero digit word.</desc><g data-g9-stage-id="SD3-COUNTER"><rect x="12" y="10" width="696" height="377" rx="10" fill="#f9fafc" stroke="#7e91a2" stroke-width="2"/><text x="31" y="52" font-size="27">Compare these two mistakes</text><rect x="30" y="83" width="314" height="254" rx="10" fill="#e6f1f9" stroke="#37617f" stroke-width="3"/><rect x="367" y="83" width="316" height="254" rx="10" fill="#fff1e7" stroke="#a46c3e" stroke-width="3"/><text x="60" y="164" font-size="61">2  4  6</text><text x="402" y="164" font-size="61">0  3  6</text><text x="50" y="226" font-size="26">Equal steps</text><text x="50" y="282" font-size="26">Digit sum12</text><text x="391" y="226" font-size="26">Equal steps</text><text x="391" y="282" font-size="26">Leading zero</text><text x="32" y="372" font-size="24">Check both divisibility and decimal positions.</text></g></svg>
