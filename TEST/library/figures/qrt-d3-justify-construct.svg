<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="jd3Title jd3Desc"><title id="jd3Title">Three-stage generic proof construction</title><desc id="jd3Desc">Stages reveal parity, a complete modulo-three warrant and coprimality for the known divisibility by six, not the unproved twelve classification.</desc><rect width="800" height="280" rx="16" fill="#f4f8fb"/><g data-g9-stage-id="DIV-STEP-PARITY" role="group" aria-label="Stage 1: guaranteed factor two">
<rect x="16" y="42" width="768" height="220" rx="14" fill="white" stroke="#29425b" stroke-width="2"/>
<text x="28" y="72" fill="#40617a" font-size="28">Stage 1: guaranteed factor two</text>
<text x="28" y="94" fill="#142d48" font-size="28">n, n+1, n+2</text>
<text x="28" y="134" fill="#142d48" font-size="28">Two neighbouring integers cannot both be odd.</text>
</g>
<g data-g9-stage-id="DIV-STEP-RESIDUES" role="group" aria-label="Stage 2: modulo three">
<rect x="16" y="42" width="768" height="220" rx="14" fill="white" stroke="#29425b" stroke-width="2"/>
<text x="28" y="72" fill="#40617a" font-size="28">Stage 2: modulo three</text>
<text x="28" y="94" fill="#142d48" font-size="28">n mod 3: 0, 1, or 2</text>
<text x="28" y="134" fill="#142d48" font-size="28">One of any three adjacent factors is divisible by 3.</text>
</g>
<g data-g9-stage-id="DIV-STEP-COPRIME" role="group" aria-label="Stage 3: combine independent warrants">
<rect x="16" y="42" width="768" height="220" rx="14" fill="white" stroke="#29425b" stroke-width="2"/>
<text x="28" y="72" fill="#40617a" font-size="28">Stage 3: combine independent warrants</text>
<text x="28" y="94" fill="#142d48" font-size="28">2 divides P, 3 divides P</text>
<text x="28" y="134" fill="#142d48" font-size="28">gcd(2,3)=1, hence 6 divides P for every n.</text>
</g></svg>
