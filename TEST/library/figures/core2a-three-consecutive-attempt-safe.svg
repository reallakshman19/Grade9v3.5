<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 430 264"
 role="img" aria-labelledby="core2aFactorTitle core2aFactorDesc">
  <title id="core2aFactorTitle">Three adjacent integer factors to investigate</title>
  <desc id="core2aFactorDesc">Read left to right and then continue on the second row: m plus one times m plus two, times m plus three. These are neutral factors and no general proof is supplied.</desc>
  <g data-g9-stage-id="PRACTICE-FACTORS-ONLY" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">
    <g fill="#f1f5f9" stroke="#334155" stroke-width="3">
      <rect x="34" y="22" width="150" height="86" rx="12"/>
      <rect x="247" y="22" width="150" height="86" rx="12"/>
      <rect data-g9-final-factor="true" x="141" y="153" width="150" height="86" rx="12"/>
    </g>
    <g fill="#172033">
      <text x="109" y="76">m + 1</text>
      <text x="322" y="76">m + 2</text>
      <text x="216" y="208">m + 3</text>
      <text x="216" y="76">×</text>
      <text x="109" y="208">×</text>
    </g>
  </g>
</svg>
