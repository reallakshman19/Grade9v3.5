<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 430 264"
 role="img" class="g9-core1b-print-geometry" aria-labelledby="core1bFactorTitle core1bFactorDesc">
  <style>@media print { svg.g9-core1b-print-geometry { width:216px !important; max-width:100% !important; height:auto !important; } }</style>
  <title id="core1bFactorTitle">Three consecutive factor symbols ending at t</title>
  <desc id="core1bFactorDesc">Read from left to right, then continue on the next row: t minus two times t minus one, times t. Three neutral cards without proof markings.</desc>
  <g data-g9-stage-id="CORE1B-GIVEN-FACTORS" font-family="system-ui, sans-serif" font-size="29" text-anchor="middle">
    <g fill="#f1f5f9" stroke="#334155" stroke-width="3">
      <rect x="34" y="22" width="150" height="86" rx="12"/>
      <rect x="247" y="22" width="150" height="86" rx="12"/>
      <rect data-g9-final-factor="true" x="141" y="153" width="150" height="86" rx="12"/>
    </g>
    <g fill="#172033">
      <text x="109" y="76">t − 2</text>
      <text x="322" y="76">t − 1</text>
      <text x="216" y="208">t</text>
      <text x="216" y="76">×</text>
      <text x="109" y="208">×</text>
    </g>
  </g>
</svg>
