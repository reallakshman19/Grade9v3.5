<svg xmlns="http://www.w3.org/2000/svg" width="780" height="190" viewBox="0 0 780 190" role="img" aria-labelledby="boundaryTitle boundaryDesc">
<title id="boundaryTitle">Authored triple boundary question, no verdict</title>
<desc id="boundaryDesc">First stage shows three neutral consecutive factors. Second stage asks if their product is always divisible by twelve without giving the answer.</desc>
<rect width="780" height="190" rx="16" fill="#f8fbff"/>
<g data-g9-stage-id="BOUNDARY-TRIPLE-FACTORS" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">
<g fill="#fff" stroke="#34567c" stroke-width="3"><rect x="35" y="36" width="190" height="110" rx="12"/><rect x="294" y="36" width="190" height="110" rx="12"/><rect x="553" y="36" width="190" height="110" rx="12"/></g>
<g fill="#142d48"><text x="130" y="103">n</text><text x="389" y="103">n+1</text><text x="648" y="103">n+2</text></g>
<g fill="#142d48" font-size="28"><text x="260" y="103">×</text><text x="520" y="103">×</text></g></g>
<g data-g9-stage-id="BOUNDARY-TARGET-12" font-family="Arial, sans-serif" text-anchor="middle">
<rect x="105" y="34" width="570" height="120" rx="12" fill="#fff" stroke="#34567c" stroke-width="3"/>
<text x="390" y="83" fill="#142d48" font-size="29">P(n)=n(n+1)(n+2)</text>
<text x="390" y="124" fill="#142d48" font-size="27">12 divides P(n) for every n?</text>
</g></svg>
