<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 430 302" role="img" aria-labelledby="boundaryTitle boundaryDesc">
<title id="boundaryTitle">Authored triple boundary question, no verdict</title>
<desc id="boundaryDesc">First stage shows n times n plus one, then times n plus two on the second row. Second stage asks if the product is always divisible by twelve without giving the answer.</desc>
<rect width="430" height="302" rx="16" fill="#f8fbff"/>
<g data-g9-stage-id="BOUNDARY-TRIPLE-FACTORS" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">
  <g fill="#fff" stroke="#34567c" stroke-width="3">
    <rect x="34" y="22" width="150" height="86" rx="12"/>
    <rect x="247" y="22" width="150" height="86" rx="12"/>
    <rect data-g9-final-factor="true" x="141" y="153" width="150" height="86" rx="12"/>
  </g>
  <g fill="#142d48">
    <text x="109" y="76">n</text>
    <text x="322" y="76">n+1</text>
    <text x="216" y="208">n+2</text>
    <text x="216" y="76">×</text>
    <text x="109" y="208">×</text>
  </g>
</g>
<g data-g9-stage-id="BOUNDARY-TARGET-12" font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="16" y="62" width="398" height="166" rx="12" fill="#fff" stroke="#34567c" stroke-width="3"/>
  <text x="215" y="124" fill="#142d48" font-size="29">P(n)=n(n+1)(n+2)</text>
  <text x="215" y="173" fill="#142d48" font-size="25">12 divides P(n) for every n?</text>
</g>
</svg>
