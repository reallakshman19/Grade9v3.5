<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" style="max-width:100%;height:auto;display:block" viewBox="0 0 880 188" role="img" aria-labelledby="transferTitle transferDescription">
  <title id="transferTitle">Five consecutive symbolic integer factors</title>
  <desc id="transferDescription">A horizontal product of five neutral factor cards labelled n, n plus one, n plus two, n plus three, and n plus four. The diagram does not identify which factors supply any divisor.</desc>
  <rect width="880" height="188" rx="16" fill="#f8fbff"/>
  <g data-g9-stage-id="FIVE-FACTORS-ONLY" font-family="Arial, sans-serif" font-size="30" text-anchor="middle">
    <g fill="#fff" stroke="#34567c" stroke-width="3">
      <rect x="24" y="44" width="136" height="98" rx="10"/>
      <rect x="199" y="44" width="136" height="98" rx="10"/>
      <rect x="374" y="44" width="136" height="98" rx="10"/>
      <rect x="549" y="44" width="136" height="98" rx="10"/>
      <rect x="724" y="44" width="136" height="98" rx="10"/>
    </g>
    <g fill="#142d48"><text x="92" y="100">n</text><text x="267" y="100">n+1</text><text x="442" y="100">n+2</text><text x="617" y="100">n+3</text><text x="792" y="100">n+4</text></g>
    <g fill="#142d48" font-size="24"><text x="180" y="101">×</text><text x="355" y="101">×</text><text x="530" y="101">×</text><text x="705" y="101">×</text></g>
  </g>
</svg>
