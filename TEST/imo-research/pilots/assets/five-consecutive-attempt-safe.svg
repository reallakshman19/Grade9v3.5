<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 430 262" role="img" aria-labelledby="transferTitle transferDescription">
  <title id="transferTitle">Five consecutive symbolic integer factors</title>
  <desc id="transferDescription">A product of five neutral factor cards across two rows: n times n plus one times n plus two, then times n plus three times n plus four. No divisor has been identified.</desc>
  <rect width="430" height="262" rx="16" fill="#f8fbff"/>
  <g data-g9-stage-id="FIVE-FACTORS-ONLY" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">
    <g fill="#fff" stroke="#34567c" stroke-width="3">
      <rect x="15" y="22" width="105" height="78" rx="10"/>
      <rect x="165" y="22" width="105" height="78" rx="10"/>
      <rect x="315" y="22" width="105" height="78" rx="10"/>
      <rect x="65" y="147" width="115" height="78" rx="10"/>
      <rect data-g9-final-factor="true" x="245" y="147" width="115" height="78" rx="10"/>
    </g>
    <g fill="#142d48">
      <text x="67" y="71">n</text>
      <text x="217" y="71">n+1</text>
      <text x="367" y="71">n+2</text>
      <text x="122" y="197">n+3</text>
      <text x="302" y="197">n+4</text>
    </g>
    <g fill="#142d48" font-size="28">
      <text x="142" y="71">×</text>
      <text x="292" y="71">×</text>
      <text x="33" y="197">×</text>
      <text x="212" y="197">×</text>
    </g>
  </g>
</svg>
