<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img" aria-label="Smaller noncoprime pair" font-family="system-ui,sans-serif" font-size="24" fill="currentColor"><style>@media print { g[data-g9-stage-id] { display:inline !important; } }</style><title>Smaller noncoprime pair</title><desc>Three concept stages: givens, gcd and substitution; not the protected three-period answer.</desc><g data-g9-stage-id="D4-APP-ANCHOR-GIVEN"><rect x="0" y="0" width="680" height="460" fill="none" stroke="none" aria-hidden="true"/><text x="18" y="50" font-weight="600">Two repeating phases</text><text x="20" y="94">x ≡ 2 (mod 6); x ≡ 5 (mod 9)</text></g><g data-g9-stage-id="D4-APP-ANCHOR-GCD"><text x="18" y="184" font-weight="600">Shared divisor</text><text x="20" y="228">gcd(6,9)=3</text></g><g data-g9-stage-id="D4-APP-ANCHOR-REDUCE"><text x="18" y="318" font-weight="600">Candidate expression</text><text x="20" y="362">x = 2 + 6t</text></g></svg>
