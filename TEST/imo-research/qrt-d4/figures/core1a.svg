<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="620" height="180" role="img" aria-label="Concept construction"><title>Concept construction</title><desc>Unclassified given only. The learner must construct the proof.</desc><rect x="2" y="2" width="616" height="176" rx="8" fill="#fbfdff" stroke="#8196aa"/><text x="22" y="42" fill="#234" font-size="20" font-family="sans-serif">Concept construction</text><text x="22" y="114" fill="#162436" font-size="28" font-family="sans-serif">q² − 1 = (q − 1)(q + 1)</text></svg>
