<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" role="img" aria-label="Build a difference of squares in stages" font-family="system-ui, sans-serif" font-size="25" fill="currentColor"><style>@media print { g[data-g9-stage-id] { display:inline !important; } }</style><title>Build a difference of squares in stages</title><desc>Stage one contains the factorization identity only; subsequent conceptual stages are learner controlled.</desc><g data-g9-stage-id="D4-IDENTITY"><rect x="0" y="0" width="620" height="380" fill="none" stroke="none" aria-hidden="true"/><text x="24" y="48" font-weight="700">1 · Factor the difference</text><text x="26" y="97">q² − 1 = (q − 1)(q + 1)</text></g><g data-g9-stage-id="D4-EIGHTS"><text x="24" y="153" font-weight="700">2 · Inspect even neighbors</text><text x="26" y="196">If q is odd, both neighbors</text><text x="26" y="237">are even, two apart.</text></g><g data-g9-stage-id="D4-THREES"><text x="24" y="294" font-weight="700">3 · Inspect mod 3</text><text x="26" y="333">Test q mod 3 = 0, 1, 2.</text></g></svg>
