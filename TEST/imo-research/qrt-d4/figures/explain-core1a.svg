<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" role="img" aria-label="Decimal position construction" font-family="system-ui, sans-serif" font-size="24" fill="currentColor"><style>@media print { g[data-g9-stage-id] { display:inline !important; } }</style><title>Decimal position construction</title><desc>Neutral place-value stages, without even-odd length solution.</desc><g data-g9-stage-id="D4-EXP-STAGE-PLACE"><rect x="0" y="0" width="620" height="430" fill="none" stroke="none" aria-hidden="true"/><text x="20" y="52" font-weight="650">1 · Ten and minus one</text><text x="25" y="93">10 ≡ −1  (mod 11)</text></g><g data-g9-stage-id="D4-EXP-STAGE-TWO"><text x="20" y="180" font-weight="650">2 · Swap two digits</text><text x="25" y="221">10u+v   →   10v+u</text></g><g data-g9-stage-id="D4-EXP-STAGE-SPLIT"><text x="20" y="308" font-weight="650">3 · A symbolic rotation</text><text x="25" y="349">N=a×10^(L−1)+B</text></g></svg>
