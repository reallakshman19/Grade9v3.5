<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Three-table L construction"><title>Three-table L construction</title><desc>Three conceptual stages: count a small L-shaped set of tables, identify full shared seams and trace its outside boundary.</desc><style>@media print {g[data-g9-stage-id]{display:inline !important}}</style><g data-g9-stage-id="D4-MOD-ANCHOR-CELLS"><text x="18" y="35" font-size="24" fill="currentColor">Count square-table units</text><rect x="58" y="65" width="88" height="88" fill="#bedbef" stroke="#344054"/><rect x="146" y="65" width="88" height="88" fill="#bedbef" stroke="#344054"/><rect x="58" y="153" width="88" height="88" fill="#bedbef" stroke="#344054"/></g><g data-g9-stage-id="D4-MOD-ANCHOR-SEAMS"><text x="18" y="279" font-size="24" fill="currentColor">Trace the shared seams</text><path d="M146 65V153M58 153H146" stroke="#9b2434" stroke-width="6" fill="none"/></g><g data-g9-stage-id="D4-MOD-ANCHOR-EXPOSED"><text x="18" y="360" font-size="24" fill="currentColor">Trace the open outer edge</text><text x="18" y="404" font-size="18" fill="currentColor">This L has no enclosed inner void</text></g></svg>
