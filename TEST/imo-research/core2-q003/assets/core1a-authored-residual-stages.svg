<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="pair-stage-title pair-stage-desc">
  <title id="pair-stage-title">Authored input-output residual test in three stages</title>
  <desc id="pair-stage-desc">The first stage fixes the input-output order for a newly authored pair. The second computes the same square-offset residual for two pairs. The third tests the remaining pairs and identifies one differing residual. None of these pairs comes from the original examination item.</desc>
  <g data-g9-stage-id="VIS-IMO-PAIR-1" fill="currentColor" font-family="system-ui,sans-serif" font-size="24">
    <text x="20" y="42">1. Keep each pair in order</text>
    <text x="20" y="85">Input x = 4, output y = 23</text>
    <path d="M20 106 H540" fill="none" stroke="currentColor" stroke-width="2"/>
  </g>
  <g data-g9-stage-id="VIS-IMO-PAIR-2" fill="currentColor" font-family="system-ui,sans-serif" font-size="24">
    <text x="20" y="146">2. Subtract input squared</text>
    <text x="20" y="186">23 - 4² = 7; 43 - 6² = 7</text>
    <path d="M20 207 H540" fill="none" stroke="currentColor" stroke-width="2"/>
  </g>
  <g data-g9-stage-id="VIS-IMO-PAIR-3" fill="currentColor" font-family="system-ui,sans-serif" font-size="24">
    <text x="20" y="248">3. Compare the other offsets</text>
    <text x="20" y="288">58 - 7² = 9; 88 - 9² = 7</text>
    <text x="20" y="322">9 differs; the constant is 7</text>
  </g>
</svg>
