<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" style="width:100%;max-width:520px!important;height:auto" role="img" aria-label="Unsolved verbal route: four east and two south" font-family="system-ui,sans-serif" font-size="26" fill="#152535"><title>Unsolved verbal route: four east and two south</title><desc>Two spoken route components are given, four grid units east and two grid units south. No signed ordered pair or endpoint is marked.</desc><style>@media print { g[data-g9-stage-id] {display:inline!important;} }</style><g data-g9-stage-id="REP-D1-ROUTE-ONLY"><rect x="20" y="45" width="325" height="110" rx="14" stroke="#47627b" fill="#f6f9fc" stroke-width="3"/><text x="45" y="110">4 grid units EAST</text><rect x="395" y="45" width="325" height="110" rx="14" stroke="#47627b" fill="#f6f9fc" stroke-width="3"/><text x="420" y="110">2 grid units SOUTH</text><text x="70" y="200">Write your own signed (x,y) displacement.</text></g></svg>
