<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" style="width:100%;max-width:520px!important;height:auto" role="img" aria-label="A staged example grid for signed-coordinate direction" font-family="system-ui,sans-serif" font-size="26" fill="#152535"><title>A staged example grid for signed-coordinate direction</title><desc>Initial view shows cardinal axes and the positive directions. Later stages introduce a separate west/north example. The surveyor exercise pair is not displayed.</desc><style>@media print { g[data-g9-stage-id] {display:inline!important;} }</style><g data-g9-stage-id="GRID-ORIENTATION"><line x1="90" y1="210" x2="650" y2="210" stroke="#354c62" stroke-width="3"/><line x1="365" y1="36" x2="365" y2="370" stroke="#354c62" stroke-width="3"/><text x="656" y="220">E +x</text><text x="8" y="220">W −x</text><text x="370" y="30">N +y</text><text x="372" y="403">S −y</text><circle cx="365" cy="210" r="7" fill="#354c62"/><text x="380" y="245">origin</text></g><g data-g9-stage-id="GRID-SAMPLE-STEP"><text x="20" y="90">Different example: 3 west, 1 north</text><path d="M365 210 L215 210 L215 150" stroke="#206878" stroke-width="6" fill="none"/><circle cx="215" cy="150" r="8" fill="#206878"/><text x="20" y="128">Sample pair: (−3,+1)</text></g><g data-g9-stage-id="GRID-REVERSE-CHECK"><text x="20" y="340">Check: (−3,+1) → west 3 and north 1</text></g></svg>
