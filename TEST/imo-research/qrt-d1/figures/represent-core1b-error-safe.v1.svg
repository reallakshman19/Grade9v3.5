<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" style="width:100%;max-width:520px!important;height:auto" role="img" aria-label="A disputed coordinate inscription" font-family="system-ui,sans-serif" font-size="26" fill="#152535"><title>A disputed coordinate inscription</title><desc>The given route is two west and three south. A learner has written negative two, positive three; this is a claim for the student to evaluate, not a corrected answer.</desc><style>@media print { g[data-g9-stage-id] {display:inline!important;} }</style><g data-g9-stage-id="REP-D1-WRONG-ROUTE"><rect x="25" y="36" width="320" height="112" rx="13" fill="#f6f9fc" stroke="#47627b" stroke-width="3"/><text x="40" y="83">Given: 2 west</text><text x="40" y="124">and 3 south</text><rect x="382" y="36" width="330" height="112" rx="13" fill="#fff8ee" stroke="#87643b" stroke-width="3"/><text x="405" y="86">Learner wrote:</text><text x="425" y="128">(−2,+3)</text><text x="45" y="222">Does the pair preserve the spoken route?</text></g></svg>
