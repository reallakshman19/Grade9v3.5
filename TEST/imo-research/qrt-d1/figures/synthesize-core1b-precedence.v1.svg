<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 295" style="width:100%;max-width:535px!important;height:auto" role="img" aria-label="False learner precedence claim" font-family="system-ui,sans-serif" font-size="28"><title>False learner precedence claim</title><desc>Two complete motifs each with four stars and two crescents. Peer falsely claims 4 plus 2 times 2 equals 8; no correction printed.</desc><style>@media print{g[data-g9-stage-id]{display:inline!important;}}</style><g data-g9-stage-id="SYN-D1-WRONG-CLAIM"><rect x="20" y="20" width="716" height="220" rx="12" fill="#f2f7fb" stroke="#547186" stroke-width="3"/><text x="42" y="75" fill="#263d51">Two complete motifs</text><text x="42" y="127" fill="#263d51">Each: 4 stars and 2 crescents</text><text x="42" y="179" fill="#263d51">Peer: 4 + (2 x 2) = 8</text><text x="42" y="231" fill="#263d51">What was NOT repeated?</text></g></svg>
