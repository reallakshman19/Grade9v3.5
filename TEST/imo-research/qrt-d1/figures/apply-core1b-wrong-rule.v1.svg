<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" style="width:100%;max-width:535px!important;height:auto" role="img" aria-label="Disputed addition for rectangle area" font-family="system-ui,sans-serif" font-size="27"><title>Disputed addition for rectangle area</title><desc>Given rectangle 5 centimetres by 3 centimetres. A learner wrote five plus three equals eight square centimetres. This is a wrong claim, not a corrected result.</desc><style>@media print {g[data-g9-stage-id]{display:inline!important;}}</style><g data-g9-stage-id="APP-ERROR-CLAIM"><rect x="45" y="52" width="355" height="130" stroke="#4b6e87" stroke-width="3" fill="#f5f8fb"/><text x="103" y="43" fill="#21374c">Length: 5 cm</text><text x="414" y="133" fill="#21374c">Width: 3 cm</text><text x="30" y="251" fill="#21374c">Student wrote: 5 + 3 = 8 cm²</text></g></svg>
