<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 272" style="width:100%;max-width:550px!important;height:auto" role="img" aria-label="Even complete group and two given subgroup sizes" font-family="system-ui,sans-serif" font-size="27"><title>Even complete group and two given subgroup sizes</title><desc>A collection of eighteen counters can be arranged in nine complete pairs. Seven belong to a known subgroup and eleven to the remaining subgroup. No lone-counter pairing between the subgroups is shown.</desc><g data-g9-stage-id="EXP-D1-QB-GIVENS"><text x="20" y="36" fill="#24374b">Total: 18 counters, nine complete pairs</text><circle cx="42" cy="86" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="71" cy="86" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="100" cy="86" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="129" cy="86" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="158" cy="86" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="187" cy="86" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="216" cy="86" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="245" cy="86" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="274" cy="86" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="42" cy="119" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="71" cy="119" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="100" cy="119" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="129" cy="119" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="158" cy="119" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="187" cy="119" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="216" cy="119" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="245" cy="119" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><circle cx="274" cy="119" r="10" fill="#668fa5" stroke="#324359" stroke-width="1.5"/><text x="20" y="200" fill="#24374b">Known subgroup: 7</text><text x="433" y="200" fill="#24374b">Remaining subgroup: 11</text><text x="20" y="243" fill="#24374b">Explain the remainder using pairing.</text></g></svg>
