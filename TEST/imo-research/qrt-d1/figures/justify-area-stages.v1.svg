<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" style="width:100%;max-width:535px!important;height:auto" role="img" aria-label="Triangle base and altitude, then changed worked numbers and check" font-family="system-ui,sans-serif">
<title>Triangle base and perpendicular altitude: cumulative worked stages</title>
<desc>Stage 1 draws one triangle with base b and perpendicular height h. Stage 2 adds a separate worked base 10 cm and height 4 cm on the same drawing. Stage 3 adds the worked area check 20 square centimetres. The independent twelve-by-seven target problem is not shown.</desc>
<style>text{fill:#173c3b;font-size:30px;stroke:#fff;stroke-width:6px;paint-order:stroke;stroke-linejoin:round}line,path{stroke:#315f65;stroke-width:3;fill:none}@media print{g[data-g9-stage-id]{display:inline!important}}</style>
<g data-g9-stage-id="JUS-STAGE-AREA-MEANING">
<line x1="105" y1="202" x2="650" y2="202"/>
<text font-size="30" x="92" y="229">A</text><text font-size="30" x="643" y="229">B</text>
<path d="M105 202 L285 70 L650 202"/><line x1="285" y1="70" x2="285" y2="202" stroke-dasharray="7 5"/><path d="M285 189 h13 v13"/>
<text font-size="30" x="330" y="68">perpendicular h</text><text font-size="30" x="418" y="249">base b</text>
</g>
<g data-g9-stage-id="JUS-STAGE-WORKED-10-4">
<text font-size="30" x="333" y="133">h = 4 cm</text><text font-size="30" x="175" y="249">10 cm</text>
</g>
<g data-g9-stage-id="JUS-STAGE-WORKED-CHECK">
<text font-size="30" x="140" y="32">10 × 4 ÷ 2 = 20 cm²</text>
</g>
</svg>