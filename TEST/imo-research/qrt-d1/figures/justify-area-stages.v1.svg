<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" style="width:100%;max-width:535px!important;height:auto" role="img" aria-label="Triangle base and altitude: worked example only" font-family="system-ui,sans-serif"><title>Triangle base and altitude: worked example only</title><desc>Three staged views of a separate 10 centimetre base and 4 centimetre perpendicular height triangle; no target 12 by 7 conclusion.</desc><style>text{fill:#173c3b;font-size:21px}line,path{stroke:#315f65;stroke-width:3;fill:none}@media print{g[data-g9-stage-id]{display:inline!important}}</style>
<g data-g9-stage-id="JUS-STAGE-AREA-MEANING"><line x1="105" y1="202" x2="650" y2="202"/><text x="92" y="229">A</text><text x="643" y="229">B</text><path d="M105 202 L282 74 L650 202"/><line x1="282" y1="74" x2="282" y2="202" stroke-dasharray="7 5"/><path d="M282 189 h13 v13"/><text x="330" y="105">perpendicular h</text><text x="365" y="250">base b</text></g>
<g data-g9-stage-id="JUS-STAGE-WORKED-10-4"><line x1="105" y1="202" x2="650" y2="202"/><text x="92" y="229">A</text><text x="643" y="229">B</text><path d="M105 202 L285 70 L650 202"/><line x1="285" y1="70" x2="285" y2="202" stroke-dasharray="7 5"/><path d="M285 189 h13 v13"/><text x="330" y="110">h = 4 cm</text><text x="355" y="248">b = 10 cm</text></g>
<g data-g9-stage-id="JUS-STAGE-WORKED-CHECK"><line x1="105" y1="202" x2="650" y2="202"/><text x="92" y="229">A</text><text x="643" y="229">B</text><path d="M105 202 L460 70 L650 202"/><line x1="460" y1="70" x2="460" y2="202" stroke-dasharray="7 5"/><path d="M460 189 h13 v13"/><text x="160" y="40">Different worked case only</text><text x="300" y="110">10 × 4 ÷ 2 = 20 cm²</text></g></svg>