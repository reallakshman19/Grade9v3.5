<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 292" style="width:100%;max-width:550px!important;height:auto" role="img" aria-label="Pair structure with separate worked example three and five" font-family="system-ui,sans-serif" font-size="23"><title>Pair structure with separate worked example three and five</title><desc>Stage one defines complete pairs and one leftover in an odd group. Later a worked example of three and five is shown. The target seven and nine answer is never shown.</desc><style>@media print {g[data-g9-stage-id]{display:inline!important;}}</style><g data-g9-stage-id="EXP-STAGE-PAIR-RULE"><text x="23" y="36" fill="#20354b">ODD: complete pairs + one lone counter</text><text x="23" y="72" fill="#20354b">EVEN: every counter belongs to a pair</text></g><g data-g9-stage-id="EXP-STAGE-WORKED-3-5"><text x="23" y="120" fill="#20354b">Different worked example: 3 and 5</text><circle cx="75" cy="164" r="11" fill="#a64c43" stroke="#253847" stroke-width="1.5"/><circle cx="106" cy="164" r="11" fill="#a64c43" stroke="#253847" stroke-width="1.5"/><circle cx="137" cy="164" r="11" fill="#a64c43" stroke="#253847" stroke-width="1.5"/><circle cx="295" cy="164" r="11" fill="#396aa1" stroke="#253847" stroke-width="1.5"/><circle cx="326" cy="164" r="11" fill="#396aa1" stroke="#253847" stroke-width="1.5"/><circle cx="357" cy="164" r="11" fill="#396aa1" stroke="#253847" stroke-width="1.5"/><circle cx="388" cy="164" r="11" fill="#396aa1" stroke="#253847" stroke-width="1.5"/><circle cx="419" cy="164" r="11" fill="#396aa1" stroke="#253847" stroke-width="1.5"/><text x="23" y="220" fill="#20354b">One lone from each worked group completes a pair.</text></g><g data-g9-stage-id="EXP-STAGE-GENERAL-CHECK"><text x="23" y="264" fill="#20354b">Worked check: 3 + 5 = 8 = four complete pairs</text></g></svg>
