<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" style="width:100%;max-width:535px!important;height:auto" role="img" aria-label="Staged area rule and separate 3 by 5 rectangle" font-family="system-ui,sans-serif" font-size="27"><title>Staged area rule and separate 3 by 5 rectangle</title><desc>Initial stage states rectangle area equals length times width. Later stages show the distinct worked 3cm by 5cm rectangle and fifteen square-centimetre tiles. No target mat dimensions or area appear.</desc><style>@media print {g[data-g9-stage-id]{display:inline!important;}}</style><g data-g9-stage-id="APP-STAGE-AREA-MEANING"><text x="20" y="39" fill="#21374c">Rectangle AREA = length × width</text><text x="20" y="83" fill="#21374c">Count equal one-centimetre squares.</text></g><g data-g9-stage-id="APP-STAGE-WORKED-3-5"><text x="20" y="139" fill="#21374c">Worked example: length 3, width 5</text><rect x="30" y="155" width="150" height="85" stroke="#4b6e87" stroke-width="3" fill="#f5f8fb"/><text x="212" y="211" fill="#21374c">3 × 5 tiles</text></g><g data-g9-stage-id="APP-STAGE-WORKED-CHECK"><text x="20" y="279" fill="#21374c">Worked check: 3 × 5 = 15 cm²</text></g></svg>
