<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" style="width:100%;max-width:535px!important;height:auto" role="img" aria-label="Different worked: three badges with two circles and one triangle each" font-family="system-ui,sans-serif" font-size="28"><title>Different worked mixed-badge construction</title><desc>Three teaching stages show complete mixed badge then three badges and the nine-piece result, not target banner answer.</desc><style>@media print{g[data-g9-stage-id]{display:inline!important;}}</style><g data-g9-stage-id="SYN-STAGE-UNIT-IDEA"><text x="22" y="45" fill="#243b51">A unit contains ALL its parts.</text></g><g data-g9-stage-id="SYN-STAGE-WORKED-2-1"><text x="22" y="109" fill="#243b51">3 badges, EACH: 2 circles + 1 triangle</text><text x="22" y="160" fill="#243b51">One full badge: 2 + 1 = 3</text></g><g data-g9-stage-id="SYN-STAGE-WORKED-CHECK"><text x="22" y="218" fill="#243b51">3 whole badges: 3 x 3 = 9 pieces</text><text x="22" y="270" fill="#243b51">Check: 6 circles + 3 triangles</text></g></svg>
