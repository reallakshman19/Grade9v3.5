<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" style="width:100%;max-width:535px!important;height:auto" role="img" aria-label="Inverse equal-groups model given total and group size" font-family="system-ui,sans-serif" font-size="28"><title>Inverse equal-groups model given total and group size</title><desc>Given twenty-four seedlings total, four seedlings per equally filled tray, and an unknown number of trays. No solution or tray count is printed.</desc><style>@media print {g[data-g9-stage-id]{display:inline!important;}}</style><g data-g9-stage-id="MOD-D1-QB-INVERSE"><rect x="22" y="30" width="716" height="174" rx="12" stroke="#49617a" stroke-width="3" fill="#f3f8fe"/><text x="50" y="82" fill="#243b51">Total: 24 seedlings</text><text x="50" y="130" fill="#243b51">4 seedlings in each tray</text><text x="50" y="178" fill="#243b51">Number of trays: ?</text><text x="22" y="245" fill="#243b51">Choose the inverse grouping model.</text></g></svg>
