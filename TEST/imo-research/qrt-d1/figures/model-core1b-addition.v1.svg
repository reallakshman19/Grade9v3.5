<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" style="width:100%;max-width:535px!important;height:auto" role="img" aria-label="Unrepaired classmate addition model for four shelves" font-family="system-ui,sans-serif" font-size="28"><title>Unrepaired classmate addition model for four shelves</title><desc>The classmate incorrectly uses four plus two equals six to model four shelves with two lanterns on each shelf. The figure does not mark a correction.</desc><style>@media print {g[data-g9-stage-id]{display:inline!important;}}</style><g data-g9-stage-id="MOD-D1-WRONG-CLAIM"><rect x="25" y="22" width="710" height="178" rx="12" fill="#fff8f0" stroke="#866a40" stroke-width="3"/><text x="50" y="76" fill="#25394c">Given: 4 shelves</text><text x="50" y="119" fill="#25394c">Each shelf holds 2 lanterns.</text><text x="50" y="170" fill="#25394c">Student wrote: 4 + 2 = 6 lanterns</text><text x="25" y="244" fill="#25394c">Evaluate that model before revealing.</text></g></svg>
