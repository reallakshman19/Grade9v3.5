-width="1.4" fill="#ffffff"/><rect x="180" y="113" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="215" y="113" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="40" y="148" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="75" y="148" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="110" y="148" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="145" y="148" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="180" y="148" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="215" y="148" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="40" y="183" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="75" y="183" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="110" y="183" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="145" y="183" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="180" y="183" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="215" y="183" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="40" y="218" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="75" y="218" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="110" y="218" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="145" y="218" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="180" y="218" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><rect x="215" y="218" width="35" height="35" stroke="#334155" stroke-width="1.4" fill="#ffffff"/><text x="330" y="88" font-size="24" font-family="Arial, sans-serif">6 rows × 6 columns</text></g><g data-g9-stage-id="RE-ST2"><rect x="40" y="43" width="210" height="70" fill="#a5c8ea" fill-opacity="0.72" stroke="#334155" stroke-width="2"/><text x="330" y="144" font-size="24" font-family="Arial, sans-serif">First: top 2 whole rows</text></g><g data-g9-stage-id="RE-ST3"><rect x="180" y="113" width="70" height="140" fill="#f2cf92" fill-opacity="0.75" stroke="#334155" stroke-width="2"/><text x="330" y="200" font-size="24" font-family="Arial, sans-serif">Then: right 2 of lower 4 rows</text><text x="330" y="239" font-size="23" font-family="Arial, sans-serif">Compare two counting views</text></g></svg>
